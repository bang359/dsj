<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>万能格式直播播放器</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/dplayer/dist/DPlayer.min.css">
    <style>
        body {
            background: #0b0b0b;
            margin: 0;
            padding: 20px;
            color: #fff;
            font-family: Arial;
        }
        #dplayer {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            border-radius: 10px;
            overflow: hidden;
        }
        .channel {
            padding: 12px 16px;
            background: #1f1f1f;
            margin: 8px auto;
            max-width: 1180px;
            border-radius: 8px;
            cursor: pointer;
        }
        .channel:hover {
            background: #007bff;
        }
    </style>
</head>
<body>

<div id="dplayer"></div>
<div id="channelList" style="max-width:1200px;margin:20px auto;"></div>

<script src="https://cdn.jsdelivr.net/npm/hls.js/dist/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flv.js/dist/flv.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dplayer/dist/DPlayer.min.js"></script>

<script>
let dp;

// 初始化播放器
function initPlayer(url) {
    if (dp) dp.destroy();
    dp = new DPlayer({
        container: document.getElementById('dplayer'),
        autoplay: false,
        theme: '#007bff',
        video: { url: url }
    });
}

// 切换频道
function play(url) {
    initPlayer(url);
}

// 加载你的直播源（完全不修改，原样使用）
const sourceURL = "https://github.com/bang359/dsj/raw/main/iphone.txt";
fetch(sourceURL)
   .then(res => res.text())
   .then(text => {
       const list = document.getElementById("channelList");
       const lines = text.split("\n").map(i=>i.trim()).filter(Boolean);
       let firstURL = "";
       
       lines.forEach(line => {
           if(line.includes(",")){
               const [name, url] = line.split(",", 2);
               if(name && url && url.startsWith("http")){
                   if(!firstURL) firstURL = url;
                   const div = document.createElement("div");
                   div.className = "channel";
                   div.innerText = name;
                   div.onclick = () => play(url);
                   list.appendChild(div);
               }
           }
       });

       // 默认播放第一个频道
       if(firstURL) initPlayer(firstURL);
   })
   .catch(err => console.log("加载失败", err));
</script>

</body>
</html>
