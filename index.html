<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>📺 电视直播</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/video.js@7/dist/video-js.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0b0b0b;color:#fff;font-family:system-ui,sans-serif;padding:12px}
.container{max-width:1200px;margin:0 auto}
.title{text-align:center;margin:0 0 16px;color:#00d9ff}
.video-box{border-radius:12px;overflow:hidden;margin-bottom:16px}
.channel-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;max-height:500px;overflow-y:auto}
.channel-btn{padding:10px;background:#1b1b1b;color:#fff;border:none;border-radius:8px;cursor:pointer}
.channel-btn.active{background:#007bff}
</style>
</head>
<body>

<div class="container">
  <h2 class="title">📺 电视直播</h2>
  <div class="video-box">
    <video id="tv-player" class="video-js vjs-big-play-centered" controls preload="auto" width="100%" height="100%" data-setup='{}'></video>
  </div>
  <div class="channel-grid" id="channelList"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/video.js@7/dist/video.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@videojs/http-streaming@3/dist/videojs-http-streaming.min.js"></script>

<script>
const player = videojs('tv-player', {
  autoplay: true,
  muted: false,
  fluid: true,
  html5: { hls: { overrideNative: true } }
});

const sourceUrl = "https://gh-proxy.org/https://github.com/bang359/dsj/raw/main/iphone.txt";
const channelList = document.getElementById("channelList");
let currentBtn = null;

fetch(sourceUrl)
.then(res => res.text())
.then(text => {
  const lines = text.split('\n').map(i => i.trim()).filter(Boolean);
  lines.forEach(line => {
    if (line.includes(',')) {
      const [name, url] = line.split(',', 2);
      if (url && (url.includes('.m3u8') || url.includes('.ts'))) {
        const btn = document.createElement('button');
        btn.className = 'channel-btn';
        btn.textContent = name;
        btn.onclick = () => {
          if (currentBtn) currentBtn.classList.remove('active');
          currentBtn = btn;
          btn.classList.add('active');
          player.src({ src: url, type: 'application/x-mpegURL' });
          player.play();
        };
        channelList.appendChild(btn);
      }
    }
  });
})
.catch(() => {
  alert("加载失败，请开启CORS插件或刷新重试");
});
</script>
</body>
</html>
