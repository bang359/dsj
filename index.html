<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>📺 通用电视直播</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-font-smoothing: antialiased;
}

:root {
  --bg: #0d0d0f;
  --card: #1a1a1a;
  --active: #007bff;
  --text: #fff;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  padding: 12px;
  padding-bottom: env(safe-area-inset-bottom, 20px);
}

.container {
  max-width: 1200px;
  margin: 0 auto;
}

.title {
  text-align: center;
  font-size: 22px;
  margin-bottom: 12px;
  color: #00d9ff;
}

/* 播放器 */
.player-wrapper {
  background: #000;
  border-radius: 14px;
  overflow: hidden;
  margin-bottom: 16px;
  box-shadow: 0 0 30px rgba(0,0,0,0.5);
}

.video-container {
  position: relative;
  width: 100%;
  padding-top: 56.25%;
}

video {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: #000;
}

/* 频道列表 */
.channel-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 10px;
  max-height: 500px;
  overflow-y: auto;
}

.channel-btn {
  padding: 12px 8px;
  background: var(--card);
  color: #fff;
  border: none;
  border-radius: 10px;
  text-align: center;
  font-size: 14px;
  cursor: pointer;
  transition: 0.2s;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.channel-btn.active {
  background: var(--active);
  font-weight: bold;
}

.channel-btn:hover {
  background: #252525;
}

/* 手机小屏优化 */
@media (max-width: 500px) {
  .channel-grid {
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .channel-btn {
    padding: 10px 6px;
    font-size: 13px;
  }
}
</style>
</head>

<body>
<div class="container">
  <h2 class="title">📺 通用电视直播</h2>
  
  <div class="player-wrapper">
    <div class="video-container">
      <video id="tv" controls playsinline webkit-playsinline></video>
    </div>
  </div>

  <div class="channel-grid" id="channelList"></div>
</div>

<script>
const tv = document.getElementById('tv');
const channelList = document.getElementById('channelList');
let currentBtn = null;

// 你要的直播源
const sourceUrl = "https://gh-proxy.org/https://github.com/bang359/dsj/raw/main/iphone.txt";

// 加载频道
fetch(sourceUrl)
  .then(res => res.text())
  .then(text => {
    const lines = text.split('\n').map(i => i.trim()).filter(Boolean);
    const channels = [];

    lines.forEach(line => {
      if (line.includes(',')) {
        const [name, url] = line.split(',', 2);
        if (url && (url.includes('.m3u8') || url.includes('.ts'))) {
          channels.push({ name, url });
        }
      }
    });

    // 渲染
    channels.forEach((item, i) => {
      const btn = document.createElement('button');
      btn.className = 'channel-btn';
      btn.textContent = item.name;
      btn.onclick = () => play(item.url, btn);
      channelList.appendChild(btn);
      if (i === 0) btn.click();
    });
  })
  .catch(err => {
    alert("加载源失败，请刷新或检查网络");
  });

// 播放
function play(url, btn) {
  if (currentBtn) currentBtn.classList.remove('active');
  currentBtn = btn;
  btn.classList.add('active');

  tv.src = url;
  tv.load();
  tv.play().catch(e => {});
}
</script>
</body>
</html>
