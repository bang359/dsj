
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="网络电视">
<title>网络电视 - 快播经典版</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/dashjs@latest/dist/dash.all.min.js"></script>
<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:"Microsoft YaHei", "PingFang SC", sans-serif;
        -webkit-tap-highlight-color: transparent;
    }
    html,body{
        height:100%;
        background:#0d0d0d;
        color:#fff;
        overflow:hidden;
    }
    .container{
        display:flex;
        height:100vh;
        flex-direction:row;
    }
    .main-area{
        flex:1;
        display:flex;
        flex-direction:column;
        background:#1a1a1a;
    }
    .video-box{
        flex:1;
        background:#000;
        position:relative;
        display:flex;
        align-items:center;
        justify-content:center;
    }
    video{
        width:100%;
        height:100%;
        object-fit:contain;
        background:#000;
    }
    .loading{
        position:absolute;
        color:#00cc66;
        font-size:16px;
        display:none;
    }
    .loading.show{
        display:block;
    }
    .toolbar{
        height:50px;
        background:linear-gradient(180deg, #2d2d2d 0%, #1a1a1a 100%);
        border-top:2px solid #00cc66;
        display:flex;
        align-items:center;
        padding:0 15px;
        gap:15px;
    }
    .toolbar-btn{
        background:linear-gradient(180deg, #00cc66 0%, #00a855 100%);
        border:1px solid #00dd77;
        color:#fff;
        padding:6px 16px;
        border-radius:4px;
        font-size:13px;
        cursor:pointer;
        transition:all 0.2s;
    }
    .toolbar-btn:hover{
        background:linear-gradient(180deg, #00dd77 0%, #00cc66 100%);
    }
    .toolbar-title{
        flex:1;
        text-align:center;
        color:#00cc66;
        font-size:14px;
        overflow:hidden;
        text-overflow:ellipsis;
        white-space:nowrap;
    }
    .channel-box{
        width:320px;
        background:#0d0d0d;
        border-left:3px solid #00cc66;
        display:flex;
        flex-direction:column;
    }
    .channel-header{
        background:linear-gradient(180deg, #2d2d2d 0%, #1a1a1a 100%);
        padding:12px 15px;
        border-bottom:2px solid #00cc66;
        font-size:15px;
        color:#00cc66;
        text-align:center;
    }
    .channel-list{
        flex:1;
        overflow-y:auto;
        padding:10px;
    }
    .channel-item{
        width:100%;
        padding:12px 15px;
        background:#1a1a1a;
        border:1px solid #333;
        border-radius:4px;
        color:#00cc66;
        font-size:14px;
        text-align:left;
        margin-bottom:8px;
        cursor:pointer;
        transition:all 0.2s;
    }
    .channel-item:hover{
        background:#2d2d2d;
        border-color:#00cc66;
    }
    .channel-item:active{
        background:#00a855;
    }
    .channel-item.active{
        background:#00cc66;
        border-color:#00cc66;
        color:#fff;
    }
    ::-webkit-scrollbar{
        width:8px;
    }
    ::-webkit-scrollbar-track{
        background:#0d0d0d;
    }
    ::-webkit-scrollbar-thumb{
        background:#00cc66;
        border-radius:4px;
    }
    ::-webkit-scrollbar-thumb:hover{
        background:#00dd77;
    }
    .online-info{
        background:rgba(0,0,0,0.5);
        padding:4px 10px;
        border-radius:10px;
        font-size:12px;
        display:flex;
        align-items:center;
        gap:5px;
    }
    .weather-bar{
        background:linear-gradient(180deg, #1a1a1a 0%, #0d0d0d 100%);
        border-top:1px solid #333;
        padding:8px 15px;
        display:flex;
        align-items:center;
        justify-content:space-between;
    }
    .weather-info{
        color:#00cc66;
        font-size:13px;
        display:flex;
        align-items:center;
        gap:8px;
    }
    .reward-mini{
        background:linear-gradient(180deg, #cc3333 0%, #aa2222 100%);
        border:1px solid #dd4444;
        color:#fff;
        padding:4px 12px;
        border-radius:4px;
        font-size:12px;
        cursor:pointer;
    }
    .reward-mini:hover{
        background:linear-gradient(180deg, #dd4444 0%, #cc3333 100%);
    }
    .mobile-nav{
        display:none;
        position:fixed;
        bottom:20px;
        left:50%;
        transform:translateX(-50%);
        background:linear-gradient(180deg, #2d2d2d 0%, #1a1a1a 100%);
        border:2px solid #00cc66;
        border-radius:25px;
        padding:8px 15px;
        z-index:998;
        gap:10px;
    }
    .mobile-nav button{
        background:linear-gradient(180deg, #00cc66 0%, #00a855 100%);
        border:1px solid #00dd77;
        color:#fff;
        padding:8px 16px;
        border-radius:20px;
        font-size:14px;
        cursor:pointer;
    }
    @media (max-width: 768px){
        .container{
            flex-direction:column;
        }
        .main-area{
            height:auto;
            flex:none;
        }
        .video-box{
            width:100%;
            height:40vh;
            min-height:180px;
            flex:none;
        }
        .channel-box{
            position:relative;
            width:100%;
            height:calc(100vh - 40vh - 50px - 36px);
            border-left:none;
            border-top:3px solid #00cc66;
            flex:1;
        }
        .channel-header{
            padding:10px 12px;
            font-size:14px;
        }
        .channel-list{
            padding:8px;
        }
        .channel-item{
            padding:12px 14px;
            font-size:14px;
            margin-bottom:6px;
        }
        .mobile-nav{
            display:flex;
        }
        .toolbar-title{
            font-size:11px;
        }
        .weather-bar{
            padding:5px 10px;
        }
        .weather-info{
            font-size:11px;
        }
        .online-info{
            font-size:11px;
            padding:3px 8px;
        }
        .reward-mini{
            font-size:11px;
            padding:3px 8px;
        }
    }
</style>
</head>
<body>
<div class="container">
    <div class="main-area">
        <div class="video-box">
            <video id="video" playsinline webkit-playsinline crossorigin="anonymous"></video>
            <div class="loading" id="loading">加载中，请稍候...</div>
        </div>
        <div class="toolbar">
            <div class="online-info">
                <span>👁</span>
                <span id="onlineNumber">0</span>
                <span>人在线</span>
            </div>
            <div class="toolbar-title" id="currentChannel">选择频道观看</div>
            <button class="reward-mini" id="rewardBtn">❤️ 打赏</button>
        </div>
        <div class="weather-bar">
            <div class="weather-info">
                <span>🌤️</span>
                <span id="weatherText">天气加载中...</span>
            </div>
        </div>
    </div>
    <div class="channel-box" id="channelBox">
        <div class="channel-list" id="channelList"></div>
    </div>
</div>
<div class="mobile-nav" id="mobileNav">
    <button id="prevChannel">◀ 上一台</button>
    <button id="nextChannel">下一台 ▶</button>
</div>
<div class="reward-modal" id="rewardModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:2000;justify-content:center;align-items:center;">
    <div style="background:#1a1a1a;border:2px solid #00cc66;border-radius:12px;padding:24px;max-width:320px;width:90%;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
            <h3 style="color:#00cc66;font-size:18px;">❤️ 支持一下</h3>
            <button id="rewardClose" style="background:none;border:none;color:#00cc66;font-size:28px;cursor:pointer;">×</button>
        </div>
        <div style="text-align:center;">
            <img src="https://gh-proxy.org/https://raw.githubusercontent.com/bang359/dsj/main/wx.png" alt="打赏二维码" style="width:200px;height:200px;border-radius:8px;margin-bottom:12px;">
            <p style="color:#00cc66;font-size:14px;">微信扫一扫打赏</p>
        </div>
    </div>
</div>
<script>
const video = document.getElementById('video');
const loading = document.getElementById('loading');
const channelList = document.getElementById('channelList');
const onlineNumber = document.getElementById('onlineNumber');
const currentChannel = document.getElementById('currentChannel');
let hls = null;
let dashPlayer = null;
let currentActive = null;
let channelArray = [];
let currentIndex = -1;
const channelUrls = [
    "https://gh-proxy.org/https://github.com/bang359/dsj/blob/main/iphone.txt"
];
async function loadChannels(){
    channelList.innerHTML = '<div style="color:#00cc66;text-align:center;padding:20px;">加载频道中...</div>';
    try {
        const response = await fetch(channelUrls[0]);
        const text = await response.text();
        const lines = text.split('\n');
        channelList.innerHTML = '';
        channelArray = [];
        let currentCategory = '';
        lines.forEach(line => {
            line = line.trim();
            if(!line) return;
            if(line.startsWith('#')){
                currentCategory = line.replace('#', '').trim();
                if(currentCategory){
                    const header = document.createElement('div');
                    header.style.cssText = 'color:#00cc66;font-size:13px;padding:10px 5px 5px;border-bottom:1px solid #333;margin-bottom:8px;';
                    header.textContent = currentCategory;
                    channelList.appendChild(header);
                }
            } else if(line.includes(',')){
                const parts = line.split(',');
                if(parts.length >= 2){
                    const name = parts[0].trim();
                    const url = parts[1].trim();
                    channelArray.push({name, url});
                    const btn = document.createElement('button');
                    btn.className = 'channel-item';
                    btn.textContent = name;
                    btn.onclick = () => playChannelByIndex(channelArray.length - 1);
                    channelList.appendChild(btn);
                }
            }
        });
    } catch (error) {
        channelList.innerHTML = '<div style="color:#ff6b6b;text-align:center;padding:20px;">频道加载失败</div>';
    }
}
function showLoading(){
    loading.classList.add('show');
}
function hideLoading(){
    loading.classList.remove('show');
}
function playChannelByIndex(index){
    if(index < 0 || index >= channelArray.length) return;
    const item = channelArray[index];
    showLoading();
    if(hls){
        hls.destroy();
        hls = null;
    }
    if(dashPlayer){
        dashPlayer.reset();
        dashPlayer = null;
    }
    video.pause();
    video.src = '';
    video.volume = 0.5;
    video.load();
    if(currentActive) currentActive.classList.remove('active');
    currentActive = channelList.children[index];
    if(currentActive) currentActive.classList.add('active');
    currentIndex = index;
    currentChannel.textContent = item.name;
    const finalUrl = item.url.includes('github.com') && !item.url.includes('raw.githubusercontent.com') ? item.url.replace('github.com', 'raw.githubusercontent.com').replace('/blob/', '/') : item.url;
    if(finalUrl.includes('.m3u8')){
        if(hls.isSupported()){
            hls = new Hls();
            hls.loadSource(finalUrl);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => { video.play().catch(()=>{}); hideLoading(); });
            hls.on(Hls.Events.ERROR, (event, data) => { if(data.fatal){ hideLoading(); } });
        } else if(video.canPlayType('application/vnd.apple.mpegurl')){
            video.src = finalUrl;
            video.play().catch(()=>{});
            hideLoading();
        }
    } else if(finalUrl.includes('.mpd')){
        dashPlayer = dashjs.MediaPlayer().create();
        dashPlayer.initialize(video, finalUrl, true);
        dashPlayer.on('streamInitialized', () => { hideLoading(); });
    } else {
        video.src = finalUrl;
        video.oncanplay = () => { hideLoading(); };
        video.onerror = () => { hideLoading(); };
        video.play().catch(()=>{});
    }
}
function playChannel(url, btn){
    showLoading();
    if(hls){
        hls.destroy();
        hls = null;
    }
    if(dashPlayer){
        dashPlayer.reset();
        dashPlayer = null;
    }
    video.pause();
    video.src = '';
    video.volume = 0.5;
    video.load();
    if(currentActive) currentActive.classList.remove('active');
    btn.classList.add('active');
    currentActive = btn;
    currentChannel.textContent = btn.textContent;
    const finalUrl = url.includes('github.com') && !url.includes('raw.githubusercontent.com') ? url.replace('github.com', 'raw.githubusercontent.com').replace('/blob/', '/') : url;
    if(finalUrl.includes('.m3u8')){
        if(hls.isSupported()){
            hls = new Hls();
            hls.loadSource(finalUrl);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => { video.play().catch(()=>{}); hideLoading(); });
            hls.on(Hls.Events.ERROR, (event, data) => { if(data.fatal){ hideLoading(); } });
        } else if(video.canPlayType('application/vnd.apple.mpegurl')){
            video.src = finalUrl;
            video.play().catch(()=>{});
            hideLoading();
        }
    } else if(finalUrl.includes('.mpd')){
        dashPlayer = dashjs.MediaPlayer().create();
        dashPlayer.initialize(video, finalUrl, true);
        dashPlayer.on('streamInitialized', () => { hideLoading(); });
    } else {
        video.src = finalUrl;
        video.oncanplay = () => { hideLoading(); };
        video.onerror = () => { hideLoading(); };
        video.play().catch(()=>{});
    }
}
video.onplaying = () => { hideLoading(); };
video.onpause = () => { hideLoading(); };
video.onerror = () => { hideLoading(); };
function initViewerCount(){
    const baseCount = Math.floor(Math.random() * 500) + 200;
    onlineNumber.textContent = baseCount;
    setInterval(() => {
        const change = Math.floor(Math.random() * 21) - 10;
        const newCount = Math.max(100, baseCount + Math.floor(Math.random() * 50) + change);
        onlineNumber.textContent = newCount;
    }, 5000);
}
function updateWeather(){
    const fallback = (city) => {
        const conditions = ['晴', '多云', '阴', '小雨', '阵雨'];
        const icons = ['☀️', '⛅', '☁️', '🌧️', '🌦️'];
        const temp = Math.floor(Math.random() * 15) + 15;
        const idx = Math.floor(Math.random() * conditions.length);
        return `${city} ${icons[idx]} ${temp}°C ${conditions[idx]}`;
    };
    const display = (text) => {
        document.getElementById('weatherText').textContent = text;
    };
    fetch('http://ip-api.com/json/')
    .then(r => r.json())
    .then(info => {
        if(info.status === 'success'){
            const city = info.city;
            fetch(`https://api.xcssapi.com/weather/current?location=${city}`)
            .then(r => r.json())
            .then(data => {
                if(data.code === '200' && data.data){
                    const d = data.data;
                    display(`${city} ${d.weather_icon} ${d.temp}°C ${d.weather}`);
                } else {
                    display(fallback(city));
                }
            })
            .catch(() => display(fallback(city)));
        } else {
            display(fallback('未知城市'));
        }
    })
    .catch(() => display(fallback('未知城市')));
}
document.getElementById('rewardBtn').onclick = () => {
    document.getElementById('rewardModal').style.display = 'flex';
};
document.getElementById('rewardClose').onclick = () => {
    document.getElementById('rewardModal').style.display = 'none';
};
document.getElementById('rewardModal').onclick = (e) => {
    if(e.target === document.getElementById('rewardModal')){
        document.getElementById('rewardModal').style.display = 'none';
    }
};
document.getElementById('prevChannel').onclick = () => {
    if(channelArray.length > 0){
        const newIndex = currentIndex <= 0 ? channelArray.length - 1 : currentIndex - 1;
        playChannelByIndex(newIndex);
    }
};
document.getElementById('nextChannel').onclick = () => {
    if(channelArray.length > 0){
        const newIndex = currentIndex >= channelArray.length - 1 ? 0 : currentIndex + 1;
        playChannelByIndex(newIndex);
    }
};
loadChannels().then(() => {
    if(channelArray.length > 0){
        playChannelByIndex(0);
    }
});
initViewerCount();
updateWeather();
setInterval(updateWeather, 300000);
</script>
</body>
</html>
