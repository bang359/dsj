
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>极速直播</title>

<!-- 极速播放器内核 -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.1/dist/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flv.js@1.6.2/dist/flv.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dplayer@1.27.1/dist/DPlayer.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/dplayer@1.27.1/dist/DPlayer.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;overflow:hidden}
.main{display:flex;width:100vw;height:100vh}

/* 播放器区域 */
.player-box{position:relative;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
#dplayer{width:100%!important;height:100%!important;position:relative!important;z-index:1!important}

/* 确保视频元素和容器正常显示 */
.dplayer-video-wrap{display:block!important;position:relative!important;width:100%!important;height:100%!important;background:#000!important;z-index:2!important}
.dplayer-video{display:block!important;position:absolute!important;top:0!important;left:0!important;width:100%!important;height:100%!important;object-fit:contain!important;background:#000!important;z-index:3!important}

/* 隐藏所有按钮图标和控制栏 */
.dplayer-play-icon,.dplayer-pause-icon,.dplayer-mask,.dplayer-icons,.dplayer-controls,.dplayer-controller,.dplayer-loading,.dplayer-button,.dplayer-bar-wrap,.dplayer-time,.dplayer-full,.dplayer-full-in-icon,.dplayer-volume,.dplayer-volume-bar,.dplayer-subtitle,.dplayer-logo,.dplayer-controller-mask,.dplayer-controller-button,.dplayer-played,.dplayer-name,.dplayer-live-badge,.dplayer-danmakus,.dplayer-info-panel,.dplayer-tooltip,.dplayer-screenshot-icon,.dplayer-icon-play,.dplayer-icon-pause,.dplayer-icon-volume,.dplayer-icon-fullscreen,.dplayer-icon-fullscreen-exit,.dplayer-icon-subtitle,.dplayer-icon-setting,.dplayer-icon-right,.dplayer-icon-left,.dplayer-controller-mask{display:none!important;opacity:0!important;visibility:hidden!important;width:0!important;height:0!important;pointer-events:none!important}

/* 隐藏DPlayer容器内的所有非视频相关元素 */
.dplayer > *:not(.dplayer-video-wrap){display:none!important;opacity:0!important;visibility:hidden!important;width:0!important;height:0!important;pointer-events:none!important}

/* 确保视频包装器内只有视频元素可见 */
.dplayer-video-wrap > *:not(.dplayer-video){display:none!important;opacity:0!important;visibility:hidden!important;width:0!important;height:0!important;pointer-events:none!important}

/* 隐藏原生视频控件 */
video::-webkit-media-controls{display:none!important}
video::-webkit-media-controls-enclosure{display:none!important}
video::-webkit-media-controls-panel{display:none!important}
video::-webkit-media-controls-play-button{display:none!important}
video::-webkit-media-controls-start-playback-button{display:none!important}

/* 隐藏视频元素的默认播放按钮 */
video::-webkit-media-controls-play-button{display:none!important}
video::-webkit-media-controls-start-playback-button{display:none!important}
video::-webkit-media-controls-overlay-play-button{display:none!important}
video::--webkit-media-controls-play-button{display:none!important}
video::--webkit-media-controls-start-playback-button{display:none!important}
video::--webkit-media-controls-overlay-play-button{display:none!important}

/* 确保没有其他元素干扰 */
.dplayer-mask{display:none!important}
.dplayer-play{display:none!important}
.dplayer-pause{display:none!important}
.dplayer-icon{display:none!important}
.dplayer-control{display:none!important}
.dplayer-controller{display:none!important}
.dplayer-contextmenu{display:none!important}

/* 隐藏任何可能的覆盖层，但保留视频元素 */
.dplayer > div:not(.dplayer-video-wrap){display:none!important}
.dplayer > svg{display:none!important}
.dplayer > canvas{display:none!important}

/* 确保视频元素容器和视频本身都能正常显示 */
.dplayer-video-wrap{display:block!important;position:relative!important;width:100%!important;height:100%!important}
.dplayer-video{display:block!important;position:absolute!important;top:0!important;left:0!important;width:100%!important;height:100%!important;object-fit:contain!important;background:#000!important}

/* 隐藏所有可能的伪元素 */
.dplayer::before,.dplayer::after{display:none!important}
.dplayer-video::before,.dplayer-video::after{display:none!important}

/* 显示进度条相关元素 */
.dplayer-progress,.dplayer-progress-wrap,.dplayer-progress-bar,.dplayer-progress-loaded,.dplayer-progress-played,.dplayer-progress-handle{display:block!important;opacity:1!important;visibility:visible!important;width:auto!important;height:auto!important;pointer-events:auto!important}

/* 隐藏其他控制元素 */
.dplayer-play-icon,.dplayer-pause-icon,.dplayer-mask,.dplayer-icons,.dplayer-controls,.dplayer-controller,.dplayer-loading,.dplayer-button,.dplayer-time,.dplayer-full,.dplayer-full-in-icon,.dplayer-volume,.dplayer-volume-bar,.dplayer-subtitle,.dplayer-logo,.dplayer-controller-mask,.dplayer-controller-button,.dplayer-played,.dplayer-name,.dplayer-live-badge,.dplayer-danmakus,.dplayer-info-panel,.dplayer-tooltip,.dplayer-screenshot-icon,.dplayer-icon-play,.dplayer-icon-pause,.dplayer-icon-volume,.dplayer-icon-fullscreen,.dplayer-icon-fullscreen-exit,.dplayer-icon-subtitle,.dplayer-icon-setting,.dplayer-icon-right,.dplayer-icon-left,.dplayer-control-bar,.dplayer-control-panel,.dplayer-controls-wrap,.dplayer-bottom-bar,.dplayer-top-bar{display:none!important;opacity:0!important;visibility:hidden!important;width:0!important;height:0!important;pointer-events:none!important}

/* 确保视频元素没有其他默认控件 */
video::-webkit-media-controls-volume-slider{display:none!important}
video::-webkit-media-controls-current-time-display{display:none!important}
video::-webkit-media-controls-time-remaining-display{display:none!important}
video::-webkit-media-controls-fullscreen-button{display:none!important}
video::-webkit-media-controls-mute-button{display:none!important}
video::-webkit-media-controls-toggle-closed-captions-button{display:none!important}

/* 隐藏Firefox的原生控件 */
video::-moz-media-controls-volume-slider{display:none!important}
video::-moz-media-controls-mute-button{display:none!important}
video::-moz-media-controls-fullscreen-button{display:none!important}

/* 隐藏IE的原生控件 */
video::-ms-media-controls-volume{display:none!important}
video::-ms-media-controls-mute-button{display:none!important}
video::-ms-media-controls-fullscreen-button{display:none!important}

/* 确保进度条在视频上方 */
.dplayer-progress-wrap{position:absolute!important;bottom:0!important;left:0!important;width:100%!important;height:4px!important;z-index:10!important}
.dplayer-progress{width:100%!important;height:100%!important}
.dplayer-progress-bar{background:rgba(255,255,255,0.3)!important}
.dplayer-progress-loaded{background:rgba(255,255,255,0.5)!important}
.dplayer-progress-played{background:#ff6b6b!important}
.dplayer-progress-handle{background:#fff!important;width:12px!important;height:12px!important;border-radius:50%!important;margin-top:-4px!important}

/* 隐藏任何可能的提示或通知 */
.dplayer-notice,.dplayer-hint,.dplayer-toast{display:none!important;opacity:0!important;visibility:hidden!important;width:0!important;height:0!important;pointer-events:none!important}

/* 频道界面 */
.channel-box{background:#121212;display:flex;flex-direction:column}
.top-bar{height:38px;background:#1c1c1c;display:flex;align-items:center;justify-content:space-between;padding:0 14px;color:#fff}
.app-download{color:#4a90e2;text-decoration:none}
.donate a{color:#ff6b6b;text-decoration:none}
.channel-list{flex:1;overflow-y:auto;padding:6px}
.channel{padding:10px;margin:4px;background:#1a1a1a;color:#ddd;border-radius:6px;position:relative;display:flex;align-items:center;gap:10px;min-height:40px}
.channel.active{background:#4a90e2;color:#fff}
.genre{padding:8px 14px;color:#888;font-size:12px}
.channel-error{color:#ff6b6b;font-size:12px;padding:4px 8px;background:rgba(255,107,107,0.1);border-radius:4px;display:none;white-space:nowrap;flex-shrink:0}
.channel.active .channel-error{background:rgba(255,107,107,0.2);color:#fff}

/* 布局适配 */
@media(min-width:769px){.main{flex-direction:row}.player-box{width:75%;height:100%}.channel-box{width:25%;height:100%}}
@media(max-width:768px){.main{flex-direction:column}.player-box{width:100%;height:46vh}.channel-box{width:100%;height:54vh}}
</style>
</head>

<body>
<div class="main">
  <div class="player-box">
    <div id="dplayer"></div>
  </div>

  <div class="channel-box">
    <div class="top-bar">
      <div>📺 极速直播</div>
      <a href="http://rihou.cc:555/tv/uEcrg3" target="_blank" class="app-download">APP下载</a>
      <div class="donate"><a href="http://cccimg.com/view.php/292d03a93f0210df6ae1168b6219ab95.jpg" target="_blank">打赏支持</a></div>
    </div>
    <div class="channel-list" id="list"></div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded',()=>{
  const dp = new DPlayer({
    container: document.getElementById('dplayer'),
    autoplay: true,
    volume: 0.5,
    preload: 'auto',
    video: { url: '' },

    hls: {
      maxBufferSize: 10*1000*1000,
      maxBufferLength: 5,
      minBufferLength: 1,
      enableWorker: true,
      lowLatencyMode: true,
      fpsDropped: true,
      autoStartLoad: true
    },

    flv: {
      enableWorker: true,
      lazyLoad: false,
      maxBufferLength: 3,
      autoCleanupSourceBuffer: true
    },

    notice: false, mask: false, logo: false
  });

  const list = document.getElementById('list');

  let currentErrorElement = null;

  // 移除全局错误监听器，改为在play函数中临时绑定

  function play(channel, errorElement, url){
    try{
      // 隐藏所有错误提示
      document.querySelectorAll('.channel-error').forEach(el => {
        el.style.display = 'none';
      });
      
      // 设置当前错误提示元素
      currentErrorElement = errorElement;
      
      if(dp.video){dp.pause();}

      let type='normal';
      if(url.includes('.m3u8'))type='hls';
      if(url.includes('.flv'))type='flv';

      if(!/Mobile|Android|iPhone/.test(navigator.userAgent)&&location.protocol==='https:'){
        url='https://api.allorigins.win/raw?url='+encodeURIComponent(url);
      }

      // 重置错误状态
      let isError = false;
      
      // 设置错误监听器
      const errorHandler = () => {
        if (!isError) {
          isError = true;
          if (currentErrorElement) {
            currentErrorElement.style.display = 'block';
          }
        }
      };
      
      // 临时绑定错误事件
      const originalErrorHandler = dp.events['error'];
      dp.on('error', errorHandler);
      
      if (dp.video) {
        const originalVideoErrorHandler = dp.video.onerror;
        dp.video.onerror = errorHandler;
        
        // 保存原始处理器以便恢复
        dp._originalVideoErrorHandler = originalVideoErrorHandler;
      }
      
      // 确保视频元素显示
      if (dp.video) {
        dp.video.style.display = 'block';
        dp.video.style.opacity = '1';
        dp.video.style.visibility = 'visible';
      }
      
      // 确保视频包装器显示
      if (dp.videoWrap) {
        dp.videoWrap.style.display = 'block';
        dp.videoWrap.style.opacity = '1';
        dp.videoWrap.style.visibility = 'visible';
      }
      
      dp.switchVideo({url,type});
      dp.video.volume=0.5;
      dp.play().catch((error) => {
        // 只在网络错误或解码错误时显示提示
        if (error && (error.name === 'NetworkError' || error.message.includes('decode'))) {
          errorHandler();
        }
      });
      
      // 监听视频正常播放
      if (dp.video) {
        dp.video.oncanplay = () => {
          // 视频能正常播放，清除错误状态
          isError = false;
          if (currentErrorElement) {
            currentErrorElement.style.display = 'none';
          }
          
          // 确保视频元素显示
          if (dp.video) {
            dp.video.style.display = 'block';
            dp.video.style.opacity = '1';
            dp.video.style.visibility = 'visible';
          }
        };
        
        // 监听视频加载
        dp.video.onloadeddata = () => {
          // 确保视频元素显示
          if (dp.video) {
            dp.video.style.display = 'block';
            dp.video.style.opacity = '1';
            dp.video.style.visibility = 'visible';
          }
        };
      }
      
    }catch(e){
      // 只有在网络错误时显示提示
      if (e && (e.name === 'NetworkError' || e.message.includes('network'))) {
        errorElement.style.display='block';
      }
    }
  }

  fetch('https://gh-proxy.org/https://github.com/bang359/dsj/blob/main/iphone.txt')
  .then(r=>r.text())
  .then(txt=>{
    txt.split('\n').forEach(line=>{
      if(!line.trim())return;
      if(line.includes(',#genre#')){
        const d=document.createElement('div');d.className='genre';d.textContent=line.split(',')[0];list.appendChild(d);return;
      }
      const arr=line.split(',');
      if(arr.length>=2&&arr[1].startsWith('http')){
        const item=document.createElement('div');item.className='channel';item.textContent=arr[0];
        
        // 创建错误提示元素
        const errorElement=document.createElement('div');
        errorElement.className='channel-error';
        errorElement.textContent='频道已失效，请等待更新';
        
        // 将错误提示作为频道的子元素
        item.appendChild(errorElement);
        
        item.onclick=()=>{
          play(item, errorElement, arr[1]);
          document.querySelectorAll('.channel').forEach(i=>i.classList.remove('active'));
          item.classList.add('active');
        };
        
        list.appendChild(item);
      }
    });

    setTimeout(()=>{
      const first=document.querySelector('.channel');
      if(first)first.click();
    },200);
  });
});
</script>
</body>
</html>
