<script>

    0x04af5,0x04970,0x064b0,0x074a3,0x0ea50,0x06b58,0x055c0,0x0ab60,0x096d5,0x092e0,
    0x0c960,0x0d954,0x0d4a0,0x0da50,0x07552,0x056a0,0x0abb7,0x025d0,0x092d0,0x0cab5,

    0x07954,0x06aa0,0x0ad50,0x05b52,0x04b60,0x0a6e6,0x0a4e0,0x0d260,0x0ea65,0x0d530,
    0x05aa0,0x076a3,0x096d0,0x04bd7,0x04ad0,0x0a4d0,0x1d0b6,0x0d250,0x0d520,0x0dd45,
    0x0b5a0,0x056d0,0x055b2,0x049b0,0x0a577,0x0a4b0,0x0aa50,0x1b255,0x06d20,0x0ada0
  ];
  const Gan = ["甲","乙","丙","丁","戊","己","庚","辛","壬","癸"];
  const Zhi = ["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];
  const Animals = ["鼠","牛","虎","兔","龙","蛇","马","羊","猴","鸡","狗","猪"];
  const solarTerm = ["小寒","大寒","立春","雨水","惊蛰","春分","清明","谷雨","立夏","小满","芒种","夏至","小暑","大暑","立秋","处暑","白露","秋分","寒露","霜降","立冬","小雪","大雪","冬至"];
  const lunarMonthNames = ["正","二","三","四","五","六","七","八","九","十","冬","腊"];
  const lunarDayNames = ["初一","初二","初三","初四","初五","初六","初七","初八","初九","初十","十一","十二","十三","十四","十五","十六","十七","十八","十九","二十","廿一","廿二","廿三","廿四","廿五","廿六","廿七","廿八","廿九","三十"];

  function getLunarDate(date) {
    let year = date.getFullYear(), month = date.getMonth() + 1, day = date.getDate();
    let baseDate = new Date(1900, 0, 31);
    let offset = Math.floor((date - baseDate) / 86400000);
    let i = 0, temp = 0;
    for (i = 1900; i < 2050 && offset > 0; i++) {
      temp = lYearDays(i);
      offset -= temp;
    }
    if (offset < 0) { offset += temp; i--; }
    let lunarYear = i;
    let leap = leapMonth(i);
    let isLeap = false;
    for (i = 1; i < 13 && offset > 0; i++) {
      if (leap > 0 && i == (leap + 1) && isLeap == false) { --i; isLeap = true; temp = leapDays(lunarYear); }
      else { temp = monthDays(lunarYear, i); }
      if (isLeap == true && i == (leap + 1)) isLeap = false;
      offset -= temp;
    }
    if (offset == 0 && leap > 0 && i == leap + 1) {
      if (isLeap) { isLeap = false; }
      else { isLeap = true; --i; }
    }
    if (offset < 0) { offset += temp; --i; }
    let lunarMonth = i;
    let lunarDay = offset + 1;
    return { year: lunarYear, month: lunarMonth, day: lunarDay, isLeap: isLeap };
  }
  function lYearDays(y) { let i, sum = 348; for (i = 0x8000; i > 0x8; i >>= 1) sum += (lunarInfo[y - 1900] & i) ? 1 : 0; return sum + leapDays(y); }
  function leapDays(y) { if (leapMonth(y)) return (lunarInfo[y - 1900] & 0x10000) ? 30 : 29; return 0; }
  function leapMonth(y) { return lunarInfo[y - 1900] & 0xf; }
  function monthDays(y, m) { return (lunarInfo[y - 1900] & (0x10000 >> m)) ? 30 : 29; }
  function toChinaString(lunar) {
    return lunarMonthNames[lunar.month - 1] + "月" + lunarDayNames[lunar.day - 1];
  }

  function showDateInfo() {
    const now = new Date();

    const month = String(now.getMonth() + 1).padStart(2, '0');
    const day = String(now.getDate()).padStart(2, '0');
    document.getElementById('solarDate').textContent = `${year}/${month}/${day}`;
    const lunar = getLunarDate(now);
    document.getElementById('lunarDate').textContent = `农历${toChinaString(lunar)}`;
    const weekDays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
    document.getElementById('weekDay').textContent = weekDays[now.getDay()];
  }
  showDateInfo();

  // 静态翻页时钟
  function initFlipClock() {
    const flipClock = document.getElementById('flipClock');
    flipClock.innerHTML = `
      <div class="flip-card" id="flip-hour">00</div>
      <div class="flip-dividers">
        <span class="flip-divider active"></span>
        <span class="flip-divider active"></span>
      </div>

      <div class="flip-dividers">
        <span class="flip-divider active"></span>
        <span class="flip-divider active"></span>
      </div>
      <div class="flip-card" id="flip-second">00</div>
    `;
    
    updateFlipClock();
  }

  let lastHour = -1;

function playBeep(duration = 300, frequency = 800) {
  try {
    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const oscillator = audioContext.createOscillator();
    const gainNode = audioContext.createGain();
    
    oscillator.connect(gainNode);
    gainNode.connect(audioContext.destination);
    
    oscillator.frequency.value = frequency;
    oscillator.type = 'sine';
    
    gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration / 1000);
    
    oscillator.start(audioContext.currentTime);
    oscillator.stop(audioContext.currentTime + duration / 1000);
  } catch (e) {
    console.log('音频播放不可用');
  }
}

function updateFlipClock() {
    const now = new Date();
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    const seconds = String(now.getSeconds()).padStart(2, '0');
    
    // 整点报时
    if (minutes === '00' && seconds === '00') {
      const currentHour = parseInt(hours);
      if (currentHour !== lastHour) {
        lastHour = currentHour;
        playHourlyChime(currentHour);
      }
    } else if (seconds !== '00') {
      lastHour = -1;
    }
    
    // 更新小时卡片
    const hourCard = document.getElementById('flip-hour');
    if (hourCard) {
      hourCard.textContent = hours;
    }
    
    // 更新分钟卡片
    const minuteCard = document.getElementById('flip-minute');
    if (minuteCard) {
      minuteCard.textContent = minutes;
    }
    
    // 更新秒数卡片
    const secondCard = document.getElementById('flip-second');
    if (secondCard) {
      secondCard.textContent = seconds;
    }
  }

function playHourlyChime(hour) {
  const chimes = hour % 12 || 12;
  let delay = 0;
  
  for (let i = 0; i < chimes; i++) {
    setTimeout(() => {
      playBeep(400, 600 + i * 50);
    }, delay);
    delay += 800;
  }
}

  initFlipClock();

  function getWeather() {
    document.getElementById('weatherCity').textContent = '加载中...';

      'Henan': '河南', 'Hubei': '湖北', 'Hunan': '湖南', 'Sichuan': '四川'

    const translateWeather = (weather) => {
      if (weatherMap[weather]) return weatherMap[weather];
      const lowerWeather = weather.toLowerCase();
      if (lowerWeather.includes('sunny') || lowerWeather.includes('clear')) return '晴';
      if (lowerWeather.includes('cloudy') || lowerWeather.includes('overcast')) return '多云';
      if (lowerWeather.includes('rain') || lowerWeather.includes('drizzle')) {
        if (lowerWeather.includes('heavy')) return '大雨';
        if (lowerWeather.includes('moderate')) return '中雨';
        return '小雨';
      }
      if (lowerWeather.includes('snow')) {
        if (lowerWeather.includes('heavy')) return '大雪';
        if (lowerWeather.includes('moderate')) return '中雪';
        return '小雪';
      }
      if (lowerWeather.includes('thunder')) return '雷阵雨';
      if (lowerWeather.includes('fog') || lowerWeather.includes('mist')) return '雾';
      if (lowerWeather.includes('wind')) return '大风';
      if (lowerWeather.includes('haze') || lowerWeather.includes('dust') || lowerWeather.includes('sand')) return '雾霾';
      return weather;
    };

    const fetchWeather = () => {
      fetch('https://wttr.in/?format=j1')
        .then(res => res.json())
        .then(data => {
          let city = '未知';
          if (data.nearest_area && data.nearest_area[0]) {
            const area = data.nearest_area[0];
            if (area.areaName && area.areaName[0] && area.areaName[0].value) {
              city = area.areaName[0].value;
            } else if (area.region && area.region[0] && area.region[0].value) {
              city = area.region[0].value;
            }
          }
          city = cityMap[city] || city;
          document.getElementById('weatherCity').textContent = city;

          if (data.current_condition && data.current_condition[0]) {
            const temp = data.current_condition[0].temp_C + '°C';
            const weather = data.current_condition[0].weatherDesc[0].value;
            document.getElementById('weatherTemp').textContent = temp;
            document.getElementById('weatherText').textContent = translateWeather(weather);
          }
        })
        .catch(() => {
          document.getElementById('weatherCity').textContent = '获取失败';
          document.getElementById('weatherTemp').textContent = '--';
          document.getElementById('weatherText').textContent = '请检查网络';
        });
    };

    fetchWeather();
    setInterval(fetchWeather, 60000);
  }

  setTimeout(() => {
    getWeather();
  }, 500);

  function updateBufferStatus() {
    try {
      const video = dp.video;
      if (!video || video.readyState < 2) {
        document.getElementById('netSpeed').textContent = '↓缓冲中...';
        return;
      }
      const buffered = video.buffered;
      if (buffered.length > 0) {
        const bufferedEnd = buffered.end(buffered.length - 1);
        const currentTime = video.currentTime;
        const bufferedAhead = bufferedEnd - currentTime;
        if (bufferedAhead > 10) {
          document.getElementById('netSpeed').textContent = '↓缓冲充足';
        } else if (bufferedAhead > 5) {
          document.getElementById('netSpeed').textContent = '↓缓冲正常';
        } else if (bufferedAhead > 2) {
          document.getElementById('netSpeed').textContent = '↓缓冲较少';
        } else {
          document.getElementById('netSpeed').textContent = '↓缓冲中...';
        }
      } else {
        document.getElementById('netSpeed').textContent = '↓加载中...';
      }
    } catch (e) {
      document.getElementById('netSpeed').textContent = '↓--';
    }
  }
  setInterval(updateBufferStatus, 2000);

  // 移除全局错误监听器，改为在play函数中临时绑定

  function play(channel, errorElement, url){
    try{
      // 隐藏所有错误提示
      document.querySelectorAll('.channel-error').forEach(el => {
        el.style.display = 'none';
      });
      
      // 设置当前错误提示元素
      currentErrorElement = errorElement;
      
      if(dp.video){dp.pause();}

      let type='normal';
      if(url.includes('.m3u8'))type='hls';
      if(url.includes('.flv'))type='flv';

      if(!/Mobile|Android|iPhone/.test(navigator.userAgent)&&location.protocol==='https:'){
        url='https://api.allorigins.win/raw?url='+encodeURIComponent(url);
      }

      // 重置错误状态
      let isError = false;
      
      // 设置错误监听器
      const errorHandler = () => {
        if (!isError) {
          isError = true;
          if (currentErrorElement) {
            currentErrorElement.style.display = 'block';
          }
        }
      };
      
      // 临时绑定错误事件
      const originalErrorHandler = dp.events['error'];
      dp.on('error', errorHandler);
      
      if (dp.video) {
        const originalVideoErrorHandler = dp.video.onerror;
        dp.video.onerror = errorHandler;
        
        // 保存原始处理器以便恢复
        dp._originalVideoErrorHandler = originalVideoErrorHandler;
      }
      
      // 确保视频元素显示
      if (dp.video) {
        dp.video.style.display = 'block';
        dp.video.style.opacity = '1';
        dp.video.style.visibility = 'visible';
      }
      
      // 确保视频包装器显示
      if (dp.videoWrap) {
        dp.videoWrap.style.display = 'block';
        dp.videoWrap.style.opacity = '1';
        dp.videoWrap.style.visibility = 'visible';
      }
      
      dp.switchVideo({url,type});
      dp.video.volume=0.5;
      dp.play().catch((error) => {
        // 只在网络错误或解码错误时显示提示
        if (error && (error.name === 'NetworkError' || error.message.includes('decode'))) {
          errorHandler();
        }
      });
      
      // 监听视频正常播放
      if (dp.video) {
        dp.video.oncanplay = () => {
          // 视频能正常播放，清除错误状态
          isError = false;
          if (currentErrorElement) {
            currentErrorElement.style.display = 'none';
          }
          
          // 确保视频元素显示
          if (dp.video) {
            dp.video.style.display = 'block';
            dp.video.style.opacity = '1';
            dp.video.style.visibility = 'visible';
          }
        };
        
        // 监听视频加载
        dp.video.onloadeddata = () => {
          // 确保视频元素显示
          if (dp.video) {
            dp.video.style.display = 'block';
            dp.video.style.opacity = '1';
            dp.video.style.visibility = 'visible';
          }
        };
      }
      
    }catch(e){
      // 只有在网络错误时显示提示
      if (e && (e.name === 'NetworkError' || e.message.includes('network'))) {
        errorElement.style.display='block';
      }
    }
  }

  fetch('https://gh-proxy.org/https://github.com/bang359/dsj/blob/main/iphone.txt')
  .then(r=>r.text())
  .then(txt=>{
    txt.split('\n').forEach(line=>{
      if(!line.trim())return;
      if(line.includes(',#genre#')){
        const d=document.createElement('div');d.className='genre';d.textContent=line.split(',')[0];list.appendChild(d);return;
      }
      const arr=line.split(',');
      if(arr.length>=2&&arr[1].startsWith('http')){
        const item=document.createElement('div');item.className='channel';item.textContent=arr[0];
        
        // 创建错误提示元素
        const errorElement=document.createElement('div');
        errorElement.className='channel-error';
        errorElement.textContent='频道已失效，请等待更新';
        
        // 将错误提示作为频道的子元素
        item.appendChild(errorElement);
        
        item.onclick=()=>{
          play(item, errorElement, arr[1]);
          document.querySelectorAll('.channel').forEach(i=>i.classList.remove('active'));
          item.classList.add('active');
        };
        
        list.appendChild(item);
      }
    });

    setTimeout(()=>{
      const first=document.querySelector('.channel');
      if(first)first.click();
    },200);
  });
});
