<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" "black-translucent">
<title>TS 格式专用电视</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:-apple-system, sans-serif}
.container{padding:12px}
.title{font-size:18px;margin:10px 0 16px}
.player-box{width:100%;height:220px;background:#111;border-radius:14px;overflow:hidden}
video{width:100%;height:100%;object-fit:cover}
.channel-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.channel{padding:12px;background:#1a1a1a;border-radius:10px;text-align:center}
.channel.active{background:#007bff}
</style>
</head>

<body>
<div class="container">
  <div class="title">📺 TS 格式直播</div>
  <div class="player-box">
    <video id="player" playsinline webkit-playsinline controls muted></video>
  </div>

  <div class="channel-grid" id="channels"></div>
</div>

<script>
const player = document.getElementById('player');
const channelsEl = document.getElementById('channels');
let currentBtn = null;

// ========= 你可以在这里放任意 .ts 直播源 =========
const channels = [
  { name: "惊艳", url: "http://15.204.105.50:25461/live/G2s9zK2n9m/xDtwVfWM8T/85.ts" },
  { name: "潘多拉", url: "http://15.204.105.50:25461/live/G2s9zK2n9m/xDtwVfWM8T/86.ts" },
  // 可以继续加：{name:"名称",url:"xxx.ts"},
];

function play(channel, btn) {
  if (currentBtn) currentBtn.classList.remove('active');
  currentBtn = btn;
  btn.classList.add('active');

  // 核心：iPhone 播放 TS 必须这样写
  player.pause();
  player.src = channel.url;
  player.load();
  
  player.play().then(() => {
    player.muted = false;
  }).catch(err => {});
}

// 渲染频道
channels.forEach((ch, i) => {
  const btn = document.createElement('div');
  btn.className = 'channel';
  btn.textContent = ch.name;
  btn.onclick = () => play(ch, btn);
  channelsEl.appendChild(btn);
  if (i === 0) setTimeout(() => btn.click(), 500);
});
</script>
</body>
</html>
