<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全兼容网页电视</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            background: #1a1a1a;
            color: #fff;
            padding: 10px;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            padding: 15px 0;
            border-bottom: 1px solid #333;
            margin-bottom: 15px;
        }
        h1 {
            font-size: 1.8rem;
            color: #4CAF50;
        }
        .subtitle {
            font-size: 0.9rem;
            opacity: 0.7;
            margin-top: 5px;
        }
        
        /* 播放器区域 */
        .player-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }
        #videoPlayer {
            width: 100%;
            height: 0;
            padding-bottom: 56.25%; /* 16:9 比例 */
            background: #000;
            position: relative;
            border-radius: 8px;
            overflow: hidden;
        }
        #videoPlayer video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            outline: none;
        }
        .player-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.05);
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 0.95rem;
        }
        #currentChannel {
            color: #4CAF50;
            font-weight: bold;
        }
        #playStatus {
            opacity: 0.8;
        }
        
        /* 频道列表 */
        .channels-section h2 {
            font-size: 1.3rem;
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 1px solid #333;
        }
        #channelList {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 10px;
            max-height: 400px;
            overflow-y: auto;
            padding: 5px;
        }
        .channel-btn {
            background: rgba(255,255,255,0.08);
            border: none;
            color: #eee;
            padding: 12px 8px;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
            font-size: 0.9rem;
            line-height: 1.4;
            word-break: break-all;
        }
        .channel-btn:hover {
            background: rgba(255,255,255,0.15);
        }
        .channel-btn.active {
            background: #4CAF50;
            color: #fff;
        }
        
        /* 控制栏 */
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        .ctrl-btn {
            background: #333;
            border: none;
            color: white;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .ctrl-btn:hover {
            background: #555;
        }
        #volumeSlider {
            flex: 1;
            max-width: 120px;
        }
        
        /* 响应式 */
        @media (max-width: 768px) {
            #channelList {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }
            h1 {
                font-size: 1.5rem;
            }
        }
        @media (max-width: 480px) {
            #channelList {
                grid-template-columns: 1fr;
            }
            .controls {
                justify-content: center;
            }
        }
        
        /* 加载动画 */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 1.2rem;
        }
        .error {
            color: #ff5252;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>

            <div class="player-info">
                <span>当前播放: <span id="currentChannel">请选择频道</span></span>
                <span id="playStatus">就绪</span>
            </div>
        </div>
        
        <div class="controls">
            <button class="ctrl-btn" onclick="togglePlay()">播放/暂停</button>
            <button class="ctrl-btn" onclick="toggleFullscreen()">全屏</button>
            <label>音量: <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="0.7"></label>
            <button class="ctrl-btn" onclick="switchToAuto()">自动模式</button>

            { name: "山西卫视", url: "https://livehhhttps.sxrtv.com/lsdream/q8RVWgs/1000/i1sh8gV.m3u8" }
            // 注：你源文件中的成人频道已过滤，如需添加请自行按格式补充
        ];

        // ========== 核心逻辑 ==========
        const video = document.getElementById('video');
        const currentChannelEl = document.getElementById('currentChannel');
        const playStatusEl = document.getElementById('playStatus');
        const volumeSlider = document.getElementById('volumeSlider');
        const channelListEl = document.getElementById('channelList');
        const loadingText = document.getElementById('loadingText');

        let currentChannelIndex = -1;

        // 初始化频道列表
        function initChannels() {
            channelListEl.innerHTML = '';
            channels.forEach((channel, index) => {
                const btn = document.createElement('button');
                btn.className = 'channel-btn';
                btn.textContent = channel.name;
                btn.onclick = () => switchChannel(index);
                channelListEl.appendChild(btn);
            });
        }

        // 切换频道
        function switchChannel(index) {
            if (currentChannelIndex === index) return;
            
            // 更新UI状态
            document.querySelectorAll('.channel-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.channel-btn')[index].classList.add('active');
            
            currentChannelIndex = index;
            const channel = channels[index];
            currentChannelEl.textContent = channel.name;
            playStatusEl.textContent = '加载中...';
            loadingText.style.display = 'block';

            // 尝试使用 HLS.js 播放 (兼容 m3u8)
            if (Hls.isSupported() && channel.url.includes('.m3u8')) {
                const hls = new Hls({ enableWorker: false });
                hls.loadSource(channel.url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(e => console.warn("自动播放被阻止，请手动点击播放"));
                    playStatusEl.textContent = '播放中';
                    loadingText.style.display = 'none';
                });
                hls.on(Hls.Events.ERROR, () => {
                    playStatusEl.textContent = '加载失败，尝试直接播放';
                    // 降级方案：直接设置 src
                    video.src = channel.url;
                    video.load();
                });
            } else {
                // 直接播放（支持 mp4 等格式）
                video.src = channel.url;
                video.load();
                video.play().catch(e => console.warn("自动播放被阻止，请手动点击播放"));
                playStatusEl.textContent = '播放中';
                loadingText.style.display = 'none';
            }
        }

        // 工具函数
        function togglePlay() {
            if (video.paused) video.play();
            else video.pause();
        }

        function toggleFullscreen() {
            if (video.requestFullscreen) video.requestFullscreen();
            else if (video.webkitRequestFullscreen) video.webkitRequestFullscreen();
        }

        function switchToAuto() {
            video.controls = true;
            video.autoplay = true;
        }

        // 音量控制
        volumeSlider.addEventListener('input', () => {
            video.volume = volumeSlider.value;
        });

        // 初始化
        initChannels();
        console.log("网页电视初始化完成，共加载 " + channels.length + " 个频道");
