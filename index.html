<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>全能电视直播</title>
    <!-- 播放器核心库 -->
    <link href="https://cdn.jsdelivr.net/npm/video.js@8/dist/video-js.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0a0a;
            color: #fff;
            height: 100vh;
            overflow: hidden;
        }

        /* 主容器：左右分栏 */
        .player-container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* 左侧频道列表 */
        .channel-sidebar {
            width: 240px;
            background: #121212;
            border-right: 1px solid #222;
            overflow-y: auto;
            padding: 10px;
        }

        /* 移动端适配：竖屏上下布局 */
        @media (max-width: 768px) {
            .player-container {
                flex-direction: column;
            }
            .channel-sidebar {
                width: 100%;
                height: 220px;
                border-right: none;
                border-bottom: 1px solid #222;
            }
        }

        .sidebar-title {
            text-align: center;
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            color: #007bff;
            border-bottom: 1px solid #222;
            margin-bottom: 10px;
        }

        .channel-item {
            padding: 12px 15px;
            margin: 6px 0;
            background: #1a1a1a;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
            border: none;
            color: #eee;
            font-size: 14px;
            width: 100%;
        }

        .channel-item:hover {
            background: #252525;
        }

        .channel-item.active {
            background: #007bff;
            color: #fff;
        }

        /* 右侧播放区域 */
        .play-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        .video-box {
            width: 100%;
            max-width: 1200px;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            position: relative;
        }

        .video-js {
            width: 100%;
            height: auto;
            aspect-ratio: 16/9;
        }

        /* 加载动画 */
        .loading {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .loading.show {
            opacity: 1;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top: 3px solid #007bff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<body>
    <div class="player-container">
        <!-- 左侧频道列表 -->
        <div class="channel-sidebar">
            <div class="sidebar-title">📺 频道列表</div>
            <div id="channel-list"></div>
        </div>

        <!-- 右侧播放界面 -->
        <div class="play-area">
            <div class="video-box">
                <video id="live-player" class="video-js vjs-big-play-centered" playsinline webkit-playsinline controls></video>
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/video.js@8/dist/video.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@videojs/http-streaming@3/dist/videojs-http-streaming.min.js"></script>
    <script>
        // 初始化播放器
        const player = videojs('live-player', {
            autoplay: true,
            muted: false, // 默认开启声音
            controls: true,
            fluid: true,
            playsinline: true,
            preload: 'auto',
            html5: {
                hls: { overrideNative: true },
                vhs: { overrideNative: true }
            }
        });

        const loading = document.getElementById('loading');
        const channelList = document.getElementById('channel-list');
        let activeChannel = null;

        // ======================
        // 全格式直播源（支持 m3u8 / ts / mp4）
        // 包含你提供的 TS 专属频道 + 通用频道
        // ======================
        const channels = [
            // 你的 TS 专属频道
            {name:"NTD",url:"https://ntd02.akamaized.net/HD-NY/tracks-v3a1/mono.m3u8"},
            {name:"CCTV1咪咕",url:"http://39.81.41.1:1234/608807420"},
            {name:"频道测试",url:"http://rihou.cc:555/tv/频道测试"},
            { name: "📺 松2", url: "http://15.204.105.50:25461/live/G2s9zK2n9m/xDtwVfWM8T/89.ts", type: "ts" },
            { name: "📺 松3", url: "http://15.204.105.50:25461/live/G2s9zK2n9m/xDtwVfWM8T/90.ts", type: "ts" },
            
            // 通用 m3u8 正规频道
            { name: "CCTV1", url: "https://d1i3ktb7vhtrki.cloudfront.net/TV_001/index.m3u8", type: "m3u8" },
            { name: "湖南卫视", url: "https://d1i3ktb7vhtrki.cloudfront.net/TV_HunanWS/index.m3u8", type: "m3u8" },
            { name: "测试视频", url: "https://www.w3school.com.cn/i/movie.mp4", type: "mp4" },
        ];

        // 自动识别视频格式
        function getVideoType(url) {
            if (url.includes('.m3u8')) return 'application/x-mpegURL';
            if (url.includes('.ts')) return 'video/MP2T';
            if (url.includes('.mp4')) return 'video/mp4';
            return 'application/x-mpegURL';
        }

        // 播放频道
        function playChannel(channel, dom) {
            // 切换高亮
            if (activeChannel) activeChannel.classList.remove('active');
            activeChannel = dom;
            dom.classList.add('active');

            // 显示加载
            loading.classList.add('show');

            // 重置并播放
            player.reset();
            player.src({
                src: channel.url,
                type: getVideoType(channel.url)
            });

            player.load();
            player.play().then(() => {
                player.muted(false); // 强制开启声音
                loading.classList.remove('show');
            }).catch(() => {
                loading.classList.remove('show');
            });
        }

        // 渲染频道列表
        channels.forEach((channel, index) => {
            const item = document.createElement('button');
            item.className = 'channel-item';
            item.textContent = channel.name;
            item.onclick = () => playChannel(channel, item);
            channelList.appendChild(item);

            // 默认自动播放第一个频道
            if (index === 0) {
                setTimeout(() => item.click(), 500);
            }
        });
    </script>
</body>
</html>
