<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📺 通用电视直播</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111;color:#fff;font-family:Arial;padding:15px}
.container{max-width:1100px;margin:0 auto}
.title{text-align:center;margin:10px 0 20px;color:#00d9ff}
.player{background:#000;border-radius:12px;overflow:hidden;margin-bottom:20px}
video{width:100%;display:block}
.channel-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.channel{padding:10px;background:#222;color:#fff;border:none;border-radius:8px;cursor:pointer}
.channel.active{background:#007bff}
</style>
</head>
<body>

<div class="container">
  <h2 class="title">📺 通用电视直播</h2>
  <div class="player">
    <video id="tv" controls></video>
  </div>
  <div class="channel-list" id="channelList"></div>
</div>

<script>
// 本地写死直播源，不联网拉取，电脑必能打开
const channels = [
{name:"频道测试",url:"http://rihou.cc:555/tv/频道测试"},
{name:"凤凰卫视",url:"http://rihou.cc:555/tv/凤凰卫视"},
{name:"镜新闻",url:"http://rihou.cc:555/tv/镜新闻"},
{name:"japan",url:"http://a0bn5xro.rostelekom.xyz/iptv/AHMQNVLWUTM5PW/6225/index.m3u8"},
{name:"CCTV1 高清",url:"http://120.211.62.180:8000/hls/1/index.m3u8"},
{name:"CCTV2 财经",url:"https://ivi.bupt.edu.cn/hls/cctv2hd.m3u8"},
{name:"CCTV3 综艺",url:"https://ivi.bupt.edu.cn/hls/cctv3hd.m3u8"},
{name:"CCTV4 中文国际",url:"https://ivi.bupt.edu.cn/hls/cctv4hd.m3u8"},
{name:"CCTV5 体育",url:"https://ivi.bupt.edu.cn/hls/cctv5hd.m3u8"},
{name:"CCTV5+ 体育",url:"https://ivi.bupt.edu.cn/hls/cctv5phd.m3u8"},
{name:"CCTV6 电影",url:"https://ivi.bupt.edu.cn/hls/cctv6hd.m3u8"},
{name:"CCTV7 国防军事",url:"https://ivi.bupt.edu.cn/hls/cctv7hd.m3u8"},
{name:"CCTV8 电视剧",url:"https://ivi.bupt.edu.cn/hls/cctv8hd.m3u8"},
{name:"CCTV9 纪录",url:"https://ivi.bupt.edu.cn/hls/cctv9hd.m3u8"},
{name:"CCTV10 科教",url:"https://ivi.bupt.edu.cn/hls/cctv10hd.m3u8"},
{name:"CCTV13 新闻",url:"https://ivi.bupt.edu.cn/hls/cctv13hd.m3u8"},
{name:"CCTV14 少儿",url:"https://ivi.bupt.edu.cn/hls/cctv14hd.m3u8"},
{name:"湖南卫视",url:"https://ivi.bupt.edu.cn/hls/hnws.m3u8"},
{name:"浙江卫视",url:"https://ivi.bupt.edu.cn/hls/zjws.m3u8"},
{name:"江苏卫视",url:"https://ivi.bupt.edu.cn/hls/jsws.m3u8"},
{name:"北京卫视",url:"https://ivi.bupt.edu.cn/hls/bjws.m3u8"},
{name:"东方卫视",url:"https://ivi.bupt.edu.cn/hls/dongfangws.m3u8"},
{name:"广东卫视",url:"https://ivi.bupt.edu.cn/hls/gdws.m3u8"},
{name:"深圳卫视",url:"https://ivi.bupt.edu.cn/hls/szws.m3u8"},
{name:"重庆卫视",url:"https://ivi.bupt.edu.cn/hls/cqws.m3u8"},
{name:"安徽卫视",url:"https://ivi.bupt.edu.cn/hls/ahws.m3u8"},
{name:"四川卫视",url:"https://ivi.bupt.edu.cn/hls/scws.m3u8"},
{name:"河南卫视",url:"https://ivi.bupt.edu.cn/hls/hnws.m3u8"},
{name:"湖北卫视",url:"https://ivi.bupt.edu.cn/hls/hbws.m3u8"},
{name:"山东卫视",url:"https://ivi.bupt.edu.cn/hls/sdws.m3u8"}
];

const tv = document.getElementById('tv');
const list = document.getElementById('channelList');
let activeBtn = null;

// 渲染频道
channels.forEach((item, i) => {
  const btn = document.createElement('button');
  btn.className = 'channel';
  btn.textContent = item.name;
  btn.onclick = () => play(item.url, btn);
  list.appendChild(btn);
  if(i === 0) play(item.url, btn);
});

// 播放
function play(url, btn) {
  if(activeBtn) activeBtn.classList.remove('active');
  activeBtn = btn;
  btn.classList.add('active');
  
  tv.src = url;
  tv.load();
  tv.play().catch(err => {});
}
</script>
</body>
</html>
