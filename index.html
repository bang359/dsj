<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多格式网页电视播放器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            color: #ffffff;
            min-height: 100vh;
            padding: 15px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        /* 头部区域 */
        .header {
            text-align: center;
            padding: 20px 0;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .header h1 {
            font-size: 2.2rem;
            background: linear-gradient(90deg, #00dbde, #fc00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #aaa;
            font-size: 0.95rem;
        }
        
        /* 主内容区 */
        .main-content {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        /* 播放器区域 */
        .player-container {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        .player-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 比例 */
        }
        
        #videoElement {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
        }
        
        .player-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            padding: 20px 15px 10px;
            display: flex;
            align-items: center;
            gap: 15px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .player-container:hover .player-controls {
            opacity: 1;
        }
        
        .control-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        
        .control-btn:hover {
            background: rgba(255,255,255,0.3);
        }
        
        .volume-container {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }
        
        .time-display {
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            color: #ccc;
        }
        
        /* 频道区域 */
        .channels-section {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }
        
        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .section-title h2 {
            font-size: 1.4rem;
            color: #00dbde;
        }
        
        .channels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
            max-height: 300px;
            overflow-y: auto;
            padding-right: 5px;
        }
        
        .channel-card {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }
        
        .channel-card:hover {
            background: rgba(255,255,255,0.15);
            transform: translateY(-2px);
            border-color: #00dbde;
        }
        
        .channel-card.active {
            background: linear-gradient(135deg, rgba(0,219,222,0.2), rgba(252,0,255,0.2));
            border-color: #00dbde;
        }
        
        .channel-number {
            font-size: 0.8rem;
            color: #00dbde;
            margin-bottom: 5px;
        }
        
        .channel-name {
            font-weight: 500;
            font-size: 0.95rem;
        }
        
        /* 状态栏 */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.05);
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 0.9rem;
        }
        
        .quality-selector select {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            outline: none;
        }
        
        /* 加载状态 */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: #00dbde;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* 错误提示 */
        .error-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid rgba(255, 0, 0, 0.3);
            color: #ff6b6b;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            max-width: 300px;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .channels-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }
            
            .header h1 {
                font-size: 1.8rem;
            }
            
            .player-controls {
                opacity: 1; /* 移动端始终显示控制栏 */
                padding: 10px 10px 5px;
            }
            
            .control-btn {
                width: 35px;
                height: 35px;
                font-size: 1rem;
            }
        }
        
        @media (max-width: 480px) {
            .channels-grid {
                grid-template-columns: 1fr 1fr;
            }
            
            .channel-card {
                padding: 12px 8px;
            }
            
            .section-title {
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1>📺 多格式网页电视播放器</h1>
            <p>支持 m3u8 / flv / mp4 等多种格式 | 手机电脑全兼容</p>
        </div>
        
        <!-- 主内容区 -->
        <div class="main-content">
            <!-- 播放器区域 -->
            <div class="player-container">
                <div class="player-wrapper">
                    <video id="videoElement" controls playsinline webkit-playsinline>
                        <!-- 视频源将由JS动态设置 -->
                    </video>
                    
                    <!-- 加载状态 -->
                    <div class="loading" id="loading" style="display: none;">
                        <div class="spinner"></div>
                        <p>正在加载频道...</p>
                    </div>
                    
                    <!-- 错误提示 -->
                    <div class="error-message" id="error" style="display: none;">
                        <p>播放失败，请尝试其他频道</p>
                    </div>
                </div>
                
                <!-- 自定义控制栏 -->
                <div class="player-controls">
                    <button class="control-btn" onclick="togglePlay()">⏯️</button>
                    <div class="volume-container">
                        <button class="control-btn" onclick="toggleMute()">🔊</button>
                        <input type="range" id="volume" min="0" max="1" step="0.1" value="0.7" style="flex: 1;">
                    </div>
                    <div class="time-display">
                        <span id="currentTime">00:00</span> / <span id="duration">00:00</span>
                    </div>
                    <button class="control-btn" onclick="toggleFullscreen()">⛶</button>
                </div>
            </div>
            
            <!-- 频道列表 -->
            <div class="channels-section">
                <div class="section-title">
                    <h2>电视频道</h2>
                    <div class="quality-selector">
                        <select id="qualitySelect" onchange="changeQuality()">
                            <option value="auto">自动选择</option>
                            <option value="720p">720p</option>
                            <option value="480p">480p</option>
                            <option value="360p">360p</option>
                        </select>
                    </div>
                </div>
                
                <div class="channels-grid" id="channelsGrid">
                    <!-- 频道将由JS动态生成 -->
                </div>
            </div>
            
            <!-- 状态栏 -->
            <div class="status-bar">
                <div id="status">就绪 - 点击频道开始播放</div>
                <div id="playerInfo">播放器: HTML5 Video</div>
            </div>
        </div>
    </div>

    <!-- 核心脚本 -->
    <script>
        // ========== 配置 ==========
        // 由于链接无法访问，使用示例频道数据
        const CHANNELS = [
            { id: 1, name: "CCTV-1 综合", url: "http://1.24.39.180:9003/hls/1/index.m3u8", type: "hls" },
            { id: 2, name: "CCTV-5 体育", url: "http://1.24.39.180:9003/hls/5/index.m3u8", type: "hls" },
            { id: 3, name: "湖南卫视", url: "http://1.24.39.180:9003/hls/28/index.m3u8", type: "hls" },
            { id: 4, name: "凤凰卫视", url: "http://rihou.cc:555/tv/凤凰卫视", type: "unknown" },
            { id: 5, name: "NTD", url: "https://ntd02.akamaized.net/HD-NY/tracks-v3a1/mono.m3u8", type: "hls" },
            { id: 6, name: "测试 MP4", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4", type: "mp4" }
        ];
        
        // 添加更多格式的示例
        const FORMAT_EXAMPLES = {
            hls: [
                "http://example.com/live/channel.m3u8",
                "https://example.com/stream/playlist.m3u8"
            ],
            flv: [
                "rtmp://example.com/live/stream",
                "http://example.com/live/stream.flv"
            ],
            mp4: [
                "http://example.com/video.mp4",
                "https://example.com/live/stream.mp4"
            ],
            mpegdash: [
                "https://example.com/manifest.mpd"
            ]
        };
        
        // ========== 状态变量 ==========
        let currentChannel = null;
        let player = null;
        let hlsInstance = null;
        let isPlaying = false;
        
        // ========== DOM元素 ==========
        const videoElement = document.getElementById('videoElement');
        const channelsGrid = document.getElementById('channelsGrid');
        const statusElement = document.getElementById('status');
        const loadingElement = document.getElementById('loading');
        const errorElement = document.getElementById('error');
        const currentTimeElement = document.getElementById('currentTime');
        const durationElement = document.getElementById('duration');
        const volumeSlider = document.getElementById('volume');
        const playerInfoElement = document.getElementById('playerInfo');
        const qualitySelect = document.getElementById('qualitySelect');
        
        // ========== 初始化 ==========
        function init() {
            // 加载播放器库
            loadPlayerLibraries();
            
            // 初始化频道列表
            renderChannels();
            
            // 设置音量
            updateVolume();
            
            // 绑定事件
            bindEvents();
            
            // 设置状态
            updateStatus("就绪 - 点击任意频道开始播放");
        }
        
        // 动态加载播放器库
        function loadPlayerLibraries() {
            // 加载 HLS.js
            if (!window.Hls) {
                const hlsScript = document.createElement('script');
                hlsScript.src = 'https://cdn.jsdelivr.net/npm/hls.js@latest';
                hlsScript.onload = () => console.log("HLS.js 加载完成");
                document.head.appendChild(hlsScript);
            }
            
            // 加载 FLV.js
            if (!window.flvjs) {
                const flvScript = document.createElement('script');
                flvScript.src = 'https://cdn.jsdelivr.net/npm/flv.js@latest';
                flvScript.onload = () => console.log("FLV.js 加载完成");
                document.head.appendChild(flvScript);
            }
            
            // 加载 DASH.js
            if (!window.dashjs) {
                const dashScript = document.createElement('script');
                dashScript.src = 'https://cdn.dashjs.org/latest/dash.all.min.js';
                dashScript.onload = () => console.log("DASH.js 加载完成");
                document.head.appendChild(dashScript);
            }
        }
        
        // 渲染频道列表
        function renderChannels() {
            channelsGrid.innerHTML = '';
            
            CHANNELS.forEach(channel => {
                const channelCard = document.createElement('div');
                channelCard.className = 'channel-card';
                channelCard.innerHTML = `
                    <div class="channel-number">${String(channel.id).padStart(2, '0')}</div>
                    <div class="channel-name">${channel.name}</div>
                `;
                channelCard.addEventListener('click', () => playChannel(channel));
                channelsGrid.appendChild(channelCard);
            });
            
            // 添加自定义源选项
            const customCard = document.createElement('div');
            customCard.className = 'channel-card';
            customCard.innerHTML = `
                <div class="channel-number">+</div>
                <div class="channel-name">自定义源</div>
            `;
            customCard.addEventListener('click', () => addCustomSource());
            channelsGrid.appendChild(customCard);
        }
        
        // 播放频道
        async function playChannel(channel) {
            try {
                // 更新UI
                updateActiveChannel(channel.id);
                showLoading(true);
                hideError();
                updateStatus(`正在加载: ${channel.name}`);
                
                // 停止当前播放
                stopCurrentPlayback();
                
                // 检测格式并选择播放器
                const format = detectVideoFormat(channel.url);
                playerInfoElement.textContent = `格式: ${format.toUpperCase()}`;
                
                // 根据格式选择播放器
                switch(format) {
                    case 'hls':
                        await playHLS(channel.url);
                        break;
                    case 'flv':
                        await playFLV(channel.url);
                        break;
                    case 'mp4':
                    case 'webm':
                        await playNative(channel.url);
                        break;
                    case 'mpegdash':
                        await playDash(channel.url);
                        break;
                    default:
                        // 尝试通用方法
                        await playNative(channel.url);
                }
                
                currentChannel = channel;
                updateStatus(`正在播放: ${channel.name}`);
                showLoading(false);
                
            } catch (error) {
                console.error('播放失败:', error);
                showError(`播放失败: ${error.message}`);
                updateStatus('播放失败');
                showLoading(false);
            }
        }
        
        // 检测视频格式
        function detectVideoFormat(url) {
            const urlLower = url.toLowerCase();
            
            if (urlLower.includes('.m3u8')) return 'hls';
            if (urlLower.includes('.flv') || urlLower.includes('rtmp://')) return 'flv';
            if (urlLower.includes('.mpd')) return 'mpegdash';
            if (urlLower.includes('.mp4')) return 'mp4';
            if (urlLower.includes('.webm')) return 'webm';
            
            // 默认尝试HLS
            return 'hls';
        }
        
        // 播放HLS流
        function playHLS(url) {
            return new Promise((resolve, reject) => {
                if (window.Hls && Hls.isSupported()) {
                    if (hlsInstance) {
                        hlsInstance.destroy();
                    }
                    
                    hlsInstance = new Hls({
                        enableWorker: false, // 移动端兼容
                        autoStartLoad: true,
                        startLevel: -1, // 自动选择质量
                    });
                    
                    hlsInstance.loadSource(url);
                    hlsInstance.attachMedia(videoElement);
                    
                    hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                        videoElement.play();
                        resolve();
                    });
                    
                    hlsInstance.on(Hls.Events.ERROR, (event, data) => {
                        if (data.fatal) {
                            switch(data.type) {
                                case Hls.ErrorTypes.NETWORK_ERROR:
                                    reject(new Error('网络错误，请检查链接'));
                                    break;
                                case Hls.ErrorTypes.MEDIA_ERROR:
                                    reject(new Error('媒体错误，格式可能不支持'));
                                    break;
                                default:
                                    reject(new Error('HLS播放失败'));
                            }
                        }
                    });
                } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
                    // Safari原生支持HLS
                    videoElement.src = url;
                    videoElement.addEventListener('loadedmetadata', () => resolve());
                    videoElement.load();
                } else {
                    reject(new Error('当前浏览器不支持HLS播放'));
                }
            });
        }
        
        // 播放FLV流
        function playFLV(url) {
            return new Promise((resolve, reject) => {
                if (window.flvjs && flvjs.isSupported()) {
                    if (player) {
                        player.unload();
                        player.detachMediaElement();
                        player.destroy();
                        player = null;
                    }
                    
                    player = flvjs.createPlayer({
                        type: 'flv',
                        url: url
                    }, {
                        enableWorker: false,
                        stashInitialSize: 128,
                    });
                    
                    player.attachMediaElement(videoElement);
                    player.load();
                    player.play();
                    
                    player.on(flvjs.Events.ERROR, (error) => {
                        reject(new Error('FLV播放失败: ' + error));
                    });
                    
                    resolve();
                } else {
                    reject(new Error('当前浏览器不支持FLV播放'));
                }
            });
        }
        
        // 播放MP4/WebM
        function playNative(url) {
            return new Promise((resolve) => {
                videoElement.src = url;
                videoElement.load();
                videoElement.play();
                resolve();
            });
        }
        
        // 播放MPEG-DASH
        function playDash(url) {
            return new Promise((resolve, reject) => {
                if (window.dashjs) {
                    if (player) {
                        player.reset();
                    }
                    
                    player = dashjs.MediaPlayer().create();
                    player.initialize(videoElement, url, true);
                    
                    player.on(dashjs.MediaPlayer.events.ERROR, (e) => {
                        reject(new Error('DASH播放失败'));
                    });
                    
                    resolve();
                } else {
                    reject(new Error('DASH.js未加载'));
                }
            });
        }
        
        // 停止当前播放
        function stopCurrentPlayback() {
            videoElement.pause();
            videoElement.src = '';
            videoElement.load();
            
            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }
            
            if (player) {
                if (player.unload) player.unload();
                if (player.detachMediaElement) player.detachMediaElement();
                if (player.destroy) player.destroy();
                player = null;
            }
        }
        
        // 更新激活的频道
        function updateActiveChannel(channelId) {
            document.querySelectorAll('.channel-card').forEach(card => {
                card.classList.remove('active');
            });
            
            const cards = document.querySelectorAll('.channel-card');
            if (channelId && cards[channelId - 1]) {
                cards[channelId - 1].classList.add('active');
            }
        }
        
        // 添加自定义源
        function addCustomSource() {
            const url = prompt('请输入直播源地址:');
            if (url) {
                const name = prompt('请输入频道名称:', '自定义频道');
                const channel = {
                    id: CHANNELS.length + 1,
                    name: name || '自定义频道',
                    url: url,
                    type: 'custom'
                };
                
                CHANNELS.push(channel);
                renderChannels();
                playChannel(channel);
            }
        }
        
        // 控制函数
        function togglePlay() {
            if (videoElement.paused) {
                videoElement.play();
            } else {
                videoElement.pause();
            }
        }
        
        function toggleMute() {
            videoElement.muted = !videoElement.muted;
        }
        
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                if (videoElement.requestFullscreen) {
                    videoElement.requestFullscreen();
                } else if (videoElement.webkitRequestFullscreen) {
                    videoElement.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        }
        
        function updateVolume() {
            videoElement.volume = volumeSlider.value;
        }
        
        function changeQuality() {
            const quality = qualitySelect.value;
            updateStatus(`已切换至 ${quality} 画质`);
        }
        
        // 工具函数
        function updateStatus(message) {
            statusElement.textContent = message;
        }
        
        function showLoading(show) {
            loadingElement.style.display = show ? 'block' : 'none';
        }
        
        function showError(message) {
            errorElement.innerHTML = `<p>${message}</p>`;
            errorElement.style.display = 'block';
        }
        
        function hideError() {
            errorElement.style.display = 'none';
        }
        
        // 绑定事件
        function bindEvents() {
            // 音量控制
            volumeSlider.addEventListener('input', updateVolume);
            
            // 时间更新
            videoElement.addEventListener('timeupdate', () => {
                const current = formatTime(videoElement.currentTime);
                const duration = formatTime(videoElement.duration);
                currentTimeElement.textContent = current;
                durationElement.textContent = isNaN(duration) ? '00:00' : duration;
            });
            
            // 视频事件
            videoElement.addEventListener('play', () => {
                isPlaying = true;
            });
            
            videoElement.addEventListener('pause', () => {
                isPlaying = false;
            });
            
            videoElement.addEventListener('error', (e) => {
                showError('播放错误: ' + videoElement.error?.message || '未知错误');
                updateStatus('播放错误');
            });
            
            // 键盘快捷键
            document.addEventListener('keydown', (e) => {
                switch(e.key) {
                    case ' ':
                        togglePlay();
                        e.preventDefault();
                        break;
                    case 'f':
                        toggleFullscreen();
                        break;
                    case 'm':
                        toggleMute();
                        break;
                    case 'ArrowUp':
                        videoElement.volume = Math.min(videoElement.volume + 0.1, 1);
                        volumeSlider.value = videoElement.volume;
                        break;
                    case 'ArrowDown':
                        videoElement.volume = Math.max(videoElement.volume - 0.1, 0);
                        volumeSlider.value = videoElement.volume;
                        break;
                }
            });
        }
        
        // 格式化时间
        function formatTime(seconds) {
            if (isNaN(seconds)) return '00:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }
        
        // 页面加载完成后初始化
        window.addEventListener('DOMContentLoaded', init);
        
        // 自动播放处理
        document.addEventListener('click', () => {
            if (videoElement.paused && currentChannel) {
                videoElement.play().catch(e => {
                    console.log('需要用户交互才能播放');
                });
            }
        });
    </script>
