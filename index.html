<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="网络电视">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>网络电视</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:-apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
        -webkit-tap-highlight-color: transparent;
    }
    html,body{
        height:100%;
        background:#000;
        color:#fff;
        overflow:hidden;
    }
    .container{
        display:flex;
        flex-direction:column;
        height:100vh;
    }
    /* 视频播放区域 */
    .video-box{
        width:100%;
        height:42vh;
        background:#000;
        position:relative;
    }
    video{
        width:100%;
        height:100%;
        object-fit:contain;
        background:#000;
    }
    .loading{
        position:absolute;
        top:50%;
        left:50%;
        transform:translate(-50%,-50%);
        color:#007aff;
        font-size:18px;
    }
    /* 频道列表区域 */
    .channel-box{
        flex:1;
        background:#121212;
        padding:10px;
        overflow-y:auto;
    }
    .channel-item{
        width:100%;
        padding:18px 16px;
        background:#1e1e1e;
        border:none;
        border-radius:14px;
        color:#fff;
        font-size:16px;
        text-align:left;
        margin-bottom:10px;
        cursor:pointer;
        transition:0.2s;
    }
    .channel-item:active{
        background:#0066cc;
        transform:scale(0.98);
    }
    .channel-item.active{
        background:#007aff;
        font-weight:500;
    }
    /* 滚动条隐藏 */
    ::-webkit-scrollbar{
        width:0;
    }
</style>
</head>
<body>

<div class="container">
    <div class="video-box">
        <video id="video" playsinline webkit-playsinline></video>
        <div class="loading" id="loading">加载中...</div>
    </div>
    <div class="channel-box" id="channelList"></div>
</div>
<div class="right-sidebar">
      <div class="bottom-donate">
        <a href="https://gh-proxy.org/https://raw.githubusercontent.com/bang359/dsj/main/wx.png" target="_blank">
          <img src="https://gh-proxy.org/https://raw.githubusercontent.com/bang359/dsj/main/wx.png" alt="赞赏">
          支持我们 · 感谢您的鼓励
        </a>
      </div>
      <div class="channel-list" id="channelList"></div>
    </div>
  </div>
</div>


<script>
const video = document.getElementById('video');
const loading = document.getElementById('loading');
const channelList = document.getElementById('channelList');
let hls = null;
let currentActive = null;

// 你指定的官方源，不做任何修改
const sourceURL = "https://gh-proxy.org/https://github.com/bang359/dsj/raw/main/iphone.txt";

// 加载状态
function showLoading(){ loading.style.display = 'block'; }
function hideLoading(){ loading.style.display = 'none'; }

// 播放函数（自动播放）
function playVideo(url, btn) {
    showLoading();
    
    // 销毁之前的播放
    if(hls) hls.destroy();
    
    // 高亮当前频道
    if(currentActive) currentActive.classList.remove('active');
    btn.classList.add('active');
    currentActive = btn;

    // 播放逻辑
    if(Hls.isSupported() && url.includes('.m3u8')){
        hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
            video.play().catch(() => {}).finally(hideLoading);
        });
        hls.on(Hls.Events.ERROR, () => hideLoading());
    }else{
        video.src = url;
        video.play().catch(() => {}).finally(hideLoading);
    }
}

// 加载频道列表
fetch(sourceURL)
.then(res => res.text())
.then(text => {
    let firstUrl = '';
    let firstBtn = null;

    text.split('\n').forEach(line => {
        if(line.includes(',')){
            const [name, url] = line.split(',', 2);
            if(name && url && url.startsWith('http')){
                const btn = document.createElement('button');
                btn.className = 'channel-item';
                btn.innerText = name.trim();
                btn.onclick = () => playVideo(url.trim(), btn);
                channelList.appendChild(btn);

                if(!firstUrl){
                    firstUrl = url.trim();
                    firstBtn = btn;
                }
            }
        }
    });

    // 自动播放第一个频道
    if(firstUrl) playVideo(firstUrl, firstBtn);
})
.catch(err => {
    channelList.innerHTML = '<div class="channel-item">直播源加载失败，请刷新重试</div>';
    hideLoading();
});
</script>
</body>
</html>
