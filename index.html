<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="网络电视">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>网络电视</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:-apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
        -webkit-tap-highlight-color: transparent;
    }
    html,body{
        height:100%;
        background:#000;
        color:#fff;
        overflow:hidden;
    }
    .container{
        display:flex;
        flex-direction:column;
        height:100vh;
    }
    /* 视频播放区域 */
    .video-box{
        width:100%;
        height:42vh;
        background:#000;
        position:relative;
    }
    video{
        width:100%;
        height:100%;
        object-fit:contain;
        background:#000;
    }
    .loading{
        position:absolute;
        top:50%;
        left:50%;
        transform:translate(-50%,-50%);
        color:#007aff;
        font-size:18px;
    }
    /* 频道列表区域 */
    .channel-box{
        flex:1;
        background:#121212;
        padding:10px;
        overflow-y:auto;
    }
    .channel-item{
        width:100%;
        padding:18px 16px;
        background:#1e1e1e;
        border:none;
        border-radius:14px;
        color:#fff;
        font-size:16px;
        text-align:left;
        margin-bottom:10px;
        cursor:pointer;
        transition:0.2s;
    }
    .channel-item:active{
        background:#0066cc;
        transform:scale(0.98);
    }
    .channel-item.active{
        background:#007aff;
        font-weight:500;
    }
    /* 滚动条隐藏 */
    ::-webkit-scrollbar{
        width:0;
    }
</style>
</head>
<body>

<div class="container">
    <div class="video-box">
        <video id="video" playsinline webkit-playsinline></video>
        <div class="loading" id="loading">加载中...</div>
    </div>
    <div class="channel-box" id="channelList"></div>
</div>

<script>
const video = document.getElementById('video');
const loading = document.getElementById('loading');
const channelList = document.getElementById('channelList');
let hls = null;
let currentActive = null;

// 你指定的官方源，不做任何修改
const sourceURL = "https://gh-proxy.org/https://github.com/bang359/dsj/raw/main/iphone.txt";

// 加载状态
function showLoading(){ loading.style.display = 'block'; }
function hideLoading(){ loading.style.display = 'none'; }

// 播放函数（自动播放）
function playVideo(url, btn) {
    showLoading();
    
    // 销毁之前的播放
    if(hls) hls.destroy();
    
    // 高亮当前频道
    if(currentActive) currentActive.classList.remove('active');
    btn.classList.add('active');
    currentActive = btn;

    // 播放逻辑
    if(Hls.isSupported() && url.includes('.m3u8')){
        hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
            video.play().catch(() => {}).finally(hideLoading);
        });
        hls.on(Hls.Events.ERROR, () => hideLoading());
    }else{
        video.src = url;
        video.play().catch(() => {}).finally(hideLoading);
    }
}

// 加载频道列表
fetch(sourceURL)
.then(res => res.text())
.then(text => {
    let firstUrl = '';
    let firstBtn = null;

    text.split('\n').forEach(line => {
        if(line.includes(',')){
            const [name, url] = line.split(',', 2);
            if(name && url && url.startsWith('http')){
                const btn = document.createElement('button');
                btn.className = 'channel-item';
                btn.innerText = name.trim();
                btn.onclick = () => playVideo(url.trim(), btn);
                channelList.appendChild(btn);

                if(!firstUrl){
                    firstUrl = url.trim();
                    firstBtn = btn;
                }
            }
        }
    });

    // 自动播放第一个频道
    if(firstUrl) playVideo(firstUrl, firstBtn);
})
.catch(err => {
    channelList.innerHTML = '<div class="channel-item">直播源加载失败，请刷新重试</div>';
    hideLoading();
});
</script>
</body>
</html>
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赞赏码留言板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(45deg, #ff6b6b, #feca57);
            color: white;
            text-align: center;
            padding: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
            padding: 30px;
        }

        .qr-section {
            text-align: center;
        }

        .qr-code {
            width: 100%;
            max-width: 300px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }

        .qr-code:hover {
            transform: scale(1.05);
        }

        .qr-info {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .messages-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.8em;
        }

        .message-form {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .submit-btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
        }

        .messages-list {
            max-height: 500px;
            overflow-y: auto;
        }

        .message-item {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            border-left: 4px solid #667eea;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .message-header {
            display: flex;
            justify-content: between;
            align-items: center;
            margin-bottom: 10px;
        }

        .message-name {
            font-weight: bold;
            color: #667eea;
            font-size: 1.1em;
        }

        .message-time {
            color: #888;
            font-size: 0.9em;
        }

        .message-content {
            color: #333;
            line-height: 1.6;
            font-size: 1.05em;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            background: #667eea;
            color: white;
            padding: 20px;
            margin-top: 20px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💝 赞赏码留言板</h1>
            <p>扫码赞赏，留下您的美好祝愿</p>
        </div>

        <div class="content">
            <div class="qr-section">
                <img src="https://github.com/bang359/dsj/raw/main/wx.png" alt="赞赏码" class="qr-code" id="qrCode">
                <div class="qr-info">
                    <h3>🎯 如何赞赏</h3>
                    <p>1. 使用微信扫描二维码</p>
                    <p>2. 输入赞赏金额</p>
                    <p>3. 在下方留言板留言</p>
                </div>
                
                <div class="stats">
                    <div class="stat-item">
                        <div class="stat-number" id="messageCount">0</div>
                        <div class="stat-label">留言数</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number" id="todayCount">0</div>
                        <div class="stat-label">今日留言</div>
                    </div>
                </div>
            </div>

            <div class="messages-section">
                <h2>💬 留言板</h2>
                
                <div class="message-form">
                    <div class="form-group">
                        <label for="userName">昵称：</label>
                        <input type="text" id="userName" placeholder="请输入您的昵称" maxlength="20">
                    </div>
                    <div class="form-group">
                        <label for="userMessage">留言：</label>
                        <textarea id="userMessage" rows="3" placeholder="请输入您的留言..." maxlength="200"></textarea>
                    </div>
                    <button class="submit-btn" onclick="addMessage()">发送留言 ✨</button>
                </div>

                <div class="messages-list" id="messagesList">
                    <!-- 留言将在这里显示 -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // 存储留言的数组
        let messages = JSON.parse(localStorage.getItem('messages')) || [];

        // 页面加载时显示所有留言
        window.onload = function() {
            displayMessages();
            updateStats();
            
            // 每30秒自动刷新一次（模拟实时更新）
            setInterval(updateStats, 30000);
        };

        // 添加留言
        function addMessage() {
            const userName = document.getElementById('userName').value.trim();
            const userMessage = document.getElementById('userMessage').value.trim();

            if (!userName || !userMessage) {
                alert('请填写昵称和留言内容！');
                return;
            }

            const message = {
                id: Date.now(),
                name: userName,
                content: userMessage,
                time: new Date().toLocaleString('zh-CN')
            };

            messages.unshift(message); // 新留言添加到开头
            localStorage.setItem('messages', JSON.stringify(messages));

            // 清空表单
            document.getElementById('userName').value = '';
            document.getElementById('userMessage').value = '';

            displayMessages();
            updateStats();
            
            // 显示成功提示
            showNotification('留言发送成功！感谢您的支持 💖');
        }

        // 显示所有留言
        function displayMessages() {
            const messagesList = document.getElementById('messagesList');
            
            if (messages.length === 0) {
                messagesList.innerHTML = `
                    <div style="text-align: center; padding: 50px; color: #888;">
                        <h3>🌟 暂无留言</h3>
                        <p>成为第一个留言的人吧！</p>
                    </div>
                `;
                return;
            }

            messagesList.innerHTML = messages.map(message => `
                <div class="message-item">
                    <div class="message-header">
                        <span class="message-name">👤 ${escapeHtml(message.name)}</span>
                        <span class="message-time">🕐 ${message.time}</span>
                    </div>
                    <div class="message-content">
                        ${escapeHtml(message.content)}
                    </div>
                </div>
            `).join('');
        }

        // 更新统计信息
        function updateStats() {
            const today = new Date().toDateString();
            const todayMessages = messages.filter(msg => 
                new Date(msg.time).toDateString() === today
            );

            document.getElementById('messageCount').textContent = messages.length;
            document.getElementById('todayCount').textContent = todayMessages.length;
        }

        // 显示通知
        function showNotification(message) {
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: linear-gradient(45deg, #00b894, #00cec9);
                color: white;
                padding: 15px 25px;
                border-radius: 10px;
                box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
                z-index: 1000;
                animation: slideInRight 0.5s ease;
            `;
            notification.textContent = message;
            document.body.appendChild(notification);

            setTimeout(() => {
                notification.remove();
            }, 3000);
        }

        // HTML转义函数
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 添加CSS动画
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideInRight {
                from {
                    opacity: 0;
                    transform: translateX(100px);
                }
                to {
                    opacity: 1;
                    transform: translateX(0);
                }
            }
        `;
        document.head.appendChild(style);

        // 回车键发送留言
        document.getElementById('userMessage').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && e.ctrlKey) {
                addMessage();
            }
        });
    </script>
</body>
</html>
