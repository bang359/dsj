<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>网络电视</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        .container {
            width: 80%;
            margin: auto;
            overflow: hidden;
        }
        header {
            background: #333;
            color: #fff;
            padding: 10px 0;
            text-align: center;
        }
        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            padding: 0;
        }
        nav li {
            margin: 0 15px;
        }
        nav a {
            color: #fff;
            text-decoration: none;
            font-size: 18px;
        }
        section {
            background: #fff;
            margin-top: 20px;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,.1);
        }
        .channel-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }
        .channel-item {
            background: #eee;
            padding: 10px;
            text-align: center;
            border-radius: 5px;
            transition: background .3s ease;
        }
        .channel-item:hover {
            background: #ddd;
        }
        .channel-item a {
            color: #333;
            text-decoration: none;
            font-size: 16px;
            display: block;
        }
        footer {
            background: #333;
            color: #fff;
            text-align: center;
            padding: 10px 0;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<header>
    <h1>网络电视</h1>
</header>

<nav>
    <ul>
        <li><a href="#">首页</a></li>
        <li><a href="#">分类</a></li>
        <li><a href="#">排行榜</a></li>
        <li><a href="#">关于我们</a></li>
    </ul>
</nav>

<section>
    <div class="container">
        <h2>热门频道</h2>
        <div class="channel-list" id="channelList">
            <!-- 动态加载频道 -->
        </div>
    </div>
</section>

<footer>
    &copy; 2023 网络电视 版权所有
</footer>

<script>
// 内置直播源
const liveSources = [
    { name: 'CCTV-1', url: 'http://1.24.39.180:9003/hls/1/index.m3u8' },
    { name: 'CCTV-2', url: 'http://39.81.41.1:1234/608807420' },
    { name: 'CCTV-3', url: 'https://ntd02.akamaized.net/HD-NY/tracks-v3a1/mono.m3u8' },

     


    // 添加更多直播源...
];

// 加载频道列表
function loadChannels() {
    const channelList = document.getElementById('channelList');
    liveSources.forEach(source => {
        const channelItem = document.createElement('div');
        channelItem.className = 'channel-item';
        
        const link = document.createElement('a');
        link.href = '#'; // 可替换为实际的播放链接
        link.textContent = source.name;

        channelItem.appendChild(link);
        channelList.appendChild(channelItem);
    });
}

window.onload = loadChannels;
</script>

</body>
</html>
