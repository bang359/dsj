<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>高清电视直播</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#000;color:#fff;font-family:system-ui}
.main{display:flex;height:100%}

.sidebar{width:160px;background:#111;padding:10px;overflow-y:auto}
.channel{padding:10px;margin:4px 0;background:#222;border-radius:6px;cursor:pointer}
.channel.active{background:#007AFF}

.player{flex:1}
video{width:100%;height:100%;object-fit:contain}
.tip{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff}
</style>
</head>

<body>
<div class="main">
  <div class="sidebar">
    <div id="list">加载频道中...</div>
  </div>
  <div class="player" style="position:relative">
    <video id="player" playsinline controls></video>
    <div class="tip" id="tip">点击播放</div>
  </div>
</div>

<script>
const source = "https://gh-proxy.org/https://github.com/bang359/dsj/blob/main/iphone.txt";
const player = document.getElementById("player");
const list = document.getElementById("list");
const tip = document.getElementById("tip");

let channels = [];

// 读取频道
async function load(){
  let r = await fetch(source);
  let t = await r.text();
  channels = t.split("\n").filter(i=>i).map(i=>{
    let [n,u] = i.split(",");
    return {name:n,url:u};
  });
  show();
}

// 显示列表
function show(){
  list.innerHTML = "";
  channels.forEach((c,i)=>{
    let div = document.createElement("div");
    div.className = "channel";
    div.innerText = c.name;
    div.onclick = ()=>{
      document.querySelectorAll(".channel").forEach(j=>j.classList.remove("active"));
      div.classList.add("active");
      player.src = c.url;
      tip.innerText = "加载中...";
    };
    list.appendChild(div);
  });
}

// 点击播放（苹果必须手动点）
document.addEventListener("click",()=>{
  player.volume = 1;
  player.play().catch(e=>{});
  tip.style.display = "none";
},{once:true});

load();
</script>
</body>
</html>
