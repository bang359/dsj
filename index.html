<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="快播直播">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>快播直播 · 高清完整版</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.1/dist/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.6.12/dist/lunar.min.js"></script>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
:root {
  --qvod-black: #0f0f0f;
  --qvod-dark: #1a1a1a;
  --qvod-orange: #ff6c00;
  --qvod-hover: #ff8a00;
  --text-main: #ffffff;
  --text-sub: #b0b0b0;
}
body {
  background: var(--qvod-black);
  color: var(--text-sub);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  height: 100vh;
  overflow: hidden;
}

.top-bar {
  height: 36px;
  background: #111;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 15px;
  font-size: 13px;
  color: #eee;
  border-bottom: 1px solid #222;
}
#timeBox {
  color: var(--qvod-orange);
  font-weight: 500;
}
#online {
  color: #00ffee;
  font-weight: bold;
}

.player-container {
  width: 100vw;
  height: calc(100vh - 36px);
  display: flex;
  flex-direction: column;
  background: var(--qvod-dark);
}
.header {
  height: 40px;
  background: #181818;
  display: flex;
  align-items: center;
  padding: 0 15px;
  font-size: 15px;
  color: var(--text-main);
  border-bottom: 1px solid #282828;
}
.header span {
  color: var(--qvod-orange);
  margin-left: 8px;
  font-weight: bold;
}
.content {
  flex: 1;
  display: flex;
  overflow: hidden;
}
.channel-list {
  width: 240px;
  background: #141414;
  border-left: 1px solid #2a2a2a;
  overflow-y: auto;
  padding: 8px 6px;
  order: 2;
}
.channel-item {
  padding: 10px 12px;
  margin: 4px 0;
  background: #1c1c1c;
  border-radius: 4px;
  cursor: pointer;
  font-size: 14px;
  transition: 0.2s;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.channel-item:hover {
  background: var(--qvod-hover);
  color: #fff;
}
.channel-item.active {
  background: var(--qvod-orange);
  color: #fff;
  font-weight: bold;
}
.video-area {
  flex: 1;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  order: 1;
  position: relative;
  overflow: hidden;
}
.video-wrapper {
  width: 100%;
  height: 100%;
  position: relative;
  background: #000;
}
video {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #000;
}

.right-sidebar {
  width: 240px;
  display: flex;
  flex-direction: column;
  order: 2;
}
.bottom-donate {
  height: 46px;
  background: #111;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  color: #fff;
  border-left: 1px solid #2a2a2a;
}
.bottom-donate a {
  color: var(--qvod-orange);
  text-decoration: none;
  font-weight: bold;
  display: flex;
  align-items: center;
  gap: 8px;
}
.bottom-donate img {
  height: 30px;
  border-radius: 4px;
}

.genre-title {
  padding: 6px 10px;
  font-size: 12px;
  color: #888;
  background: #161616;
  margin: 6px 0 3px;
  border-radius: 3px;
}

@media (max-width: 768px) {
  .content { flex-direction: column; }
  .right-sidebar {
    width: 100%;
    order: 1;
  }
  .channel-list {
    width: 100%;
    height: 140px;
    border-left: none;
    border-bottom: 1px solid #2a2a2a;
  }
  .bottom-donate {
    border-left: none;
  }
  .video-area { order: 2; }
  .top-bar { font-size: 12px; }
}

.channel-list::-webkit-scrollbar { width: 5px; }
.channel-list::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
.channel-list::-webkit-scrollbar-thumb:hover { background: var(--qvod-orange); }
</style>
</head>

<body>
<div class="top-bar">
  <div id="timeBox">--:--:--</div>
  <div id="online">在线人数：加载中...</div>
</div>

<div class="player-container">
  <div class="header">快播直播电视 <span id="status">加载中...</span></div>
  <div class="content">
    <div class="video-area">
      <div class="video-wrapper">
        <video id="videoPlayer" playsinline webkit-playsinline muted></video>
      </div>
    </div>

    <div class="right-sidebar">
      <div class="bottom-donate">
        <a href="https://gh-proxy.org/https://raw.githubusercontent.com/bang359/dsj/main/wx.png" target="_blank">
          <img src="https://gh-proxy.org/https://raw.githubusercontent.com/bang359/dsj/main/wx.png" alt="赞赏">
          支持我们 · 感谢您的鼓励
        </a>
      </div>
      <div class="channel-list" id="channelList"></div>
    </div>
  </div>
</div>

<script>
const video = document.getElementById('videoPlayer');
const channelList = document.getElementById('channelList');
const status = document.getElementById('status');
const timeBox = document.getElementById('timeBox');
const online = document.getElementById('online');

let channels = [];
let currentIndex = 0;
let hls = null;

const sourceUrl = "https://gh-proxy.org/https://github.com/bang359/dsj/raw/main/iphone.txt";
const backupChannels = [
  {name:"CCTV1 综合",url:"https://ivi.bupt.edu.cn/hls/cctv1hd.m3u8"},
  {name:"CCTV5 体育",url:"https://ivi.bupt.edu.cn/hls/cctv5hd.m3u8"},
  {name:"湖南卫视",url:"https://ivi.bupt.edu.cn/hls/hunanhd.m3u8"},
  {name:"浙江卫视",url:"https://ivi.bupt.edu.cn/hls/zhejianghd.m3u8"},
];

video.muted = true;
setTimeout(() => video.muted = false, 1500);

// ==============================================
// 真实在线人数统计（准确版）
// ==============================================
let onlineCount = 0;
function updateOnlineDisplay() {
  online.innerText = `在线人数：${onlineCount} 人`;
}

// 唯一ID（防重复统计）
let uid = localStorage.getItem("uid");
if (!uid) {
  uid = Date.now() + "" + Math.random();
  localStorage.setItem("uid", uid);
}

// 心跳保活 → 关闭页面自动退出
setInterval(() => {
  localStorage.setItem("heart_" + uid, Date.now());
}, 2000);

// 统计所有在线
function calcOnline() {
  let list = [];
  for (let i = 0; i < localStorage.length; i++) {
    let key = localStorage.key(i);
    if (key.startsWith("heart_")) {
      let t = parseInt(localStorage.getItem(key)) || 0;
      if (Date.now() - t < 8000) list.push(key);
    }
  }
  onlineCount = list.length;
  updateOnlineDisplay();
}

setInterval(calcOnline, 3000);
calcOnline();

// ==============================================

function destroyPlayers() {
  try { if (hls) { hls.destroy(); hls = null; } } catch (e) {}
  video.pause();
  video.src = '';
}

function playMedia(url) {
  destroyPlayers();
  video.muted = false;
  status.textContent = "正在播放...";

  if (url.includes('.m3u8')) {
    if (Hls.isSupported()) {
      hls = new Hls({
        enableWorker: true,
        lowLatencyMode: true,
        maxBufferLength: 3,
        maxMaxBufferLength: 6,
      });
      hls.loadSource(url);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFESTPARSED, () => video.play().catch(()=>{}));
    } else {
      video.src = url;
      video.play();
    }
  }
}

async function loadChannels() {
  try {
    const res = await fetch(sourceUrl, { signal: AbortSignal.timeout(15000) });
    const text = await res.text();
    parseChannels(text);
    status.textContent = "加载完成";
    if (channels.length > 0) playChannel(0);
  } catch (e) {
    channels = [...backupChannels];
    renderList();
    playChannel(0);
    status.textContent = "稳定内置源";
  }
}

function parseChannels(text) {
  channels = [];
  channelList.innerHTML = "";
  text.split("\n").forEach(line => {
    line = line.trim();
    if (!line) return;
    if (line.includes(",#genre#")) {
      const div = document.createElement("div");
      div.className = "genre-title";
      div.innerText = line.split(",")[0];
      channelList.appendChild(div);
      return;
    }
    const arr = line.split(",");
    if (arr.length >= 2 && arr[1].startsWith("http")) {
      channels.push({ name: arr[0], url: arr[1] });
    }
  });
  renderList();
}

function renderList() {
  channels.forEach((item, i) => {
    const div = document.createElement("div");
    div.className = "channel-item";
    div.innerText = item.name;
    div.onclick = () => playChannel(i);
    channelList.appendChild(div);
  });
}

function playChannel(index) {
  currentIndex = (index + channels.length) % channels.length;
  playMedia(channels[currentIndex].url);
  document.querySelectorAll(".channel-item").forEach((el, i) => {
    el.classList.toggle("active", i === currentIndex);
  });
}

document.addEventListener("keydown", e => {
  if (e.key === "ArrowUp") playChannel(currentIndex - 1);
  if (e.key === "ArrowDown") playChannel(currentIndex + 1);
});

function updateTime() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2, 0);
  const m = String(now.getMinutes()).padStart(2, 0);
  const s = String(now.getSeconds()).padStart(2, 0);
  const lunar = Lunar.fromDate(now);
  const week = "日一二三四五六"[now.getDay()];
  timeBox.innerText = `${h}:${m}:${s} 周${week} 农历${lunar.getMonth()}月${lunar.getDay()}`;
}

setInterval(updateTime, 1000);
loadChannels();
</script>
</body>
   </html>
