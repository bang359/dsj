
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>快播网络电视</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.12"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;background:#0d0d0d;color:#fff;font-size:14px;overflow:hidden;height:100vh;height:100dvh}
.wrap{display:flex;flex-direction:column;height:100vh}
.header{height:44px;background:linear-gradient(180deg,#1a1a1a 0%,#0d0d0d 100%);border-bottom:2px solid #00cc66;display:flex;align-items:center;padding:0 12px;gap:10px}
.logo{color:#00cc66;font-size:18px;font-weight:bold;text-shadow:0 0 10px rgba(0,204,102,0.5)}
.sub{color:#666;font-size:11px}
.main{flex:1;display:flex;overflow:hidden}
.player{flex:1;background:#000;position:relative;display:flex;align-items:center;justify-content:center;min-height:0}
video{width:100%;height:100%;object-fit:contain;background:#000}
.status{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.9);padding:20px 30px;border-radius:8px;text-align:center;display:none;border:1px solid #00cc66}
.status.show{display:block}
.status-text{color:#00cc66;font-size:14px}
.ch-list{flex:0 0 320px;background:#0d0d0d;border-left:2px solid #00cc66;display:flex;flex-direction:column;overflow:hidden}
.ch-header{height:36px;background:#1a1a1a;border-bottom:1px solid #333;display:flex;align-items:center;padding:0 12px;color:#00cc66;font-size:13px}
.ch-scroll{flex:1;overflow-y:auto;padding:8px}
.ch-item{padding:10px 12px;background:#1a1a1a;border:1px solid #333;border-radius:4px;margin-bottom:6px;cursor:pointer;color:#ccc;font-size:13px;transition:all .15s}
.ch-item:hover{background:#2a2a2a;border-color:#00cc66}
.ch-item:active{background:#333}
.ch-item.active{background:#00cc66;border-color:#00cc66;color:#fff}
.footer{height:40px;background:#0d0d0d;border-top:1px solid #333;display:flex;align-items:center;justify-content:space-between;padding:0 12px}
.info{color:#00cc66;font-size:12px}
.btns{display:flex;gap:8px}
.btn{padding:4px 12px;background:#1a1a1a;border:1px solid #00cc66;color:#00cc66;border-radius:4px;font-size:12px;cursor:pointer}
.btn:active{background:#00cc66;color:#fff}
@media(max-width:768px){
.wrap{height:100vh}
.main{flex-direction:column}
.player{flex:none;height:45vh;min-height:200px}
.ch-list{flex:1;border-left:none;border-top:2px solid #00cc66}
.ch-list{order:2}
.player{order:1}
.ch-scroll{padding:6px}
.ch-item{padding:12px;font-size:14px;margin-bottom:4px}
.footer{padding:0 8px}
}
</style>
</head>
<body>
<div class="wrap">
    <div class="header">
        <span class="logo">▶ 快播网络电视</span>
        <span class="sub">在线观看</span>
    </div>
    <div class="main">
        <div class="player">
            <video id="v" playsinline webkit-playsinline x-webkit-airplay="allow" autoplay></video>
            <div class="status" id="st"><div class="status-text" id="stt">加载中...</div></div>
        </div>
        <div class="ch-list">
            <div class="ch-header">📺 频道列表</div>
            <div class="ch-scroll" id="lst"></div>
        </div>
    </div>
    <div class="footer">
        <div class="info" id="info">准备就绪</div>
        <div class="btns">
            <button class="btn" onclick="location.reload()">刷新</button>
        </div>
    </div>
</div>
<script>
(function(){
    var v=document.getElementById('v');
    var st=document.getElementById('st');
    var stt=document.getElementById('stt');
    var lst=document.getElementById('lst');
    var info=document.getElementById('info');
    var hls=null;
    var chs=[];
    var cur=-1;
    var SRC='https://gh-proxy.org/https://raw.githubusercontent.com/bang359/dsj/main/iphone.txt';

    function log(m){info.textContent=m;}
    function sh(m){st.style.display='block';stt.textContent=m;}
    function hi(){st.style.display='none';}

    function play(u){
        if(!u){sh('无效地址');return}
        log('正在播放...');
        v.volume=0.5;
        if(hls){hls.destroy();hls=null}
        var ext=u.toLowerCase();
        if(ext.indexOf('.m3u8')>-1){
            if(Hls.isSupported()){
                hls=new Hls({enableWorker:true,backBufferLength:30,maxBufferLength:60,loadPolicy:{maxBufferLength:30}});
                hls.loadSource(u);
                hls.attachMedia(v);
                hls.on(Hls.Events.MANIFEST_PARSED,function(){
                    v.play().then(function(){hi();log('播放中');}).catch(function(){sh('点击播放');});
                });
                hls.on(Hls.Events.ERROR,function(e,d){
                    if(d.fatal){sh('播放失败');hls=null}
                });
            }else if(v.canPlayType('application/vnd.apple.mpegurl')){
                v.src=u;v.play().then(function(){hi()}).catch(function(){sh('点击播放')});
            }else{
                v.src=u;v.play().then(function(){hi()}).catch(function(){sh('点击播放')});
            }
        }else if(ext.indexOf('.mpd')>-1){
            v.src=u;v.play().then(function(){hi()}).catch(function(){sh('点击播放')});
        }else if(ext.indexOf('.flv')>-1){
            v.src=u;v.play().then(function(){hi()}).catch(function(){sh('点击播放')});
        }else if(ext.indexOf('.mp4')>-1 || ext.indexOf('.m4v')>-1 || ext.indexOf('.mov')>-1){
            v.src=u;v.play().then(function(){hi()}).catch(function(){sh('点击播放')});
        }else{
            v.src=u;v.play().then(function(){hi()}).catch(function(){sh('点击播放')});
        }
    }

    function pick(i){
        if(i<0||i>=chs.length)return;
        cur=i;
        var els=lst.children;
        for(var j=0;j<els.length;j++)els[j].className='ch-item'+(j===i?' active':'');
        var ch=chs[i];
        sh('加载中...');
        play(ch.u);
    }

    function load(){
        sh('加载频道...');
        log('正在获取频道列表...');
        fetch(SRC).then(function(r){
            if(!r.ok)throw new Error('网络错误');
            return r.text();
        }).then(function(t){
            var lines=t.split('\n');
            chs=[];
            lst.innerHTML='';
            var n=0;
            lines.forEach(function(line){
                line=line.trim();
                if(!line||line.charAt(0)==='#')return;
                var i=line.indexOf(',');
                if(i>0){
                    var name=line.substring(0,i).trim();
                    var url=line.substring(i+1).trim();
                    if(name&&url&&url.indexOf('http')===0){
                        chs.push({n:name,u:url});
                        var b=document.createElement('div');
                        b.className='ch-item';
                        b.textContent=name;
                        b.onclick=function(){pick(n)};
                        lst.appendChild(b);
                        n++;
                    }
                }
            });
            hi();
            log('已加载'+n+'个频道');
            if(n>0)pick(0);
        }).catch(function(e){
            sh('加载失败');
            log(e.message);
        });
    }

    v.volume=0.5;

    v.addEventListener('click',function(){
        if(v.paused&&cur>=0)v.play().then(function(){hi()}).catch(function(){});
    });

    load();
})();
</script>
</body>
</html>
