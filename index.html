<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📺电视家重生版</title>
<link href="https://cdn.jsdelivr.net/npm/video.js/dist/video-js.min.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;padding:15px;font-family:Arial}
.container{max-width:1200px;margin:0 auto}
.title{text-align:center;margin:0 0 15px;color:#00d9ff}
.player{border-radius:12px;overflow:hidden;margin-bottom:15px}
.channels{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;max-height:500px;overflow-y:auto}

/* 🖤 暗黑风格按钮 */
.channels button{
  padding:10px;
  background:#161616;      /* 超黑底色 */
  color:#ffffff;          /* 白色文字 */
  border:none;
  border-radius:8px;
  cursor:pointer;
  transition:0.2s;
}

/* 鼠标悬浮效果 */
.channels button:hover{
  background:#252525;
}

/* 选中状态：蓝色高亮 */
.channels button.active{
  background:#007bff;
  color:#fff;
}
</style>
</head>

<body>
<div class="container">
  <h2 class="title">📺电视家重生版</h2>
  <div class="player">
    <video id="tv" class="video-js vjs-fluid" controls autoplay></video>
  </div>
  <div class="channels" id="list"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/video.js/dist/video.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@videojs/http-streaming/dist/videojs-http-streaming.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flv.js/dist/flv.min.js"></script>

<script>
const player = videojs('tv', {
  autoplay: true,
  fluid: true,
  preload: 'auto'
});

const sourceUrl = "https://gh-proxy.org/https://github.com/bang359/dsj/raw/main/iphone.txt";
const list = document.getElementById('list');
let activeBtn = null;

fetch(sourceUrl)
.then(r=>r.text())
.then(t=>{
  t.split('\n').forEach(line=>{
    line = line.trim();
    if(!line || !line.includes(',')) return;
    const [name, url] = line.split(',',2);
    
    const btn = document.createElement('button');
    btn.textContent = name;
    btn.onclick = ()=>{
      if(activeBtn) activeBtn.classList.remove('active');
      activeBtn = btn;
      btn.classList.add('active');
      playAnySource(url);
    };
    list.appendChild(btn);
  });
})
.catch(e=>alert("加载失败，请打开 CORS 插件"));

function playAnySource(url) {
  let type = '';
  if (url.includes('.m3u8')) type = 'application/x-mpegURL';
  else if (url.includes('.flv')) type = 'video/x-flv';
  else if (url.includes('.mp4')) type = 'video/mp4';
  else if (url.includes('.ts')) type = 'video/MP2T';
  else type = 'video/mp4';

  player.src({ src: url, type: type });
  player.play();
}
</script>
</body>
</html>
