<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="电视直播">
<title>电视直播</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif;
  background: linear-gradient(180deg, #000000 0%, #0a0a0a 100%);
  color: #fff;
  min-height: 100vh;
  padding: 0;
  overflow-x: hidden;
}

.status-bar {
  height: env(safe-area-inset-top, 20px);
  background: #000;
}

.container {
  padding: 0 12px;
  padding-bottom: calc(20px + env(safe-area-inset-bottom));
}

.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 0;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  margin-bottom: 16px;
}

.time {
  font-size: 16px;
  font-weight: 500;
  color: #e0e0e0;
}

.weather {
  font-size: 14px;
  color: #aaa;
}

.title {
  font-size: 18px;
  font-weight: 600;
  background: linear-gradient(90deg, #00d9ff, #007bff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.player-wrapper {
  border-radius: 16px;
  overflow: hidden;
  background: #000;
  box-shadow: 0 8px 32px rgba(0,0,0,0.6);
  margin-bottom: 20px;
  position: relative;
}

video {
  width: 100%;
  display: block;
  background: #000;
}

.loading {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.7);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 12px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}

.loading.show {
  opacity: 1;
  pointer-events: auto;
}

.spinner {
  width: 36px;
  height: 36px;
  border: 3px solid rgba(255,255,255,0.2);
  border-top-color: #00d9ff;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.channels-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  max-height: calc(100vh - 360px);
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

.channel-btn {
  padding: 14px 8px;
  background: linear-gradient(145deg, #1a1a1a, #121212);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px;
  color: #e0e0e0;
  font-size: 13px;
  font-weight: 500;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s ease;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.channel-btn.active {
  background: linear-gradient(145deg, #007bff, #0056b3);
  border-color: #007bff;
  color: #fff;
  box-shadow: 0 4px 16px rgba(0,123,255,0.3);
}

::-webkit-scrollbar {
  width: 2px;
}

::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.2);
  border-radius: 1px;
}
</style>
</head>

<body>
<div class="status-bar"></div>
<div class="container">
  <div class="top-bar">
    <div class="time" id="time"></div>
    <div class="title">📺 电视直播</div>
    <div class="weather" id="weather">加载中...</div>
  </div>

  <div class="player-wrapper">
    <video id="tv" playsinline webkit-playsinline x-webkit-airplay="allow" controls></video>
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <div class="loading-text">正在加载...</div>
    </div>
  </div>

  <div class="channels-grid" id="channels"></div>
</div>

<script>
const tv = document.getElementById('tv');
const channelsEl = document.getElementById('channels');
const loading = document.getElementById('loading');
const timeEl = document.getElementById('time');
const weatherEl = document.getElementById('weather');
let activeBtn = null;
let hasUserInteracted = false;

// 全部HTTPS稳定源，iPhone直接能播
const channels = [
  {name:"NTD",url:"https://ntd02.akamaized.net/HD-NY/tracks-v3a1/mono.m3u8"},
  {name:"镜新闻",url:"http://rihou.cc:555/tv/镜新闻"},
  {name:"CCTV3 综艺",url:"http://1.24.39.180:9003/hls/1/index.m3u8"},
  {name:"CCTV1 高清",url:"https://ivi.bupt.edu.cn/hls/cctv1hd.m3u8"},
  {name:"CCTV2 财经",url:"https://ivi.bupt.edu.cn/hls/cctv2hd.m3u8"},
  {name:"CCTV3 综艺",url:"https://ivi.bupt.edu.cn/hls/cctv3hd.m3u8"},
  {name:"CCTV4 国际",url:"https://ivi.bupt.edu.cn/hls/cctv4hd.m3u8"},
  {name:"CCTV5 体育",url:"https://ivi.bupt.edu.cn/hls/cctv5hd.m3u8"},
  {name:"CCTV5+",url:"https://ivi.bupt.edu.cn/hls/cctv5phd.m3u8"},
  {name:"CCTV6 电影",url:"https://ivi.bupt.edu.cn/hls/cctv6hd.m3u8"},
  {name:"CCTV7 军事",url:"https://ivi.bupt.edu.cn/hls/cctv7hd.m3u8"},
  {name:"CCTV8 电视剧",url:"https://ivi.bupt.edu.cn/hls/cctv8hd.m3u8"},
  {name:"CCTV9 纪录",url:"https://ivi.bupt.edu.cn/hls/cctv9hd.m3u8"},
  {name:"CCTV13 新闻",url:"https://ivi.bupt.edu.cn/hls/cctv13hd.m3u8"},
  {name:"CCTV14 少儿",url:"https://ivi.bupt.edu.cn/hls/cctv14hd.m3u8"},
  {name:"湖南卫视",url:"https://ivi.bupt.edu.cn/hls/hnws.m3u8"},
  {name:"浙江卫视",url:"https://ivi.bupt.edu.cn/hls/zjws.m3u8"},
  {name:"江苏卫视",url:"https://ivi.bupt.edu.cn/hls/jsws.m3u8"},
  {name:"东方卫视",url:"https://ivi.bupt.edu.cn/hls/dongfangws.m3u8"},
  {name:"广东卫视",url:"https://ivi.bupt.edu.cn/hls/gdws.m3u8"},
  {name:"深圳卫视",url:"https://ivi.bupt.edu.cn/hls/szws.m3u8"}
];

// 实时时间
function updateTime() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2,'0');
  const m = String(now.getMinutes()).padStart(2,'0');
  const s = String(now.getSeconds()).padStart(2,'0');
  const week = ['周日','周一','周二','周三','周四','周五','周六'][now.getDay()];
  timeEl.textContent = `${h}:${m}:${s} ${week}`;
}
updateTime();
setInterval(updateTime, 1000);

// 天气
fetch('https://api.oioweb.cn/api/weather/GetWeather')
  .then(r=>r.json())
  .then(d=>{
    if(d.code===200) weatherEl.textContent = `${d.result.city} ${d.result.temp}° ${d.result.weather}`;
  })
  .catch(()=>weatherEl.textContent='');

// 渲染频道
channels.forEach((ch,i)=>{
  const btn = document.createElement('button');
  btn.className = 'channel-btn';
  btn.textContent = ch.name;
  btn.onclick = ()=>{
    hasUserInteracted = true;
    if(activeBtn) activeBtn.classList.remove('active');
    activeBtn = btn;
    btn.classList.add('active');
    loading.classList.add('show');
    tv.src = ch.url;
    tv.load();
    tv.play().then(()=>{
      tv.muted = false;
      tv.volume = 1;
      loading.classList.remove('show');
    }).catch(()=>loading.classList.remove('show'));
  };
  channelsEl.appendChild(btn);
  if(i===0) setTimeout(()=>btn.click(),500);
});

// 苹果自动播放兼容
tv.muted = true;
tv.autoplay = true;
document.addEventListener('click',()=>{
  if(hasUserInteracted && tv.muted){
    tv.muted = false;
    tv.volume = 1;
  }
},{once:true});
</script>
</body>
</html>
