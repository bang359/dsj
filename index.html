
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="快播网络电视">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>快播网络电视</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/dashjs@latest/dist/dash.all.min.js"></script>
<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;
        -webkit-tap-highlight-color: transparent;
    }
    html,body{
        height:100%;
        background:#0d0d0d;
        color:#fff;
        overflow:hidden;
    }
    .container{
        display:flex;
        flex-direction:column;
        height:100vh;
    }
    /* 顶部标题栏 */
    .header{
        height:44px;
        background:linear-gradient(180deg, #1a1a1a 0%, #0d0d0d 100%);
        border-bottom:2px solid #00cc66;
        display:flex;
        align-items:center;
        padding:0 12px;
        gap:10px;
        z-index:100;
    }
    .logo{
        color:#00cc66;
        font-size:18px;
        font-weight:bold;
        text-shadow:0 0 10px rgba(0,204,102,0.5);
    }
    .sub{
        color:#666;
        font-size:11px;
    }
    /* 视频播放区域 */
    .video-box{
        flex:1;
        background:#000;
        position:relative;
        min-height:0;
    }
    /* 响应式设计 */
    @media (min-width: 768px) {
        /* 电脑端布局 */
        .container{
            flex-direction:row;
        }
        .main-content{
            flex:1;
            display:flex;
            flex-direction:column;
        }
        .video-box{
            flex:1;
            min-height:0;
        }
        .channel-box{
            width:320px;
            height:100vh;
        }
    }
    @media (max-width: 767px) {
        /* 手机端布局 */
        .video-box{
            height:45vh;
            min-height:200px;
        }
        .channel-item{
            padding:12px 14px;
            font-size:14px;
        }
    }
    video{
        width:100%;
        height:100%;
        object-fit:contain;
        background:#000;
    }
    /* 增强响应式体验 */
    @media (min-width: 1024px) {
        .channel-item{
            padding:14px 16px;
            font-size:15px;
        }
    }
    @media (max-width: 480px) {
        .channel-item{
            padding:10px 12px;
            font-size:13px;
        }
        .channel-box{
            padding:8px;
        }
    }
    .loading{
        position:absolute;
        top:50%;
        left:50%;
        transform:translate(-50%,-50%);
        color:#00cc66;
        font-size:16px;
        background:rgba(0,0,0,0.8);
        padding:15px 25px;
        border-radius:8px;
        border:1px solid #00cc66;
    }

    /* 频道列表区域 */
    .channel-box{
        background:#0d0d0d;
        border-left:2px solid #00cc66;
        padding:8px;
        overflow-y:auto;
    }
    .channel-header{
        height:36px;
        background:#1a1a1a;
        border-bottom:1px solid #333;
        display:flex;
        align-items:center;
        padding:0 12px;
        color:#00cc66;
        font-size:13px;
        margin-bottom:10px;
    }
    .channel-item{
        width:100%;
        padding:12px 14px;
        background:#1a1a1a;
        border:1px solid #333;
        border-radius:4px;
        color:#ccc;
        font-size:14px;
        text-align:left;
        margin-bottom:6px;
        cursor:pointer;
        transition:all 0.15s;
    }
    .channel-item:hover{
        background:#2a2a2a;
        border-color:#00cc66;
    }
    .channel-item:active{
        background:#333;
    }
    .channel-item.active{
        background:#00cc66;
        border-color:#00cc66;
        color:#fff;
        font-weight:500;
    }
    /* 滚动条隐藏 */
    ::-webkit-scrollbar{
        width:0;
    }
    /* 在线人数显示 */
    .online-count{
        position:absolute;
        top:10px;
        right:10px;
        background:rgba(0,0,0,0.7);
        padding:6px 12px;
        border-radius:20px;
        font-size:14px;
        display:flex;
        align-items:center;
        gap:5px;
        z-index:10;
    }
    .online-icon{
        font-size:16px;
    }
    /* 响应式调整 */
    @media (max-width: 767px) {
        .online-count{
            padding:4px 8px;
            font-size:12px;
        }
        .online-icon{
            font-size:14px;
        }
        .loading{
            font-size:14px;
            padding:12px 20px;
        }
    }
    /* 打赏按钮 */
    .reward-btn{
        background:linear-gradient(135deg, #ff6b6b, #ee5a5a);
        padding:4px 12px;
        border-radius:20px;
        font-size:12px;
        color:#fff;
        cursor:pointer;
        transition:all 0.3s ease;
        box-shadow:0 2px 8px rgba(255,107,107,0.3);
    }
    .reward-btn:hover{
        transform:scale(1.05);
        box-shadow:0 4px 12px rgba(255,107,107,0.4);
    }
    /* 打赏模态框 */
    .reward-modal{
        display:none;
        position:fixed;
        top:0;
        left:0;
        width:100%;
        height:100%;
        background:rgba(0,0,0,0.8);
        z-index:1000;
        justify-content:center;
        align-items:center;
    }
    .reward-modal.show{
        display:flex;
    }
    .reward-content{
        background:#1e1e1e;
        border-radius:16px;
        padding:24px;
        max-width:320px;
        width:90%;
        box-shadow:0 10px 40px rgba(0,0,0,0.5);
    }
    .reward-header{
        display:flex;
        justify-content:space-between;
        align-items:center;
        margin-bottom:20px;
    }
    .reward-header h3{
        font-size:18px;
        color:#00cc66;
        margin:0;
    }
    .reward-close{
        background:none;
        border:none;
        color:#888;
        font-size:28px;
        cursor:pointer;
        padding:0;
        line-height:1;
    }
    .reward-close:hover{
        color:#fff;
    }
    .reward-body{
        text-align:center;
    }
    .reward-qrcode{
        width:200px;
        height:200px;
        border-radius:8px;
        margin-bottom:16px;
    }
    .reward-tip{
        color:#aaa;
        font-size:14px;
        margin:0;
    }
    /* 响应式打赏 */
    @media (max-width: 767px) {
        .reward-btn{
            position:absolute;
            bottom:10px;
            right:10px;
            padding:5px 12px;
            font-size:12px;
        }
        .reward-content{
            padding:20px;
        }
        .reward-qrcode{
            width:180px;
            height:180px;
        }
    }
    /* 底部状态栏 */
    .footer{
        height:40px;
        background:#0d0d0d;
        border-top:1px solid #333;
        display:flex;
        align-items:center;
        gap:12px;
        padding:0 12px;
        font-size:12px;
        color:#00cc66;
    }
    .footer-info{
        flex:1;
        overflow:hidden;
        text-overflow:ellipsis;
        white-space:nowrap;
    }
    .footer-controls{
        display:flex;
        align-items:center;
        gap:10px;
    }
    .volume-control{
        display:flex;
        align-items:center;
        gap:6px;
    }
    .volume-icon{
        font-size:14px;
        color:#00cc66;
    }
    .volume-control input[type="range"]{
        width:80px;
        height:4px;
        background:#333;
        border-radius:2px;
        outline:none;
        -webkit-appearance:none;
    }
    .volume-control input[type="range"]::-webkit-slider-thumb{
        -webkit-appearance:none;
        appearance:none;
        width:12px;
        height:12px;
        background:#00cc66;
        border-radius:50%;
        cursor:pointer;
    }
    .volume-control input[type="range"]::-moz-range-thumb{
        width:12px;
        height:12px;
        background:#00cc66;
        border-radius:50%;
        cursor:pointer;
        border:none;
    }
    .footer-btns{
        display:flex;
        gap:8px;
    }
    .footer-btn{
        padding:4px 12px;
        background:#1a1a1a;
        border:1px solid #00cc66;
        color:#00cc66;
        border-radius:4px;
        font-size:12px;
        cursor:pointer;
    }
    .footer-btn:active{
        background:#00cc66;
        color:#fff;
    }
</style>
</head>
<body>
<div class="container">
    <div class="main-content">
        <div class="header">
            <span class="logo">▶ 快播网络电视</span>
            <span class="sub">在线观看</span>
        </div>
        <div class="video-box">
            <video id="video" playsinline webkit-playsinline crossorigin="anonymous"></video>
            <div class="loading" id="loading">加载中...</div>
            <div class="online-count">
                <span class="online-icon">👁️</span>
                <span id="onlineNumber">0</span>
            </div>
        </div>
        <div class="footer">
            <div class="footer-info" id="footerInfo">准备就绪</div>
            <div class="footer-controls">
                <button class="footer-btn" id="playPauseBtn">⏸️</button>
                <div class="volume-control">
                    <span class="volume-icon">🔉</span>
                    <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="0.5">
                </div>
            </div>
            <div class="reward-btn" id="rewardBtn">❤️ 打赏</div>
            <div class="footer-btns">
                <button class="footer-btn" onclick="location.reload()">刷新</button>
            </div>
        </div>
    </div>
    <div class="channel-box">
        <div class="channel-header">📺 频道列表</div>
        <div id="channelList"></div>
    </div>
</div>
<!-- 打赏模态框 -->
<div class="reward-modal" id="rewardModal">
    <div class="reward-content">
        <div class="reward-header">
            <h3>❤️ 支持一下</h3>
            <button class="reward-close" id="rewardClose">×</button>
        </div>
        <div class="reward-body">
            <img src="https://gh-proxy.org/https://raw.githubusercontent.com/bang359/dsj/main/wx.png" alt="打赏二维码" class="reward-qrcode">
            <p class="reward-tip">微信扫一扫打赏</p>
        </div>
    </div>
</div>
<script>
const video = document.getElementById('video');
const loading = document.getElementById('loading');
const channelList = document.getElementById('channelList');
const onlineNumber = document.getElementById('onlineNumber');
const footerInfo = document.getElementById('footerInfo');
let hls = null;
let currentActive = null;
let onlineCount = 0;

// 你指定的官方源，不做任何修改
const sourceURL = "https://gh-proxy.org/https://github.com/bang359/dsj/raw/main/iphone.txt";

// 加载状态
function showLoading(){ loading.style.display = 'block'; }
function hideLoading(){ loading.style.display = 'none'; }

// 播放函数（自动播放）
function playVideo(url, btn) {
    showLoading();
    footerInfo.textContent = '正在播放...';
    
    // 销毁之前的播放
    if(hls) hls.destroy();
    
    // 高亮当前频道
    if(currentActive) currentActive.classList.remove('active');
    btn.classList.add('active');
    currentActive = btn;

    // 增强的格式检测和处理
    try {
        // 保存当前音量设置
        const savedVolume = currentVolume;
        
        // 1. HLS 格式 (.m3u8)
        if (Hls.isSupported() && (url.includes('.m3u8') || url.includes('hls') || url.includes('playlist'))) {
            console.log('检测到HLS格式:', url);
            footerInfo.textContent = '正在加载HLS流...';
            hls = new Hls({enableWorker:true,backBufferLength:30,maxBufferLength:60});
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                video.play().catch(() => {
                    console.log('HLS自动播放失败，等待用户交互');
                }).finally(() => {
                    hideLoading();
                    footerInfo.textContent = '播放中';
                    // 恢复音量设置
                    video.volume = savedVolume;
                });
            });
            hls.on(Hls.Events.ERROR, (event, data) => {
                console.error('HLS播放错误:', data);
                if (data.fatal) {
                    switch(data.type) {
                        case Hls.ErrorTypes.NETWORK_ERROR:
                            console.error('网络错误，尝试重新加载');
                            hls.startLoad();
                            break;
                        case Hls.ErrorTypes.MEDIA_ERROR:
                            console.error('媒体错误，尝试恢复');
                            hls.recoverMediaError();
                            break;
                        default:
                            hideLoading();
                            footerInfo.textContent = '播放失败';
                            break;
                    }
                }
            });
        }

        // 2. DASH 格式 (.mpd)
        else if (url.includes('.mpd') || url.includes('dash')) {
            console.log('检测到DASH格式:', url);
            footerInfo.textContent = '正在加载DASH流...';
            try {
                if (typeof dashjs !== 'undefined') {
                    // 使用dash.js播放DASH格式
                    var player = dashjs.MediaPlayer().create();
                    player.initialize(video, url, true);
                    player.on(dashjs.MediaPlayer.events.PLAYBACK_ENDED, () => {
                        hideLoading();
                        footerInfo.textContent = '播放中';
                        // 恢复音量设置
                        video.volume = savedVolume;
                    });
                    player.on(dashjs.MediaPlayer.events.ERROR, (e) => {
                        console.error('DASH播放错误:', e);
                        hideLoading();
                        footerInfo.textContent = '播放失败';
                    });
                    // 给播放器一些时间初始化
                    setTimeout(() => {
                        hideLoading();
                        footerInfo.textContent = '播放中';
                        video.volume = savedVolume;
                    }, 3000);
                } else {
                    // 没有dash.js时尝试直接播放
                    video.src = url;
                    video.play().catch(() => {
                        console.log('DASH直接播放失败，尝试作为普通流播放');
                        video.src = url;
                    }).finally(() => {
                        hideLoading();
                        footerInfo.textContent = '播放中';
                        // 恢复音量设置
                        video.volume = savedVolume;
                    });
                }
            } catch (e) {
                console.error('DASH播放初始化错误:', e);
                // 失败时作为普通流播放
                video.src = url;
                hideLoading();
                footerInfo.textContent = '播放中';
                video.volume = savedVolume;
            }
        }

        // 3. FLV格式特别处理
        else if (url.includes('.flv') || url.includes('flv')) {
            console.log('检测到FLV格式:', url);
            footerInfo.textContent = '正在加载FLV流...';
            // 尝试直接播放FLV
            video.src = url;
            video.play().catch(() => {
                console.log('FLV自动播放失败，等待用户交互');
            }).finally(() => {
                hideLoading();
                footerInfo.textContent = '播放中';
                // 恢复音量设置
                video.volume = savedVolume;
            });
        }

        // 4. 普通视频格式
        else if (url.match(/\.(mp4|webm|ogg|mov|avi|wmv|mkv|ts|m4v)$/i)) {
            console.log('检测到普通视频格式:', url);
            footerInfo.textContent = '正在加载视频...';
            video.src = url;
            video.play().catch(() => {
                console.log('视频自动播放失败，等待用户交互');
            }).finally(() => {
                hideLoading();
                footerInfo.textContent = '播放中';
                // 恢复音量设置
                video.volume = savedVolume;
            });
        }

        // 5. 音频格式
        else if (url.match(/\.(mp3|aac|wav|flac|ogg)$/i)) {
            console.log('检测到音频格式:', url);
            footerInfo.textContent = '正在加载音频...';
            video.src = url;
            video.play().catch(() => {
                console.log('音频自动播放失败，等待用户交互');
            }).finally(() => {
                hideLoading();
                footerInfo.textContent = '播放中';
                // 恢复音量设置
                video.volume = savedVolume;
            });
        }

        // 6. HTTP流格式（包括无扩展名的流）
        else if (url.startsWith('http')) {
            console.log('检测到HTTP流格式:', url);
            footerInfo.textContent = '正在加载流...';
            
            // 尝试多种播放策略
            // 策略1: 直接设置为视频源
            video.src = url;
            
            // 策略2: 等待视频加载完成后播放
            video.onloadedmetadata = function() {
                console.log('视频元数据加载完成');
                video.play().catch(() => {
                    console.log('流自动播放失败，等待用户交互');
                }).finally(() => {
                    hideLoading();
                    footerInfo.textContent = '播放中';
                    // 恢复音量设置
                    video.volume = savedVolume;
                });
            };
            
            // 策略3: 超时处理
            setTimeout(() => {
                if (loading.style.display === 'block') {
                    console.log('流加载超时，尝试作为普通视频播放');
                    hideLoading();
                    footerInfo.textContent = '播放中';
                    video.volume = savedVolume;
                }
            }, 5000);
        }

        // 7. 其他格式
        else {
            console.warn('未知格式:', url);
            footerInfo.textContent = '正在加载...';
            video.src = url;
            video.play().catch(() => {
                console.log('未知格式自动播放失败，等待用户交互');
            }).finally(() => {
                hideLoading();
                footerInfo.textContent = '播放中';
                // 恢复音量设置
                video.volume = savedVolume;
            });
        }

    } catch (error) {
        console.error('播放初始化错误:', error);
        // 不显示错误提示
        hideLoading();
        footerInfo.textContent = '播放失败';
    }
}

// 加载频道列表
console.log('开始加载频道列表:', sourceURL);
fetch(sourceURL)
.then(res => {
    console.log('获取直播源响应:', res.status);
    return res.text();
})
.then(text => {
    console.log('获取直播源内容长度:', text.length);
    console.log('前1000字符:', text.substring(0, 1000));
    let firstUrl = '';
    let firstBtn = null;
    let channelCount = 0;

    text.split('\n').forEach(line => {
        if(line.includes(',')){
            const [name, url] = line.split(',', 2);
            if(name && url && url.startsWith('http')){
                channelCount++;
                const btn = document.createElement('button');
                btn.className = 'channel-item';
                btn.innerText = name.trim();
                btn.onclick = () => playVideo(url.trim(), btn);
                channelList.appendChild(btn);
                console.log('添加频道:', name.trim(), url.trim());

                if(!firstUrl){
                    firstUrl = url.trim();
                    firstBtn = btn;
                }
            }
        }
    });

    console.log('频道加载完成，共加载', channelCount, '个频道');
    // 自动播放第一个频道
    if(firstUrl) {
        footerInfo.textContent = '加载频道完成，共' + channelCount + '个频道';
        playVideo(firstUrl, firstBtn);
    } else {
        footerInfo.textContent = '无可用频道';
        hideLoading();
    }
})
.catch(err => {
    console.error('加载频道失败:', err);
    channelList.innerHTML = '<div class="channel-item" style="text-align:center;color:#ff6b6b;">直播源加载失败，请刷新重试</div>';
    footerInfo.textContent = '加载失败: ' + err.message;
    hideLoading();
});

// 打赏功能
const rewardBtn = document.getElementById('rewardBtn');
const rewardModal = document.getElementById('rewardModal');
const rewardClose = document.getElementById('rewardClose');

rewardBtn.addEventListener('click', () => {
    rewardModal.classList.add('show');
});

rewardClose.addEventListener('click', () => {
    rewardModal.classList.remove('show');
});

rewardModal.addEventListener('click', (e) => {
    if (e.target === rewardModal) {
        rewardModal.classList.remove('show');
    }
});

// 本地在线人数统计（无需Firebase）
function initLocalViewerCount() {
    // 模拟在线人数（基于随机数，实际项目中可使用真实的统计服务）
    function updateViewerCount() {
        // 模拟1-50之间的在线人数
        onlineCount = Math.floor(Math.random() * 50) + 1;
        onlineNumber.textContent = onlineCount;
        console.log('当前在线人数:', onlineCount);
    }
    
    // 初始值
    updateViewerCount();
    
    // 每5秒更新一次
    setInterval(updateViewerCount, 5000);
}

// 页面加载完成后初始化
initLocalViewerCount();

// 播放控制功能
const playPauseBtn = document.getElementById('playPauseBtn');
const volumeSlider = document.getElementById('volumeSlider');
const volumeIcon = document.querySelector('.volume-icon');

// 播放/暂停控制
playPauseBtn.addEventListener('click', function() {
    if (video.paused) {
        video.play().then(() => {
            console.log('播放成功');
            playPauseBtn.textContent = '⏸️';
        }).catch((error) => {
            console.error('播放失败:', error);
            footerInfo.textContent = '播放失败: ' + error.message;
        });
    } else {
        video.pause();
        playPauseBtn.textContent = '▶️';
        footerInfo.textContent = '已暂停';
    }
});

// 保存当前音量
let currentVolume = 0.5;

// 音量控制
volumeSlider.addEventListener('input', function() {
    currentVolume = parseFloat(this.value);
    video.volume = currentVolume;
    // 更新音量图标
    if (currentVolume === 0) {
        volumeIcon.textContent = '🔇';
    } else if (currentVolume < 0.5) {
        volumeIcon.textContent = '🔉';
    } else {
        volumeIcon.textContent = '🔊';
    }
});

// 初始化音量
video.volume = currentVolume;
volumeSlider.value = currentVolume;

// 视频状态监听
video.addEventListener('play', function() {
    playPauseBtn.textContent = '⏸️';
});

video.addEventListener('pause', function() {
    playPauseBtn.textContent = '▶️';
});
</script>
</body>
</html>
