<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>手机网络电视</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            height: 100vh;
            overflow: hidden;
            position: fixed;
            width: 100%;
        }
        /* 视频播放器 */
        .video-box {
            width: 100%;
            height: 46vh;
            background: #000;
            position: relative;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }
        /* 频道列表 */
        .channel-container {
            height: 54vh;
            background: #121212;
            overflow-y: auto;
            padding: 8px;
        }
        .channel {
            background: #1f1f1f;
            padding: 14px 16px;
            margin-bottom: 8px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
        }
        .channel:active {
            background: #007aff;
        }
        .channel.active {
            background: #007aff;
        }
        .tip {
            text-align: center;
            padding: 12px;
            color: #888;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <div class="video-box">
        <video id="video" playsinline controls preload="none"></video>
    </div>
    <div class="channel-container" id="list"></div>

    <script>
        const video = document.getElementById('video');
        const list = document.getElementById('list');

        // 直播源（苹果手机专用加速）
        const URL = 'https://gh-proxy.org/https://github.com/bang359/dsj/raw/main/iphone.txt';

        let channels = [];

        // 加载频道
        fetch(URL)
            .then(res => res.text())
            .then(text => {
                const lines = text.split('\n').map(i => i.trim()).filter(Boolean);
                lines.forEach(line => {
                    if (line.includes(',')) {
                        const [name, url] = line.split(',', 2);
                        if (name && url && url.startsWith('http')) {
                            channels.push({ name, url });
                        }
                    }
                });
                renderList();
                // 自动播放第一个
                if (channels.length) play(0);
            })
            .catch(err => {
                list.innerHTML = '<div class="tip">加载失败，请检查网络</div>';
            });

        // 渲染频道
        function renderList() {
            list.innerHTML = '';
            channels.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'channel';
                div.textContent = item.name;
                div.onclick = () => play(index);
                list.appendChild(div);
            });
        }

        // 播放
        function play(index) {
            const { name, url } = channels[index];
            video.src = url;
            video.load();
            video.play().catch(e => {});

            // 高亮选中
            document.querySelectorAll('.channel').forEach((i, idx) => {
                i.classList.toggle('active', idx === index);
            });
        }
    </script>
</body>
</html>
