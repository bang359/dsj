<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>免费电视直播</title>
    <!-- 引入外部资源 -->
    <link href="https://cdn.jsdelivr.net/npm/video.js@8.10.0/dist/video-js.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/video.js@8.10.0/dist/video.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flv.js@1.6.2/dist/flv.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/videojs-flvjs@0.3.1/dist/videojs-flvjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', "Microsoft YaHei", Arial, sans-serif;
        }

        :root {
            --primary-color: #165DFF;
            --primary-light: #4080FF;
            --primary-dark: #0E42D2;
            --bg-color: #F5F7FA;
            --card-bg: #FFFFFF;
            --text-primary: #1D2129;
            --text-secondary: #4E5969;
            --text-tertiary: #86909C;
            --border-color: #E5E6EB;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.12);
            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
        }

        /* 顶部导航栏 */
        .header {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-light) 100%);
            color: white;
            box-shadow: var(--shadow-md);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            height: 64px;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            text-decoration: none;
            color: white;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        /* 时间日期插件 */
        .datetime-widget {
            text-align: right;
        }

        .time {
            font-size: 20px;
            font-weight: 600;
            line-height: 1.2;
        }

        .date {
            font-size: 12px;
            opacity: 0.9;
            margin-top: 2px;
        }

        /* 2345天气插件（已优化样式） */
        .weather-widget {
            background-color: rgba(255, 255, 255, 0.15);
            padding: 4px 8px;
            border-radius: var(--radius-md);
            backdrop-filter: blur(10px);
            overflow: hidden;
        }

        .weather-widget iframe {
            border: none;
            background: transparent;
            display: block;
        }

        /* 分类导航 */
        .category-nav {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
        }

        .nav-menu {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            list-style: none;
            padding: 0 20px;
            overflow-x: auto;
            white-space: nowrap;
        }

        .nav-item {
            padding: 14px 20px;
            cursor: pointer;
            transition: var(--transition);
            font-weight: 500;
            color: var(--text-secondary);
            border-bottom: 3px solid transparent;
        }

        .nav-item:hover {
            color: var(--primary-color);
        }

        .nav-item.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
        }

        /* 主内容区 */
        .main-container {
            max-width: 1400px;
            margin: 24px auto;
            display: flex;
            gap: 24px;
            padding: 0 20px;
        }

        /* 左侧频道列表 */
        .channel-sidebar {
            width: 260px;
            background-color: var(--card-bg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            height: calc(100vh - 160px);
            overflow-y: auto;
            position: sticky;
            top: 104px;
        }

        .channel-list-title {
            padding: 16px 20px;
            font-weight: 600;
            font-size: 16px;
            border-bottom: 1px solid var(--border-color);
            background-color: #FAFBFC;
            border-radius: var(--radius-lg) var(--radius-lg) 0 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .channel-item {
            padding: 12px 20px;
            cursor: pointer;
            transition: var(--transition);
            border-left: 4px solid transparent;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .channel-item:hover {
            background-color: #F2F3F5;
            border-left-color: var(--primary-light);
            color: var(--primary-color);
        }

        .channel-item.active {
            background-color: #E8F3FF;
            color: var(--primary-color);
            border-left-color: var(--primary-color);
            font-weight: 500;
        }

        .list-loading {
            padding: 60px 20px;
            text-align: center;
            color: var(--text-tertiary);
            font-size: 14px;
        }

        /* 右侧播放区域 */
        .player-section {
            flex: 1;
            background-color: var(--card-bg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            overflow: hidden;
        }

        .player-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .player-container {
            position: relative;
            background-color: #000000;
        }

        #live-player {
            width: 100%;
            aspect-ratio: 16/9;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 16px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .player-footer {
            padding: 20px;
            font-size: 14px;
            color: var(--text-tertiary);
            line-height: 1.8;
        }

        /* 底部 */
        .footer {
            text-align: center;
            padding: 24px;
            color: var(--text-tertiary);
            font-size: 12px;
            border-top: 1px solid var(--border-color);
            margin-top: 24px;
        }

        /* 滚动条美化 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #F1F2F3;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb {
            background: #C9CDD4;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #86909C;
        }

        /* 响应式适配 */
        @media (max-width: 992px) {
            .main-container {
                flex-direction: column;
            }

            .channel-sidebar {
                width: 100%;
                height: 220px;
                position: static;
            }

            .header-right {
                gap: 16px;
            }

            .weather-widget {
                display: none;
            }
        }

        @media (max-width: 576px) {
            .datetime-widget {
                display: none;
            }

            .logo {
                font-size: 20px;
            }

            .nav-item {
                padding: 12px 16px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <div class="header">
        <div class="nav-container">
            <a href="#" class="logo">📺 免费电视直播</a>
            
            <div class="header-right">
                <!-- 时间日期插件 -->
                <div class="datetime-widget">
                    <div class="time" id="current-time">00:00:00</div>
                    <div class="date" id="current-date">2026年01月01日 星期一</div>
                </div>
                
                <!-- 2345免费天气插件（自动IP定位） -->
                <div class="weather-widget">
                    <iframe 
                        allowtransparency="true" 
                        frameborder="0" 
                        width="180" 
                        height="36" 
                        scrolling="no" 
                        src="https://tianqi.2345.com/plugin/widget/index.htm?s=3&z=1&t=1&v=0&d=1&bd=0&k=&f=&ltf=ffffff&htf=ffffff&q=1&e=0&a=1&c=&w=180&h=36&align=right"
                    ></iframe>
                </div>
            </div>
        </div>
    </div>

    <!-- 分类导航 -->
    <div class="category-nav">
        <ul class="nav-menu" id="nav-menu">
            <li class="nav-item active" data-group="all">全部频道</li>
        </ul>
    </div>

    <!-- 主内容 -->
    <div class="main-container">
        <!-- 左侧频道列表 -->
        <div class="channel-sidebar">
            <div class="channel-list-title">📺 频道列表</div>
            <div id="channel-list">
                <div class="list-loading">正在加载频道列表...</div>
            </div>
        </div>

        <!-- 右侧播放区 -->
        <div class="player-section">
            <div class="player-header" id="current-channel">请选择左侧频道开始观看</div>
            <div class="player-container">
                <div class="loading" id="player-loading" style="display: none;">
                    <div class="loading-spinner"></div>
                    <div>正在加载直播...</div>
                </div>
                <video id="live-player" class="video-js vjs-big-play-centered" controls preload="auto">
                    您的浏览器不支持视频播放，请升级浏览器。
                </video>
            </div>
            <div class="player-footer">
                <p>✅ 支持m3u8、mp4、flv等所有主流格式及无后缀直播源</p>
                <p>🔄 频道列表自动同步自GitHub仓库，更新后刷新页面即可生效</p>
                <p>⚠️ 直播源可能会随时间失效，如无法播放请尝试其他频道</p>
            </div>
        </div>
    </div>

    <!-- 底部 -->
    <div class="footer">
        <p>© 2026 免费电视直播 - 仅供学习交流使用</p>
    </div>

    <script>
        // ==================== 实时时间日期插件 ====================
        function updateDateTime() {
            const now = new Date();
            
            // 格式化时间
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('current-time').textContent = `${hours}:${minutes}:${seconds}`;
            
            // 格式化日期
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const weekDays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            const weekDay = weekDays[now.getDay()];
            document.getElementById('current-date').textContent = `${year}年${month}月${day}日 ${weekDay}`;
        }

        // 立即更新一次，然后每秒更新
        updateDateTime();
        setInterval(updateDateTime, 1000);

        // ==================== 播放器初始化 ====================
        const player = videojs('live-player', {
            autoplay: false,
            fluid: true,
            preload: 'metadata',
            html5: {
                hls: {
                    overrideNative: true,
                    enableLowInitialPlaylist: true,
                    smoothQualityChange: true
                },
                flvjs: {
                    mediaDataSource: {
                        isLive: true,
                        cors: true,
                        withCredentials: false
                    }
                },
                nativeVideoTracks: false,
                nativeAudioTracks: false
            },
            controlBar: {
                volumePanel: {
                    inline: false
                }
            }
        });

        const playerLoading = document.getElementById('player-loading');
        const currentChannelEl = document.getElementById('current-channel');
        const channelListEl = document.getElementById('channel-list');
        const navMenuEl = document.getElementById('nav-menu');

        // 存储所有频道数据
        let allChannels = [];
        let allGroups = [];

        // ==================== 从GitHub加载直播源 ====================
        async function loadChannelsFromGitHub() {
            try {
                const response = await fetch('https://gh-proxy.org/https://github.com/bang359/dsj/raw/main/iphone.txt');
                const text = await response.text();
                
                channelListEl.innerHTML = '';
                
                const lines = text.split('\n').filter(line => line.trim() !== '');
                let currentGroupName = '其他频道';
                
                lines.forEach(line => {
                    if (line.trim().startsWith('#')) {
                        currentGroupName = line.trim().substring(1).trim();
                        if (!allGroups.includes(currentGroupName)) {
                            allGroups.push(currentGroupName);
                        }
                        return;
                    }
                    
                    const parts = line.split(',');
                    if (parts.length >= 2) {
                        const channelName = parts[0].trim();
                        const channelUrl = parts.slice(1).join(',').trim();
                        
                        if (channelName && channelUrl) {
                            allChannels.push({
                                name: channelName,
                                url: channelUrl,
                                group: currentGroupName
                            });
                        }
                    }
                });

                generateNavMenu();
                showChannelsByGroup('all');

            } catch (error) {
                console.error('加载频道列表失败:', error);
                channelListEl.innerHTML = '<div class="list-loading">频道列表加载失败，请刷新页面重试</div>';
            }
        }

        // 生成导航菜单
        function generateNavMenu() {
            navMenuEl.innerHTML = '<li class="nav-item active" data-group="all">全部频道</li>';
            
            allGroups.forEach(group => {
                const li = document.createElement('li');
                li.className = 'nav-item';
                li.textContent = group;
                li.setAttribute('data-group', group);
                li.addEventListener('click', function() {
                    document.querySelectorAll('.nav-item').forEach(item => {
                        item.classList.remove('active');
                    });
                    this.classList.add('active');
                    showChannelsByGroup(this.getAttribute('data-group'));
                });
                navMenuEl.appendChild(li);
            });
        }

        // 按分组显示频道
        function showChannelsByGroup(group) {
            channelListEl.innerHTML = '';
            
            let filteredChannels = allChannels;
            if (group !== 'all') {
                filteredChannels = allChannels.filter(channel => channel.group === group);
            }
            
            filteredChannels.forEach(channel => {
                const item = document.createElement('div');
                item.className = 'channel-item';
                item.textContent = channel.name;
                item.setAttribute('data-url', channel.url);
                item.setAttribute('data-name', channel.name);
                
                item.addEventListener('click', function() {
                    playChannel(this);
                });
                
                channelListEl.appendChild(item);
            });

            if (filteredChannels.length === 0) {
                channelListEl.innerHTML = '<div class="list-loading">该分组暂无频道</div>';
            }
        }

        // 播放指定频道（支持无后缀直播源）
        function playChannel(channelItem) {
            document.querySelectorAll('.channel-item').forEach(i => i.classList.remove('active'));
            channelItem.classList.add('active');

            const channelName = channelItem.getAttribute('data-name');
            const channelUrl = channelItem.getAttribute('data-url');

            currentChannelEl.textContent = `当前播放: ${channelName}`;
            playerLoading.style.display = 'flex';

            player.pause();
            player.reset();

            const tryTypes = [
                'application/x-mpegURL',
                'video/x-flv',
                'video/mp4',
                'application/octet-stream'
            ];

            function tryPlay(typeIndex) {
                if (typeIndex >= tryTypes.length) {
                    playerLoading.style.display = 'none';
                    alert('该频道格式不支持或源已失效，请尝试其他频道');
                    return;
                }

                const currentType = tryTypes[typeIndex];
                console.log(`尝试播放 ${channelName}，格式: ${currentType}`);

                player.src({
                    src: channelUrl,
                    type: currentType
                });

                player.play().then(() => {
                    playerLoading.style.display = 'none';
                    console.log(`播放成功！使用格式: ${currentType}`);
                }).catch(err => {
                    console.error(`格式${currentType}播放失败:`, err.message);
                    tryPlay(typeIndex + 1);
                });
            }

            tryPlay(0);
        }

        // 播放错误处理
        player.on('error', function() {
            playerLoading.style.display = 'none';
            const error = player.error();
            console.error('播放器错误:', error);
            alert(`播放出错: ${error.message}\n请尝试其他频道`);
        });

        // 页面加载完成后加载频道列表
        window.addEventListener('load', loadChannelsFromGitHub);
    </script>
</body>
</html>
