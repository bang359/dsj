<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="网络电视">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>网络电视</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:-apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
        -webkit-tap-highlight-color: transparent;
    }
    html,body{
        height:100%;
        background:#000;
        color:#fff;
        overflow:hidden;
    }
    .container{
        display:flex;
        flex-direction:column;
        height:100vh;
    }
    /* 视频播放区域 */
    .video-box{
        width:100%;
        height:42vh;
        background:#000;
        position:relative;
    }
    video{
        width:100%;
        height:100%;
        object-fit:contain;
        background:#000;
    }
    .loading{
        position:absolute;
        top:50%;
        left:50%;
        transform:translate(-50%,-50%);
        color:#007aff;
        font-size:18px;
    }
    /* 频道列表区域 */
    .channel-box{
        flex:1;
        background:#121212;
        padding:10px;
        overflow-y:auto;
    }
    .channel-item{
        width:100%;
        padding:18px 16px;
        background:#1e1e1e;
        border:none;
        border-radius:14px;
        color:#fff;
        font-size:16px;
        text-align:left;
        margin-bottom:10px;
        cursor:pointer;
        transition:0.2s;
    }
    .channel-item:active{
        background:#0066cc;
        transform:scale(0.98);
    }
    .channel-item.active{
        background:#007aff;
        font-weight:500;
    }
    /* 滚动条隐藏 */
    ::-webkit-scrollbar{
        width:0;
    }
</style>
</head>
<body>

<div class="container">
    <div class="video-box">
        <video id="video" playsinline webkit-playsinline></video>
        <div class="loading" id="loading">加载中...</div>
    </div>
    <div class="channel-box" id="channelList"></div>
</div>

<script>
const video = document.getElementById('video');
const loading = document.getElementById('loading');
const channelList = document.getElementById('channelList');
let hls = null;
let currentActive = null;

// 你指定的官方源，不做任何修改
const sourceURL = "https://gh-proxy.org/https://github.com/bang359/dsj/raw/main/iphone.txt";

// 加载状态
function showLoading(){ loading.style.display = 'block'; }
function hideLoading(){ loading.style.display = 'none'; }

// 播放函数（自动播放）
function playVideo(url, btn) {
    showLoading();
    
    // 销毁之前的播放
    if(hls) hls.destroy();
    
    // 高亮当前频道
    if(currentActive) currentActive.classList.remove('active');
    btn.classList.add('active');
    currentActive = btn;

    // 播放逻辑
    if(Hls.isSupported() && url.includes('.m3u8')){
        hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
            video.play().catch(() => {}).finally(hideLoading);
        });
        hls.on(Hls.Events.ERROR, () => hideLoading());
    }else{
        video.src = url;
        video.play().catch(() => {}).finally(hideLoading);
    }
}

// 加载频道列表
fetch(sourceURL)
.then(res => res.text())
.then(text => {
    let firstUrl = '';
    let firstBtn = null;

    text.split('\n').forEach(line => {
        if(line.includes(',')){
            const [name, url] = line.split(',', 2);
            if(name && url && url.startsWith('http')){
                const btn = document.createElement('button');
                btn.className = 'channel-item';
                btn.innerText = name.trim();
                btn.onclick = () => playVideo(url.trim(), btn);
                channelList.appendChild(btn);

                if(!firstUrl){
                    firstUrl = url.trim();
                    firstBtn = btn;
                }
            }
        }
    });

    // 自动播放第一个频道
    if(firstUrl) playVideo(firstUrl, firstBtn);
})
.catch(err => {
    channelList.innerHTML = '<div class="channel-item">直播源加载失败，请刷新重试</div>';
    hideLoading();
});
<!-- ====================== 留言板功能 ====================== -->
<div style="background:#111; padding:25px; margin-top:30px; border-radius:15px; text-align:center; color:white;">
  <h3>💝 赞赏支持</h3>
  <img src="https://github.com/bang359/dsj/raw/main/wx.png" style="width:160px; height:160px; border-radius:10px; margin:10px 0;">
  <div style="color:#ccc; margin-bottom:20px;">您的支持是持续更新的动力 🥰</div>

  <div style="max-width:500px; margin:0 auto; text-align:left;">
    <input type="text" id="name" placeholder="输入昵称" style="width:100%; padding:10px; border-radius:8px; border:none; background:#222; color:white; margin-bottom:10px; outline:none;"><br>
    <textarea id="content" rows="3" placeholder="说点什么..." style="width:100%; padding:10px; border-radius:8px; border:none; background:#222; color:white; margin-bottom:10px; outline:none;"></textarea><br>
    <button onclick="sendMsg()" style="width:100%; padding:10px; border-radius:30px; border:none; background:#ff6b6b; color:white; font-weight:bold;">发送留言</button>

    <div id="msgList" style="margin-top:20px; max-height:300px; overflow-y:auto;"></div>
  </div>
</div>
<script>
// 发送留言
function sendMsg(){
  let n = document.getElementById("name").value.trim();
  let c = document.getElementById("content").value.trim();
  if(!n||!c){alert("请填写昵称和留言");return;}
  
  let msgs = JSON.parse(localStorage.getItem("msgs"))||[];
  msgs.unshift({name:n, content:c, time:new Date().toLocaleString()});
  localStorage.setItem("msgs",JSON.stringify(msgs));
  
  document.getElementById("name").value="";
  document.getElementById("content").value="";
  showMsg();
}

// 显示留言
function showMsg(){
  let msgs = JSON.parse(localStorage.getItem("msgs"))||[];
  let html = "";
  msgs.forEach(m=>{
    html+=`
    <div style="background:#222; padding:10px; border-radius:8px; margin-bottom:8px;">
      <div style="color:#ffdf00; font-weight:bold;">${m.name}</div>
      <div style="color:white; margin:5px 0;">${m.content}</div>
      <div style="color:#888; font-size:12px; text-align:right;">${m.time}</div>
    </div>`;
  });
  document.getElementById("msgList").innerHTML = html || '<div style="color:#777; text-align:center;">暂无留言</div>';
}

// 页面加载显示
window.onload = showMsg;
</script>
<!-- ====================== 留言板结束 ====================== -->
</body>
</html>
