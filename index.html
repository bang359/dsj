<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>高清电视直播</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/dplayer/dist/DPlayer.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
html,body{height:100%;overflow:hidden;background:#000;color:#fff}
.main{display:flex;height:100%}

.sidebar{width:180px;background:#111;padding:10px;overflow-y:auto;border-right:1px solid #333}
.channel{padding:9px;background:#222;border-radius:4px;margin:4px 0;cursor:pointer;font-size:14px}
.channel.active{background:#007aff;color:#fff}

.player{flex:1;position:relative}
#dplayer{width:100%;height:100%}
.tip{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:16px}
</style>
</head>

<body>
<div class="main">
  <div class="sidebar" id="channelList">加载中...</div>
  <div class="player">
    <div id="dplayer"></div>
    <div class="tip" id="tip">点击播放</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js/dist/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flv.js/dist/flv.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dplayer/dist/DPlayer.min.js"></script>

<script>
const sourceUrl = "https://gh-proxy.org/https://github.com/bang359/dsj/blob/main/iphone.txt";

const tip = document.getElementById('tip');
let dp = null;
let channels = [];

async function loadChannels() {
  try {
    let res = await fetch(sourceUrl);
    let txt = await res.text();
    channels = txt.split('\n')
      .filter(line => line.trim() && line.includes(','))
      .map(line => {
        let [name, url] = line.split(',');
        return { name: name.trim(), url: url.trim() };
      });
    renderChannels();
  } catch (e) {
    channelList.innerHTML = '<div style="color:red">加载失败</div>';
  }
}

// 普通无分组列表
function renderChannels() {
  let html = '';
  channels.forEach((ch, i) => {
    html += `<div class="channel" data-i="${i}">${ch.name}</div>`;
  });
  channelList.innerHTML = html;

  document.querySelectorAll('.channel').forEach(el => {
    el.onclick = () => play(+el.dataset.i);
  });

  if (channels.length) play(0);
}

function play(index) {
  document.querySelectorAll('.channel').forEach(c => c.classList.remove('active'));
  document.querySelectorAll('.channel')[index].classList.add('active');

  tip.style.display = 'block';
  let url = channels[index].url;

  if (dp) dp.destroy();
  dp = new DPlayer({
    container: document.getElementById('dplayer'),
    autoplay: false,
    volume: 1.0,
    video: { url }
  });

  dp.on('canplay', () => { tip.style.display = 'none'; });
  dp.on('error', () => { tip.textContent = '播放失败'; });
}

document.addEventListener('click', () => {
  if (dp && dp.video.paused) dp.play();
  tip.style.display = 'none';
}, { once: true });

loadChannels();
</script>
</body>
</html>
