<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>快播直播</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.1/dist/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flv.js@1.6.2/dist/flv.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dplayer@1.27.1/dist/DPlayer.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/dplayer@1.27.1/dist/DPlayer.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;color:#ccc;font-family:Microsoft YaHei,sans-serif}
.main{display:flex;height:100vh}

.player-box{flex:1;background:#000;position:relative}
#dplayer{width:100%;height:100%}

.dplayer-mask,
.dplayer-icons,
.dplayer-loading,
.dplayer-play-icon,
.dplayer-pause-icon{
  display:none !important;
  opacity:0 !important;
  visibility:hidden !important
}

.channel-box{width:270px;background:#1a1a1a;display:flex;flex-direction:column;border-left:1px solid #333}
.top-bar{height:34px;background:#262626;display:flex;align-items:center;gap:12px;padding:0 12px;font-size:12px;color:#fff}
.donate a{color:#ff6c00;text-decoration:none;font-weight:bold}

.channel-list{flex:1;overflow-y:auto;padding:6px}
.channel{padding:10px 12px;margin:3px 0;background:#222;border-radius:3px;cursor:pointer}
.channel:hover{background:#333}
.channel.active{background:#ff6c00;color:#fff}
.genre{padding:8px;background:#111;color:#999;font-size:12px}

@media(max-width:768px){
  .main{flex-direction:column}
  .player-box{height:44vh}
  .channel-box{height:56vh;width:100%}
}

.channel-list::-webkit-scrollbar{width:5px}
.channel-list::-webkit-scrollbar-thumb{background:#444;border-radius:4px}
</style>
</head>

<body>
<div class="main">
  <div class="player-box">
    <div id="dplayer"></div>
  </div>

  <div class="channel-box">
    <div class="top-bar">
      <div>快播直播</div>
      <div class="donate"><a href="https://gh-proxy.org/https://raw.githubusercontent.com/bang359/dsj/main/wx.png" target="_blank">打赏支持</a></div>
    </div>
    <div class="channel-list" id="list"></div>
  </div>
</div>

<script>
const dp = new DPlayer({
  container: document.getElementById('dplayer'),
  autoplay: true,
  theme: '#ff6c00',
  lang: 'zh-cn',
  volume: 0.5,
  video: { url: '' },
  notice: false,
  mask: false,
  logo: false
});

const list = document.getElementById('list');

// ==============================================
// 极速换台核心（秒切加速）
// ==============================================
function play(url) {
  try {
    // 立即销毁之前的播放 → 提速关键
    if (dp.video) {
      dp.pause();
      dp.video.src = "";
      dp.video.load();
    }

    let type = 'normal';
    if (url.includes('.m3u8')) type = 'hls';
    if (url.includes('.flv')) type = 'flv';

    // 电脑端代理
    if (!/Mobile|Android|iPhone|iPad/.test(navigator.userAgent) && window.location.protocol === 'https:') {
      url = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
    }

    // 极速切换
    dp.switchVideo({ url, type });
    dp.play();
  } catch (e) {}
}

// 加载源
fetch("https://raw.githubusercontent.com/bang359/dsj/main/iphone.txt")
.then(r=>r.text())
.then(txt=>{
  txt.split('\n').forEach(line=>{
    line = line.trim();
    if(!line) return;

    if(line.includes(',#genre#')){
      let div = document.createElement('div');
      div.className='genre';
      div.textContent = line.split(',')[0];
      list.appendChild(div);
      return;
    }

    let arr = line.split(',');
    if(arr.length>=2 && arr[1].startsWith('http')){
      let item = document.createElement('div');
      item.className='channel';
      item.textContent=arr[0];
      item.onclick=()=>{
        play(arr[1]);
        document.querySelectorAll('.channel').forEach(i=>i.classList.remove('active'));
        item.classList.add('active');
      };
      list.appendChild(item);
    }
  });

  setTimeout(()=>{
    const first = document.querySelector('.channel');
    if(first) first.click();
  }, 400);
});
</script>
</body>
</html>
