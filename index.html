<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>超清网络电视 - PC版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            background: #1a1a1a;
            color: #fff;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }
        /* 左侧播放区域 */
        .player-section {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .video-wrapper {
            flex: 1;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            position: relative;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }
        .info-bar {
            padding: 12px 16px;
            background: #252525;
            border-radius: 8px;
            font-size: 15px;
            color: #ccc;
        }
        /* 右侧频道列表 */
        .channel-section {
            width: 320px;
            background: #141414;
            border-left: 1px solid #333;
            display: flex;
            flex-direction: column;
        }
        .channel-header {
            padding: 18px 16px;
            background: #1f1f1f;
            font-size: 18px;
            font-weight: bold;
            border-bottom: 1px solid #333;
        }
        .channel-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        .channel-item {
            padding: 14px 16px;
            margin-bottom: 8px;
            background: #262626;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 15px;
        }
        .channel-item:hover {
            background: #0066cc;
            transform: translateX(3px);
        }
        .channel-item.active {
            background: #0056b3;
            font-weight: 500;
        }
        /* 滚动条美化 */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #111;
        }
    </style>
</head>
<body>

<!-- 左侧播放 -->
<div class="player-section">
    <div class="video-wrapper">
        <video id="video" controls autoplay></video>
    </div>
    <div class="info-bar" id="status">正在加载频道列表...</div>
</div>

<!-- 右侧频道 -->
<div class="channel-section">
    <div class="channel-header">📺 频道列表</div>
    <div class="channel-list" id="channelList"></div>
</div>

<script>
const video = document.getElementById('video');
const channelList = document.getElementById('channelList');
const status = document.getElementById('status');

// 直播源地址
const sourceUrl = 'https://gh-proxy.org/https://github.com/bang359/dsj/raw/main/iphone.txt';

let channels = [];
let currentUrl = '';

// 加载频道
fetch(sourceUrl)
    .then(res => res.text())
    .then(text => {
        const lines = text.split('\n').map(i => i.trim()).filter(Boolean);
        lines.forEach(line => {
            if (line.includes(',')) {
                const [name, url] = line.split(',', 2);
                if (name && url && url.startsWith('http')) {
                    channels.push({ name: name.trim(), url: url.trim() });
                }
            }
        });
        
        renderChannels();
        status.textContent = `加载完成：共 ${channels.length} 个频道`;
        
        // 自动播放第一个
        if (channels.length) {
            playChannel(0);
        }
    })
    .catch(err => {
        status.textContent = '❌ 频道加载失败，请检查网络';
        console.error(err);
    });

// 渲染频道
function renderChannels() {
    channelList.innerHTML = '';
    channels.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'channel-item';
        div.textContent = item.name;
        div.onclick = () => playChannel(index);
        channelList.appendChild(div);
    });
}

// 播放频道
function playChannel(index) {
    const { name, url } = channels[index];
    currentUrl = url;
    
    video.src = url;
    video.load();
    video.play().catch(() => {
        status.textContent = `▶️ 已切换：${name}（点击视频播放）`;
    });
    
    status.textContent = `▶️ 正在播放：${name}`;
    
    // 高亮选中
    document.querySelectorAll('.channel-item').forEach((item, i) => {
        item.classList.toggle('active', i === index);
    });
}
</script>
</body>
</html>
