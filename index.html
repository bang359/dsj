
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>网络电视 - 快播经典版</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.0"></script>
<script src="https://cdn.jsdelivr.net/npm/dashjs@4.7.0/dist/dash.all.min.js"></script>
<style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei","PingFang SC",sans-serif}
    html,body{height:100%;background:#0d0d0d;color:#fff;overflow:hidden;touch-action:manipulation}
    .container{display:flex;height:100vh;flex-direction:row}
    .main-area{flex:1;display:flex;flex-direction:column;background:#1a1a1a}
    .video-box{flex:1;background:#000;position:relative;display:flex;align-items:center;justify-content:center}
    video{width:100%;height:100%;object-fit:contain;background:#000;touch-action:none}
    .loading{position:absolute;color:#00cc66;font-size:16px;display:none;text-align:center;padding:10px;z-index:10;background:rgba(0,0,0,0.7);border-radius:8px;max-width:90%}
    .loading.show{display:block}
    .error-msg{color:#ff6b6b;font-size:12px;margin-top:5px}
    .toolbar{height:50px;background:linear-gradient(180deg,#2d2d2d,#1a1a1a);border-top:2px solid #00cc66;display:flex;align-items:center;padding:0 15px;gap:15px}
    .toolbar-title{flex:1;text-align:center;color:#00cc66;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .channel-box{width:320px;background:#0d0d0d;border-left:3px solid #00cc66;display:flex;flex-direction:column}
    .channel-list{flex:1;overflow-y:auto;padding:10px}
    .channel-item{width:100%;padding:12px 15px;background:#1a1a1a;border:1px solid #333;border-radius:4px;color:#00cc66;font-size:14px;text-align:left;margin-bottom:8px;cursor:pointer;transition:all .2s}
    .channel-item:hover{background:#2d2d2d;border-color:#00cc66}
    .channel-item.active{background:#00cc66;border-color:#00cc66;color:#fff}
    ::-webkit-scrollbar{width:8px}
    ::-webkit-scrollbar-track{background:#0d0d0d}
    ::-webkit-scrollbar-thumb{background:#00cc66;border-radius:4px}
    .online-info{background:rgba(0,0,0,.5);padding:4px 10px;border-radius:10px;font-size:12px;display:flex;align-items:center;gap:5px}
    .weather-bar{background:linear-gradient(180deg,#1a1a1a,#0d0d0d);border-top:1px solid #333;padding:8px 15px;display:flex;align-items:center;justify-content:space-between}
    .weather-info{color:#00cc66;font-size:13px;display:flex;align-items:center;gap:8px}
    .reward-mini{background:linear-gradient(180deg,#cc3333,#aa2222);border:1px solid #dd4444;color:#fff;padding:4px 12px;border-radius:4px;font-size:12px;cursor:pointer}
    @media(max-width:768px){
        .container{flex-direction:column}
        .main-area{height:auto;flex:none}
        .video-box{width:100%;height:40vh;min-height:180px;flex:none}
        .channel-box{position:relative;width:100%;height:calc(100vh - 40vh - 50px - 36px);border-left:none;border-top:3px solid #00cc66;flex:1}
        .channel-list{padding:8px}
        .channel-item{padding:12px 14px;font-size:14px;margin-bottom:6px}
        .toolbar-title{font-size:11px}
        .weather-bar{padding:5px 10px}
        .weather-info{font-size:11px}
        .online-info,.reward-mini{font-size:11px;padding:3px 8px}
    }
</style>
</head>
<body>
<div class="container">
    <div class="main-area">
        <div class="video-box">
            <video id="video" playsinline webkit-playsinline crossorigin="anonymous"></video>
            <div class="loading" id="loading">
                <div id="loadingText">加载中...</div>
                <div class="error-msg" id="errorMsg"></div>
            </div>
        </div>
        <div class="toolbar">
            <div class="online-info"><span>👁</span><span id="onlineNumber">0</span><span>人在线</span></div>
            <div class="toolbar-title" id="currentChannel">选择频道观看</div>
            <button class="reward-mini" id="rewardBtn">❤️ 打赏</button>
        </div>
        <div class="weather-bar">
            <div class="weather-info"><span>🌤️</span><span id="weatherText">天气加载中...</span></div>
        </div>
    </div>
    <div class="channel-box" id="channelBox">
        <div class="channel-list" id="channelList"></div>
    </div>
</div>
<div class="reward-modal" id="rewardModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);z-index:2000;justify-content:center;align-items:center;">
    <div style="background:#1a1a1a;border:2px solid #00cc66;border-radius:12px;padding:24px;max-width:320px;width:90%">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
            <h3 style="color:#00cc66;font-size:18px">❤️ 支持一下</h3>
            <button id="rewardClose" style="background:none;border:none;color:#00cc66;font-size:28px;cursor:pointer">×</button>
        </div>
        <div style="text-align:center">
            <img src="https://gh-proxy.org/https://raw.githubusercontent.com/bang359/dsj/main/wx.png" alt="打赏二维码" style="width:200px;height:200px;border-radius:8px;margin-bottom:12px">
            <p style="color:#00cc66;font-size:14px">微信扫一扫打赏</p>
        </div>
    </div>
</div>
<script>
const video=document.getElementById('video');
const loading=document.getElementById('loading');
const loadingText=document.getElementById('loadingText');
const errorMsg=document.getElementById('errorMsg');
const channelList=document.getElementById('channelList');
const onlineNumber=document.getElementById('onlineNumber');
const currentChannel=document.getElementById('currentChannel');
let hls=null;
let dashPlayer=null;
let currentActive=null;
let channelArray=[];
let currentIndex=-1;
const channelUrl='https://raw.githubusercontent.com/bang359/dsj/main/iphone.txt';
const corsProxies=[
    u=>`https://corsproxy.io/?${encodeURIComponent(u)}`,
    u=>`https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
    u=>`https://proxy.cors.sh/${u}`,
    u=>`https://yacdn.org/proxy/${u}`
];
let proxyIdx=0;
function getProxy(u){return corsProxies[proxyIdx%corsProxies.length](u);}
function nextProxy(){proxyIdx++;console.log('切换代理:',proxyIdx%corsProxies.length);}
function showLoading(msg){loading.classList.add('show');loadingText.textContent=msg||'加载中...';errorMsg.textContent='';}
function showError(msg){errorMsg.textContent=msg;}
function hideLoading(){loading.classList.remove('show');}
function cleanup(){if(hls){hls.destroy();hls=null;}if(dashPlayer){dashPlayer.reset();dashPlayer=null;}video.pause();video.src='';video.load();}
function fixUrl(url){if(!url||typeof url!=='string')return'';url=url.trim();if(url.includes('github.com')&&!url.includes('raw.githubusercontent.com')){return url.replace('github.com','raw.githubusercontent.com').replace('/blob/','/');}return url;}
function detectFormat(url){const u=url.toLowerCase();if(u.includes('.m3u8')||u.includes('m3u8'))return'hls';if(u.includes('.mpd')||u.includes('mpd'))return'dash';if(u.includes('.flv')||u.includes('flv'))return'flv';if(u.startsWith('rtmp://'))return'rtmp';if(u.includes('.ts')&&!u.includes('m3u8'))return'ts';if(/\.(mp4|mov|m4v)$/i.test(u))return'mp4';if(/\.(webm|ogg|ogv)$/i.test(u))return'webm';return'other';}
function playHLS(url,useProxy){
    const playUrl=useProxy?getProxy(url):url;
    console.log('HLS播放:',useProxy?'代理':'直连',playUrl);
    if(typeof Hls==='undefined'){showError('HLS.js未加载');return false;}
    if(!Hls.isSupported()){
        if(video.canPlayType('application/vnd.apple.mpegurl')){video.src=playUrl;video.muted=false;video.play().catch(()=>{});return true;}
        return false;
    }
    if(hls){hls.destroy();}
    hls=new Hls({enableWorker:true,backBufferLength:60,maxBufferLength:60,startLevel:-1,maxLoadingRetryDelay:10000,manifestLoadingTimeOut:30000,manifestLoadingMaxRetry:4,levelLoadingTimeOut:30000,levelLoadingMaxRetry:4});
    hls.loadSource(playUrl);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED,(e,data)=>{console.log('HLS清单解析完成,等级:',data.levels.length);video.muted=false;video.play().catch(()=>{});});
    hls.on(Hls.Events.LEVEL_SWITCHED,(e,data)=>{console.log('切换到等级:',data.level);});
    hls.on(Hls.Events.ERROR,(e,data)=>{console.error('HLS错误:',data.type,data.details);if(data.fatal){hideLoading();switch(data.type){case'networkError':if(useProxy){nextProxy();playHLS(url,true);}else{playHLS(url,true);}break;case'manifestLoadError':case'tokenError':if(useProxy){nextProxy();playHLS(url,true);}else{playHLS(url,true);}break;default:if(proxyIdx<corsProxies.length*3){nextProxy();playHLS(url,true);}else{showError('播放失败，请尝试其他频道');hls=null;}}}});
    return true;
}
function playDASH(url,useProxy){
    const playUrl=useProxy?getProxy(url):url;
    console.log('DASH播放:',useProxy?'代理':'直连',playUrl);
    if(typeof dashjs==='undefined'){showError('DASH.js未加载');return false;}
    try{if(dashPlayer){dashPlayer.reset();}
    dashPlayer=dashjs.MediaPlayer().create();dashPlayer.initialize(video,playUrl,true);
    dashPlayer.on('streamInitialized',()=>{video.muted=false;video.play().catch(()=>{});});
    dashPlayer.on('error',()=>{hideLoading();if(useProxy&&proxyIdx<corsProxies.length*3){nextProxy();playDASH(url,true);}else{showError('DASH播放失败');}});
    return true;}catch(e){console.error('DASH错误:',e);return false;}
}
function play(url){
    if(!url||url.trim()===''||url==='null'||url==='undefined'){showError('无效的播放地址');return;}
    const format=detectFormat(url);
    const finalUrl=fixUrl(url);
    console.log('播放:',finalUrl,'格式:',format);
    showLoading('正在加载...');
    if(format==='hls'){
        if(playHLS(finalUrl,false))return;
        if(playHLS(finalUrl,true))return;
    }
    if(format==='dash'){
        if(playDASH(finalUrl,false))return;
        if(playDASH(finalUrl,true))return;
    }
    if(format==='mp4'||format==='webm'){
        video.src=finalUrl;video.muted=false;
        video.oncanplay=()=>{hideLoading();video.oncanplay=null;};
        video.onerror=()=>{hideLoading();showError('视频播放失败');video.onerror=null;};
        video.play().catch(()=>{});
        return;
    }
    video.src=finalUrl;video.muted=false;
    video.oncanplay=()=>{hideLoading();video.oncanplay=null;};
    video.onerror=()=>{hideLoading();showError('播放失败');video.onerror=null;};
    video.play().catch(()=>{});
}
function playByIndex(idx){
    if(idx<0||idx>=channelArray.length)return;
    const item=channelArray[idx];
    cleanup();
    if(currentActive)currentActive.classList.remove('active');
    currentActive=channelList.children[idx];
    if(currentActive)currentActive.classList.add('active');
    currentIndex=idx;
    currentChannel.textContent=item.name;
    video.volume=0.5;video.muted=false;
    play(item.url);
}
video.onplaying=()=>{hideLoading();};
video.onpause=()=>{};
video.onwaiting=()=>{showLoading('缓冲中...');};
video.oncanplay=()=>{hideLoading();};
video.onerror=(e)=>{console.error('视频错误:',e);hideLoading();showError('播放错误');};
async function loadChannels(){
    channelList.innerHTML='<div style="color:#00cc66;text-align:center;padding:20px">加载频道中...</div>';
    try{
        const resp=await fetch(channelUrl);
        if(!resp.ok)throw new Error('网络错误 '+resp.status);
        const text=await resp.text();
        const lines=text.split('\n');
        channelList.innerHTML='';
        channelArray=[];
        lines.forEach(line=>{
            line=line.trim();
            if(!line||line.startsWith('#'))return;
            const idx=line.indexOf(',');
            if(idx>0){
                const name=line.substring(0,idx).trim();
                const url=line.substring(idx+1).trim();
                if(name&&url&&(url.startsWith('http')||url.startsWith('//'))){
                    channelArray.push({name,url});
                    const btn=document.createElement('button');
                    btn.className='channel-item';
                    btn.textContent=name;
                    btn.onclick=()=>playByIndex(channelArray.length-1);
                    channelList.appendChild(btn);
                }
            }
        });
        console.log('加载了',channelArray.length,'个频道');
        if(channelArray.length>0){setTimeout(()=>playByIndex(0),500);}
    }catch(e){
        console.error('加载失败:',e);
        channelList.innerHTML='<div style="color:#ff6b6b;text-align:center;padding:20px">频道加载失败<br><button onclick="loadChannels()" style="margin-top:10px;padding:8px 16px;background:#00cc66;color:#fff;border:none;border-radius:4px;cursor:pointer">重试</button><br><br>'+e.message+'</div>';
    }
}
function initViewerCount(){const base=Math.floor(Math.random()*500)+200;onlineNumber.textContent=base;setInterval(()=>{onlineNumber.textContent=Math.max(100,base+Math.floor(Math.random()*50));},5000);}
function updateWeather(){const fb=(city)=>{const c=['晴','多云','阴','小雨','阵雨'],i=['☀️','⛅','☁️','🌧️','🌦️'],t=Math.floor(Math.random()*15)+15,n=Math.floor(Math.random()*c.length);return`${city} ${i[n]} ${t}°C ${c[n]}`;};const display=(t)=>document.getElementById('weatherText').textContent=t;try{fetch('https://ip-api.com/json/').then(r=>r.json()).then(i=>{if(i.status==='success'){const city=i.city;fetch(`https://api.xcssapi.com/weather/current?location=${city}`).then(r=>r.json()).then(d=>{if(d.code==='200'&&d.data){const dd=d.data;display(`${city} ${dd.weather_icon} ${dd.temp}°C ${dd.weather}`);}else{display(fb(city));}}).catch(()=>display(fb(city)));}else{display(fb('未知城市'));}}).catch(()=>display(fb('未知城市')));}catch(e){display(fb('未知城市'));}}
document.getElementById('rewardBtn').onclick=()=>{document.getElementById('rewardModal').style.display='flex';};
document.getElementById('rewardClose').onclick=()=>{document.getElementById('rewardModal').style.display='none';};
document.getElementById('rewardModal').onclick=(e)=>{if(e.target===document.getElementById('rewardModal'))document.getElementById('rewardModal').style.display='none';};
loadChannels();
initViewerCount();
updateWeather();
setInterval(updateWeather,300000);
</script>
</body>
</html>
