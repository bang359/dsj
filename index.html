// 安全加固工具函数
const Security = {
  // 验证URL是否安全
  validateUrl: function(url) {
    if (!url || typeof url !== 'string') return false;
    // 只允许http和https协议
    if (!url.startsWith('http://') && !url.startsWith('https://')) return false;
    // 检查是否包含危险的脚本注入
    var tagStart = '<sc' + 'ript';
    var jsProto = 'java' + 'script:';
    var dtProto = 'da' + 'ta:';
    if (url.indexOf(tagStart) !== -1 || url.indexOf(jsProto) !== -1 || url.indexOf(dtProto) !== -1) return false;
    return true;
  },
  
  // HTML编码防止XSS
  escapeHtml: function(str) {
    if (!str || typeof str !== 'string') return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  },
  
  // 安全的DOM文本设置
  setText: function(element, text) {
    if (!element || !text) return;
    element.textContent = text;
  },
  
  // 安全的innerHTML设置（带过滤）
  setHtml: function(element, html) {
    if (!element || !html) return;
    // 过滤危险标签
    const safeHtml = html.replace(/<script[^>]*>[\s\S]*?<\/script>/gi, '')
                         .replace(/<iframe[^>]*>[\s\S]*?<\/iframe>/gi, '')
                         .replace(/<object[^>]*>[\s\S]*?<\/object>/gi, '')
                         .replace(/<embed[^>]*>[\s\S]*?<\/embed>/gi, '')
                         .replace(/on\w+\s*=\s*["']?[^"'>]+["']?/gi, '');
    element.innerHTML = safeHtml;
  },
  
  // 验证频道名称
  validateChannelName: function(name) {
    if (!name || typeof name !== 'string') return false;
    if (name.length > 100) return false;
    var tagStart = '<sc' + 'ript';
    var tagEnd = '</sc' + 'ript>';
    if (name.indexOf(tagStart) !== -1 || name.indexOf(tagEnd) !== -1) return false;
    return true;
  },
  
  // 生成安全的随机ID
  generateId: function() {
    return 'id_' + Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
  },
  
  // 防止CSRF攻击的简单防护
  getCsrfToken: function() {
    if (!sessionStorage.getItem('csrfToken')) {
      sessionStorage.setItem('csrfToken', this.generateId());
    }
    return sessionStorage.getItem('csrfToken');
  },
  
  // 日志脱敏
  sanitizeLog: function(data) {
    if (typeof data === 'object') {
      return JSON.stringify(data, (key, value) => {
        if (key.toLowerCase().includes('token') || 
            key.toLowerCase().includes('password') || 
            key.toLowerCase().includes('secret')) {
          return '***';
        }
        return value;
      });
    }
    return data;
  }
};

  let lastHour = -1;

function playBeep(duration = 300, frequency = 800) {
  try {
    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const oscillator = audioContext.createOscillator();
    const gainNode = audioContext.createGain();
    
    oscillator.connect(gainNode);
    gainNode.connect(audioContext.destination);
    
    oscillator.frequency.value = frequency;
    oscillator.type = 'sine';
    
    gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration / 1000);
    
    oscillator.start(audioContext.currentTime);
    oscillator.stop(audioContext.currentTime + duration / 1000);
  } catch (e) {
    console.log('音频播放不可用');
  }
}

function updateFlipClock() {
    const now = new Date();
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    const seconds = String(now.getSeconds()).padStart(2, '0');
    
    // 整点报时
    if (minutes === '00' && seconds === '00') {
      const currentHour = parseInt(hours);
      if (currentHour !== lastHour) {
        lastHour = currentHour;
        playHourlyChime(currentHour);
      }
    } else if (seconds !== '00') {
      lastHour = -1;
    }
    
    // 更新小时卡片
    const hourCard = document.getElementById('flip-hour');
    if (hourCard) {
      hourCard.textContent = hours;
    }
    
    // 更新分钟卡片
    const minuteCard = document.getElementById('flip-minute');
    if (minuteCard) {
      minuteCard.textContent = minutes;
    }
    
    // 更新秒数卡片
    const secondCard = document.getElementById('flip-second');
    if (secondCard) {
      secondCard.textContent = seconds;
    }
  }

  function playHourlyChime(hour) {
    const chimes = hour % 12 || 12;
    let delay = 0;
    
    for (let i = 0; i < chimes; i++) {
      setTimeout(() => {
        playBeep(400, 600 + i * 50);
      }, delay);
      delay += 800;
    }
  }

  initFlipClock();
  setInterval(updateFlipClock, 1000);

  function updateBufferStatus() {
    try {
      const video = dp.video;
      if (!video || video.readyState < 2) {
        document.getElementById('netSpeed').textContent = '↓缓冲中...';
        return;
      }
      const buffered = video.buffered;
      if (buffered.length > 0) {
        const bufferedEnd = buffered.end(buffered.length - 1);
        const currentTime = video.currentTime;
        const bufferedAhead = bufferedEnd - currentTime;
        if (bufferedAhead > 10) {
          document.getElementById('netSpeed').textContent = '↓缓冲充足';
        } else if (bufferedAhead > 5) {
          document.getElementById('netSpeed').textContent = '↓缓冲正常';
        } else if (bufferedAhead > 2) {
          document.getElementById('netSpeed').textContent = '↓缓冲较少';
        } else {
          document.getElementById('netSpeed').textContent = '↓缓冲中...';
        }
      } else {
        document.getElementById('netSpeed').textContent = '↓加载中...';
      }
    } catch (e) {
      document.getElementById('netSpeed').textContent = '↓--';
    }
  }
  setInterval(updateBufferStatus, 2000);

      // 设置错误监听器
      const errorHandler = () => {
        if (!isError) {
          isError = true;
          if (currentErrorElement) {
            currentErrorElement.style.display = 'block';
          }
        }
      };
      
      // 临时绑定错误事件
      const originalErrorHandler = dp.events['error'];
      dp.on('error', errorHandler);
      
      if (dp.video) {
        const originalVideoErrorHandler = dp.video.onerror;
        dp.video.onerror = errorHandler;
        
        // 保存原始处理器以便恢复
        dp._originalVideoErrorHandler = originalVideoErrorHandler;
      }
      
      // 确保视频元素显示
      if (dp.video) {
        dp.video.style.display = 'block';
        dp.video.style.opacity = '1';
        dp.video.style.visibility = 'visible';
      }
      
      // 确保视频包装器显示
      if (dp.videoWrap) {
        dp.videoWrap.style.display = 'block';
        dp.videoWrap.style.opacity = '1';
        dp.videoWrap.style.visibility = 'visible';
      }
      
      dp.switchVideo({url,type});
      dp.video.volume=0.5;
      dp.play().catch((error) => {
        // 只在网络错误或解码错误时显示提示
        if (error && (error.name === 'NetworkError' || error.message.includes('decode'))) {
          errorHandler();
        }
      });
      
      // 监听视频正常播放
      if (dp.video) {
        dp.video.oncanplay = () => {
          // 视频能正常播放，清除错误状态
          isError = false;
          if (currentErrorElement) {
            currentErrorElement.style.display = 'none';
          }
          
          // 确保视频元素显示
          if (dp.video) {
            dp.video.style.display = 'block';
            dp.video.style.opacity = '1';
            dp.video.style.visibility = 'visible';
          }
        };
        
        // 监听视频加载
        dp.video.onloadeddata = () => {
          // 确保视频元素显示
          if (dp.video) {
            dp.video.style.display = 'block';
            dp.video.style.opacity = '1';
            dp.video.style.visibility = 'visible';
          }
        };
      }
      
    }catch(e){
      // 只有在网络错误时显示提示
      if (e && (e.name === 'NetworkError' || e.message.includes('network'))) {
        errorElement.style.display='block';
      }
    }
  }

  // 安全加载直播源
  const loadChannels = () => {
    const sourceUrl = 'https://gh-proxy.org/https://github.com/bang359/dsj/blob/main/iphone.txt';
    
    // 验证源URL
    if (!Security.validateUrl(sourceUrl)) {
      console.error('安全警告: 无效的直播源URL');
      return;
    }
    
    fetch(sourceUrl)
      .then(r => {
        // 验证响应状态
        if (!r.ok) {
          throw new Error(`HTTP错误: ${r.status}`);
        }
        return r.text();
      })
      .then(txt => {
        // 验证内容长度，防止过大的响应
        if (txt.length > 1000000) {
          throw new Error('安全警告: 响应内容过大');
        }
        
        txt.split('\n').forEach(line => {
          if (!line.trim()) return;
          
          // 安全检查：防止注入攻击
          var tagStart = '<sc' + 'ript';
          var jsProto = 'java' + 'script:';
          var dtProto = 'da' + 'ta:';
          if (line.indexOf(tagStart) !== -1 || line.indexOf(jsProto) !== -1 || line.indexOf(dtProto) !== -1) {
            console.warn('安全警告: 检测到潜在的恶意内容');
            return;
          }
          
          if (line.includes(',#genre#')) {
            const genreName = line.split(',')[0];
            // 验证分类名称
            if (!Security.validateChannelName(genreName)) {
              console.warn('安全警告: 无效的分类名称');
              return;
            }
            const d = document.createElement('div');
            d.className = 'genre';
            Security.setText(d, genreName);
            list.appendChild(d);
            return;
          }
          
          const arr = line.split(',');
          if (arr.length >= 2 && arr[1].startsWith('http')) {
            const channelName = arr[0];
            const channelUrl = arr[1];
            
            // 验证频道名称
            if (!Security.validateChannelName(channelName)) {
              console.warn('安全警告: 无效的频道名称:', channelName);
              return;
            }
            
            // 验证频道URL
            if (!Security.validateUrl(channelUrl)) {
              console.warn('安全警告: 无效的频道URL:', channelUrl);
              return;
            }
            
            const item = document.createElement('div');
            item.className = 'channel';
            Security.setText(item, channelName);
            
            // 创建错误提示元素
            const errorElement = document.createElement('div');
            errorElement.className = 'channel-error';
            Security.setText(errorElement, '频道已失效，请等待更新');
            
            // 将错误提示作为频道的子元素
            item.appendChild(errorElement);
            
            // 使用闭包保护变量
            const safeUrl = channelUrl;
            item.onclick = () => {
              // 安全检查：防止重复点击
              if (item.classList.contains('active')) return;
              
              play(item, errorElement, safeUrl);
              document.querySelectorAll('.channel').forEach(i => i.classList.remove('active'));
              item.classList.add('active');
            };
            
            list.appendChild(item);
          }
        });

        setTimeout(() => {
          const first = document.querySelector('.channel');
          if (first) first.click();
        }, 200);
      })
      .catch(err => {
        console.error('加载直播源失败:', Security.sanitizeLog(err));
        document.getElementById('netSpeed').textContent = '加载失败';
      });
  };

  loadChannels();
});
</script>
</body>
</html>
