<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="快播网络电视">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>快播网络电视</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/dashjs@latest/dist/dash.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flv.js@latest/dist/flv.min.js"></script>
<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;
        -webkit-tap-highlight-color: transparent;
    }
    html,body{
        height:100%;
        background:#0d0d0d;
        color:#fff;
        overflow:hidden;
    }
    .container{
        display:flex;
        flex-direction:column;
        height:100vh;
    }
    /* 顶部标题栏 */
    .header{
        height:44px;
        background:linear-gradient(180deg, #1a1a1a 0%, #0d0d0d 100%);
        border-bottom:2px solid #00cc66;
        display:flex;
        align-items:center;
        padding:0 12px;
        gap:10px;
        z-index:100;
    }
    .logo{
        color:#00cc66;
        font-size:18px;
        font-weight:bold;
        text-shadow:0 0 10px rgba(0,204,102,0.5);
    }
    .sub{
        color:#666;
        font-size:11px;
    }
    /* 视频播放区域 */
    .video-box{
        flex:1;
        background:#000;
        position:relative;
        min-height:0;
        display:flex;
        align-items:center;
        justify-content:center;
    }
    .video-container{
        position:relative;
        width:100%;
        height:100%;
        max-width:1920px;
        max-height:90vh;
    }
    .video-container video{
        width:100%;
        height:100%;
        object-fit:contain;
        background:#000;
    }
    .video-container .loading{
        position:absolute;
        top:50%;
        left:50%;
        transform:translate(-50%,-50%);
        z-index:10;
    }
    /* 响应式设计 */
    @media (min-width: 768px) {
        /* 电脑端布局 */
        .container{
            flex-direction:row;
            height:100vh;
        }
        .main-content{
            flex:1;
            display:flex;
            flex-direction:column;
            min-height:0;
        }
        .video-box{
            flex:1;
            min-height:0;
        }
        .channel-box{
            width:320px;
            display:flex;
            flex-direction:column;
            min-height:0;
        }
        .channel-list{
            flex:1;
            overflow-y:auto;
        }
    }
    @media (max-width: 767px) {
        /* 手机端布局 */
        .container{
            flex-direction:column;
        }
        .main-content{
            display:flex;
            flex-direction:column;
            flex:1;
            min-height:0;
        }
        .video-box{
            width:100%;
            flex-shrink:0;
        }
        .video-container{
            max-width:100%;
        }
        .channel-box{
            flex:1;
            display:flex;
            flex-direction:column;
            min-height:0;
            border-left:none;
            border-top:2px solid #00cc66;
        }
        .channel-list{
            flex:1;
            overflow-y:auto;
            -webkit-overflow-scrolling:touch;
        }
        .channel-item{
            padding:12px 14px;
            font-size:14px;
        }
    }
    video{
        width:100%;
        height:100%;
        object-fit:contain;
        background:#000;
    }
    /* 增强响应式体验 */
    @media (min-width: 1024px) {
        .channel-item{
            padding:14px 16px;
            font-size:15px;
        }
    }
    @media (max-width: 480px) {
        .channel-item{
            padding:10px 12px;
            font-size:13px;
        }
        .channel-box{
            padding:8px;
        }
    }
    .loading{
        position:absolute;
        top:50%;
        left:50%;
        transform:translate(-50%,-50%);
        color:#00cc66;
        font-size:16px;
        background:rgba(0,0,0,0.8);
        padding:15px 25px;
        border-radius:8px;
        border:1px solid #00cc66;
    }

    /* 频道列表区域 */
    .channel-box{
        background:#0d0d0d;
        border-left:2px solid #00cc66;
        padding:8px;
        display:flex;
        flex-direction:column;
    }
    .channel-list{
        flex:1;
        overflow-y:auto;
        margin-top:8px;
    }
    .channel-header{
        height:36px;
        background:#1a1a1a;
        border-bottom:1px solid #333;
        display:flex;
        align-items:center;
        justify-content:space-between;
        padding:0 12px;
        color:#00cc66;
        font-size:13px;
        margin-bottom:10px;
    }
    .channel-item{
        width:100%;
        padding:12px 14px;
        background:#1a1a1a;
        border:1px solid #333;
        border-radius:4px;
        color:#ccc;
        font-size:14px;
        text-align:left;
        margin-bottom:6px;
        cursor:pointer;
        transition:all 0.15s;
    }
    .channel-item:hover{
        background:#2a2a2a;
        border-color:#00cc66;
    }
    .channel-item:active{
        background:#333;
    }
    .channel-item.active{
        background:#00cc66;
        border-color:#00cc66;
        color:#fff;
        font-weight:500;
    }
    /* 滚动条隐藏 */
    ::-webkit-scrollbar{
        width:0;
    }
    /* 响应式调整 */
    @media (max-width: 767px) {
        .loading{
            font-size:14px;
            padding:12px 20px;
        }
    }
    /* 打赏按钮 */
    .reward-btn{
        background:linear-gradient(135deg, #ff6b6b, #ee5a5a);
        padding:4px 12px;
        border-radius:20px;
        font-size:12px;
        color:#fff;
        cursor:pointer;
        transition:all 0.3s ease;
        box-shadow:0 2px 8px rgba(255,107,107,0.3);
    }
    .reward-btn:hover{
        transform:scale(1.05);
        box-shadow:0 4px 12px rgba(255,107,107,0.4);
    }
    /* 打赏模态框 */
    .reward-modal{
        display:none;
        position:fixed;
        top:0;
        left:0;
        width:100%;
        height:100%;
        background:rgba(0,0,0,0.8);
        z-index:1000;
        justify-content:center;
        align-items:center;
    }
    .reward-modal.show{
        display:flex;
    }
    .reward-content{
        background:#1e1e1e;
        border-radius:16px;
        padding:24px;
        max-width:320px;
        width:90%;
        box-shadow:0 10px 40px rgba(0,0,0,0.5);
    }
    .reward-header{
        display:flex;
        justify-content:space-between;
        align-items:center;
        margin-bottom:20px;
    }
    .reward-header h3{
        font-size:18px;
        color:#00cc66;
        margin:0;
    }
    .reward-close{
        background:none;
        border:none;
        color:#888;
        font-size:28px;
        cursor:pointer;
        padding:0;
        line-height:1;
    }
    .reward-close:hover{
        color:#fff;
    }
    .reward-body{
        text-align:center;
    }
    .reward-qrcode{
        width:200px;
        height:200px;
        border-radius:8px;
        margin-bottom:16px;
    }
    .reward-tip{
        color:#aaa;
        font-size:14px;
        margin:0;
    }
    /* 响应式打赏 */
    @media (max-width: 767px) {
        .reward-btn{
            padding:2px 8px;
            font-size:10px;
        }
        .reward-content{
            padding:20px;
        }
        .reward-qrcode{
            width:180px;
            height:180px;
        }
    }
    /* 底部状态栏 */
    .footer{
        height:50px;
        background:linear-gradient(0deg, #1a1a1a 0%, #0d0d0d 100%);
        border-top:1px solid #333;
        display:flex;
        align-items:center;
        gap:15px;
        padding:0 12px;
        font-size:12px;
        color:#00cc66;
        z-index:10;
    }
    .footer-info{
        flex:1;
        overflow:hidden;
        text-overflow:ellipsis;
        white-space:nowrap;
    }
    .footer-controls{
        display:flex;
        align-items:center;
        gap:10px;
    }
    .volume-control{
        display:flex;
        align-items:center;
        gap:8px;
        margin-left:10px;
    }
    .volume-icon{
        font-size:14px;
        color:#666;
        transition:color 0.2s;
    }
    .volume-control:hover .volume-icon{
        color:#888;
    }
    input[type="range"]{
        width:80px;
        height:4px;
        background:#333;
        border-radius:2px;
        outline:none;
        -webkit-appearance:none;
        transition:background 0.2s;
    }
    input[type="range"]:hover{
        background:#444;
    }
    input[type="range"]::-webkit-slider-thumb{
        -webkit-appearance:none;
        width:12px;
        height:12px;
        background:#666;
        border-radius:50%;
        cursor:pointer;
        transition:background 0.2s;
    }
    input[type="range"]::-webkit-slider-thumb:hover{
        background:#888;
    }
    .volume-control input[type="range"]::-moz-range-thumb{
        width:12px;
        height:12px;
        background:#666;
        border-radius:50%;
        cursor:pointer;
        border:none;
        transition:background 0.2s;
    }
    .volume-control input[type="range"]::-moz-range-thumb:hover{
        background:#888;
    }
    .footer-btns{
        display:flex;
        gap:8px;
    }
    .footer-btn{
        padding:4px 12px;
        background:#1a1a1a;
        border:1px solid #333;
        color:#666;
        border-radius:4px;
        font-size:12px;
        cursor:pointer;
        transition:all 0.2s;
    }
    .footer-btn:hover{
        border-color:#444;
        color:#888;
    }
    .footer-btn:active{
        background:#2a2a2a;
        border-color:#555;
        color:#999;
    }
</style>
</head>
<body>
<div class="container">
    <div class="main-content">
        <div class="header">
            <span class="logo">▶ 快播网络电视</span>
            <span class="sub">在线观看</span>
        </div>
        <div class="video-box">
            <div class="video-container">
                <video id="video" playsinline webkit-playsinline crossorigin="anonymous"></video>
                <div class="loading" id="loading">加载中...</div>
            </div>
        </div>
        <div class="footer">
            <div class="footer-info" id="footerInfo">准备就绪</div>
            <div class="footer-controls">
                <button class="footer-btn" id="playPauseBtn">⏸️</button>
                <div class="volume-control">
                    <span class="volume-icon">🔉</span>
                    <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="0.5">
                </div>
            </div>
            <div class="footer-btns">
                <button class="footer-btn" onclick="location.reload()">刷新</button>
            </div>
        </div>
    </div>
    <div class="channel-box">
            <div class="channel-header">
                <span>📺 频道列表</span>
                <div class="reward-btn" id="rewardBtn">❤️ 打赏</div>
            </div>
            <div class="channel-list" id="channelList"></div>
        </div>
</div>
<!-- 打赏模态框 -->
<div class="reward-modal" id="rewardModal">
    <div class="reward-content">
        <div class="reward-header">
            <h3>❤️ 支持一下</h3>
            <button class="reward-close" id="rewardClose">×</button>
        </div>
        <div class="reward-body">
            <img src="https://gh-proxy.org/https://raw.githubusercontent.com/bang359/dsj/main/wx.png" alt="打赏二维码" class="reward-qrcode">
            <p class="reward-tip">微信扫一扫打赏</p>
        </div>
    </div>
</div>
<script>
const video = document.getElementById('video');
const loading = document.getElementById('loading');
const channelList = document.getElementById('channelList');
const footerInfo = document.getElementById('footerInfo');
let hls = null;
let currentActive = null;

// 你指定的官方源，不做任何修改
const sourceURL = "https://gh-proxy.org/https://github.com/bang359/dsj/raw/main/iphone.txt";

// 加载状态
function showLoading(){ loading.style.display = 'block'; }
function hideLoading(){ loading.style.display = 'none'; }

// 播放函数（自动播放）
function playVideo(url, btn) {
    showLoading();
    footerInfo.textContent = '正在播放...';
    
    // 销毁之前的播放
    if(hls) hls.destroy();
    
    // 高亮当前频道
    if(currentActive) currentActive.classList.remove('active');
    btn.classList.add('active');
    currentActive = btn;
    
    // URL编码处理，自动处理包含中文字符的URL
    try {
        // 解析URL，只对路径部分进行编码
        const urlObj = new URL(url);
        const pathname = urlObj.pathname;
        const encodedPathname = pathname.split('/').map(part => {
            try {
                // 尝试解码，如果解码失败说明已经是编码的
                decodeURIComponent(part);
                return part;
            } catch {
                // 对包含非ASCII字符的部分进行编码
                return encodeURIComponent(part);
            }
        }).join('/');
        urlObj.pathname = encodedPathname;
        url = urlObj.toString();
        console.log('编码后的URL:', url);
    } catch (e) {
        console.error('URL编码失败:', e);
        // 如果URL解析失败，尝试直接编码整个URL
        try {
            url = encodeURI(url);
            console.log('直接编码后的URL:', url);
        } catch (e2) {
            console.error('直接编码失败:', e2);
        }
    }

    // 增强的格式检测和处理
    try {
        // 保存当前音量设置
        const savedVolume = currentVolume;
        
        // 1. HLS 格式 (.m3u8)
        if (Hls.isSupported() && (url.includes('.m3u8') || url.includes('hls') || url.includes('playlist'))) {
            console.log('检测到HLS格式:', url);
            footerInfo.textContent = '正在加载HLS流...';
            hls = new Hls({enableWorker:true,backBufferLength:30,maxBufferLength:60});
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                video.play().catch(() => {
                    console.log('HLS自动播放失败，等待用户交互');
                }).finally(() => {
                    hideLoading();
                    footerInfo.textContent = '播放中';
                    // 恢复音量设置
                    video.volume = savedVolume;
                });
            });
            hls.on(Hls.Events.ERROR, (event, data) => {
                console.error('HLS播放错误:', data);
                if (data.fatal) {
                    switch(data.type) {
                        case Hls.ErrorTypes.NETWORK_ERROR:
                            console.error('网络错误，尝试重新加载');
                            hls.startLoad();
                            break;
                        case Hls.ErrorTypes.MEDIA_ERROR:
                            console.error('媒体错误，尝试恢复');
                            hls.recoverMediaError();
                            break;
                        default:
                            hideLoading();
                            footerInfo.textContent = '播放失败';
                            break;
                    }
                }
            });
        }

        // 2. DASH 格式 (.mpd)
        else if (url.includes('.mpd') || url.includes('dash')) {
            console.log('检测到DASH格式:', url);
            footerInfo.textContent = '正在加载DASH流...';
            try {
                if (typeof dashjs !== 'undefined') {
                    // 使用dash.js播放DASH格式
                    var player = dashjs.MediaPlayer().create();
                    player.initialize(video, url, true);
                    player.on(dashjs.MediaPlayer.events.PLAYBACK_ENDED, () => {
                        hideLoading();
                        footerInfo.textContent = '播放中';
                        // 恢复音量设置
                        video.volume = savedVolume;
                    });
                    player.on(dashjs.MediaPlayer.events.ERROR, (e) => {
                        console.error('DASH播放错误:', e);
                        hideLoading();
                        footerInfo.textContent = '播放失败';
                    });
                    // 给播放器一些时间初始化
                    setTimeout(() => {
                        hideLoading();
                        footerInfo.textContent = '播放中';
                        video.volume = savedVolume;
                    }, 3000);
                } else {
                    // 没有dash.js时尝试直接播放
                    video.src = url;
                    video.play().catch(() => {
                        console.log('DASH直接播放失败，尝试作为普通流播放');
                        video.src = url;
                    }).finally(() => {
                        hideLoading();
                        footerInfo.textContent = '播放中';
                        // 恢复音量设置
                        video.volume = savedVolume;
                    });
                }
            } catch (e) {
                console.error('DASH播放初始化错误:', e);
                // 失败时作为普通流播放
                video.src = url;
                hideLoading();
                footerInfo.textContent = '播放中';
                video.volume = savedVolume;
            }
        }

        // 3. FLV格式特别处理（使用flv.js）
        else if (url.includes('.flv') || url.includes('flv') || (typeof flvjs !== 'undefined' && flvjs.isSupported())) {
            console.log('检测到FLV格式:', url);
            footerInfo.textContent = '正在加载FLV流...';
            
            if (typeof flvjs !== 'undefined' && flvjs.isSupported()) {
                // 销毁之前的flv播放器
                if (window.flvPlayer) {
                    window.flvPlayer.destroy();
                }
                
                window.flvPlayer = flvjs.createPlayer({
                    type: 'flv',
                    url: url,
                    hasAudio: true,
                    hasVideo: true,
                    cors: true
                }, {
                    enableWorker: true,
                    enableStashBuffer: false,
                    stashInitialSize: 128
                });
                
                window.flvPlayer.attachMediaElement(video);
                window.flvPlayer.load();
                window.flvPlayer.play().then(() => {
                    console.log('FLV播放成功');
                    hideLoading();
                    footerInfo.textContent = '播放中';
                    video.volume = savedVolume;
                }).catch((err) => {
                    console.error('FLV播放失败:', err);
                    hideLoading();
                    footerInfo.textContent = '播放中';
                    video.volume = savedVolume;
                });
                
                window.flvPlayer.on(flvjs.Events.ERROR, (errType, errDetail) => {
                    console.error('FLV错误:', errType, errDetail);
                    if (window.flvPlayer) {
                        window.flvPlayer.destroy();
                        window.flvPlayer = null;
                    }
                });
            } else {
                // flv.js不支持时尝试直接播放
                video.src = url;
                video.play().catch(() => {
                    console.log('FLV自动播放失败，等待用户交互');
                }).finally(() => {
                    hideLoading();
                    footerInfo.textContent = '播放中';
                    video.volume = savedVolume;
                });
            }
        }

        // 4. 普通视频格式
        else if (url.match(/\.(mp4|webm|ogg|mov|avi|wmv|mkv|ts|m4v)$/i)) {
            console.log('检测到普通视频格式:', url);
            footerInfo.textContent = '正在加载视频...';
            video.src = url;
            video.play().catch(() => {
                console.log('视频自动播放失败，等待用户交互');
            }).finally(() => {
                hideLoading();
                footerInfo.textContent = '播放中';
                // 恢复音量设置
                video.volume = savedVolume;
            });
        }

        // 5. 音频格式
        else if (url.match(/\.(mp3|aac|wav|flac|ogg)$/i)) {
            console.log('检测到音频格式:', url);
            footerInfo.textContent = '正在加载音频...';
            video.src = url;
            video.play().catch(() => {
                console.log('音频自动播放失败，等待用户交互');
            }).finally(() => {
                hideLoading();
                footerInfo.textContent = '播放中';
                // 恢复音量设置
                video.volume = savedVolume;
            });
        }

        // 6. HTTP流格式（包括无扩展名的流，尝试检测并使用最佳播放器）
        else if (url.startsWith('http')) {
            console.log('检测到HTTP流格式:', url);
            footerInfo.textContent = '正在检测流格式...';
            
            // 首先尝试fetch获取内容，检测是否是M3U8播放列表
            fetch(url)
                .then(response => response.text())
                .then(content => {
                    console.log('获取到内容，长度:', content.length);
                    console.log('前200字符:', content.substring(0, 200));
                    
                    // 检测是否是M3U8播放列表
                    if (content.includes('#EXTM3U') || content.includes('.m3u8')) {
                        console.log('检测到M3U8播放列表内容');
                        
                        // 如果内容是相对路径，需要拼接完整URL
                        let fullUrl = url;
                        if (content.includes('.m3u8')) {
                            const baseUrl = url.substring(0, url.lastIndexOf('/') + 1);
                            const lines = content.split('\n');
                            for (let line of lines) {
                                if (line.includes('.m3u8') && !line.startsWith('#')) {
                                    // 找到相对路径，拼接完整URL
                                    if (line.startsWith('http')) {
                                        fullUrl = line;
                                    } else if (line.startsWith('/')) {
                                        const urlObj = new URL(url);
                                        fullUrl = urlObj.origin + line;
                                    } else {
                                        fullUrl = baseUrl + line;
                                    }
                                    console.log('拼接后的完整URL:', fullUrl);
                                    break;
                                }
                            }
                        }
                        
                        // 使用完整URL播放
                        if (Hls.isSupported()) {
                            if (hls) hls.destroy();
                            hls = new Hls({enableWorker:true,backBufferLength:30,maxBufferLength:60});
                            hls.loadSource(fullUrl);
                            hls.attachMedia(video);
                            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                                video.play().catch(() => {}).finally(() => {
                                    hideLoading();
                                    footerInfo.textContent = '播放中';
                                    video.volume = savedVolume;
                                });
                            });
                            hls.on(Hls.Events.ERROR, (event, data) => {
                                console.error('HLS播放错误:', data);
                                if (data.fatal) {
                                    switch(data.type) {
                                        case Hls.ErrorTypes.NETWORK_ERROR:
                                            hls.startLoad();
                                            break;
                                        case Hls.ErrorTypes.MEDIA_ERROR:
                                            hls.recoverMediaError();
                                            break;
                                        default:
                                            hideLoading();
                                            footerInfo.textContent = '播放失败';
                                            break;
                                    }
                                }
                            });
                        } else {
                            video.src = fullUrl;
                            video.play().catch(() => {}).finally(() => {
                                hideLoading();
                                footerInfo.textContent = '播放中';
                                video.volume = savedVolume;
                            });
                        }
                    } else {
                        // 不是M3U8，直接播放
                        video.src = url;
                        video.onloadedmetadata = function() {
                            video.play().then(() => {
                                hideLoading();
                                footerInfo.textContent = '播放中';
                                video.volume = savedVolume;
                            }).catch((err) => {
                                hideLoading();
                                footerInfo.textContent = '播放中';
                                video.volume = savedVolume;
                            });
                        };
                    }
                })
                .catch(err => {
                    console.error('获取内容失败:', err);
                    // fallback: 直接尝试作为视频源播放
                    video.src = url;
                    video.onloadedmetadata = function() {
                        video.play().catch(() => {}).finally(() => {
                            hideLoading();
                            footerInfo.textContent = '播放中';
                            video.volume = savedVolume;
                        });
                    };
                });
            
            // 超时处理
            setTimeout(() => {
                if (loading.style.display === 'block') {
                    console.log('流加载超时');
                    hideLoading();
                    footerInfo.textContent = '播放中';
                    video.volume = savedVolume;
                }
            }, 10000);
        }

        // 7. 其他格式
        else {
            console.warn('未知格式:', url);
            footerInfo.textContent = '正在加载...';
            video.src = url;
            video.play().catch(() => {
                console.log('未知格式自动播放失败，等待用户交互');
            }).finally(() => {
                hideLoading();
                footerInfo.textContent = '播放中';
                // 恢复音量设置
                video.volume = savedVolume;
            });
        }

    } catch (error) {
        console.error('播放初始化错误:', error);
        // 不显示错误提示
        hideLoading();
        footerInfo.textContent = '播放失败';
    }
}

// 加载频道列表
console.log('开始加载频道列表:', sourceURL);
fetch(sourceURL)
.then(res => {
    console.log('获取直播源响应:', res.status);
    return res.text();
})
.then(text => {
    console.log('获取直播源内容长度:', text.length);
    console.log('前1000字符:', text.substring(0, 1000));
    let firstUrl = '';
    let firstBtn = null;
    let channelCount = 0;

    text.split('\n').forEach(line => {
        if(line.includes(',')){
            const [name, url] = line.split(',', 2);
            if(name && url && url.startsWith('http')){
                channelCount++;
                const btn = document.createElement('button');
                btn.className = 'channel-item';
                btn.innerText = name.trim();
                btn.onclick = () => playVideo(url.trim(), btn);
                channelList.appendChild(btn);
                console.log('添加频道:', name.trim(), url.trim());

                if(!firstUrl){
                    firstUrl = url.trim();
                    firstBtn = btn;
                }
            }
        }
    });

    console.log('频道加载完成，共加载', channelCount, '个频道');
    // 自动播放第一个频道
    if(firstUrl) {
        footerInfo.textContent = '加载频道完成，共' + channelCount + '个频道';
        playVideo(firstUrl, firstBtn);
    } else {
        footerInfo.textContent = '无可用频道';
        hideLoading();
    }
})
.catch(err => {
    console.error('加载频道失败:', err);
    channelList.innerHTML = '<div class="channel-item" style="text-align:center;color:#ff6b6b;">直播源加载失败，请刷新重试</div>';
    footerInfo.textContent = '加载失败: ' + err.message;
    hideLoading();
});

// 打赏功能
const rewardBtn = document.getElementById('rewardBtn');
const rewardModal = document.getElementById('rewardModal');
const rewardClose = document.getElementById('rewardClose');

rewardBtn.addEventListener('click', () => {
    rewardModal.classList.add('show');
});

rewardClose.addEventListener('click', () => {
    rewardModal.classList.remove('show');
});

rewardModal.addEventListener('click', (e) => {
    if (e.target === rewardModal) {
        rewardModal.classList.remove('show');
    }
});



// 播放控制功能
const playPauseBtn = document.getElementById('playPauseBtn');
const volumeSlider = document.getElementById('volumeSlider');
const volumeIcon = document.querySelector('.volume-icon');

// 播放/暂停控制
playPauseBtn.addEventListener('click', function() {
    if (video.paused) {
        video.play().then(() => {
            console.log('播放成功');
            playPauseBtn.textContent = '⏸️';
        }).catch((error) => {
            console.error('播放失败:', error);
            footerInfo.textContent = '播放失败: ' + error.message;
        });
    } else {
        video.pause();
        playPauseBtn.textContent = '▶️';
        footerInfo.textContent = '已暂停';
    }
});

// 保存当前音量
let currentVolume = 0.5;

// 音量控制
volumeSlider.addEventListener('input', function() {
    currentVolume = parseFloat(this.value);
    video.volume = currentVolume;
    // 更新音量图标
    if (currentVolume === 0) {
        volumeIcon.textContent = '🔇';
    } else if (currentVolume < 0.5) {
        volumeIcon.textContent = '🔉';
    } else {
        volumeIcon.textContent = '🔊';
    }
});

// 初始化音量
video.volume = currentVolume;
volumeSlider.value = currentVolume;

// 视频状态监听
video.addEventListener('play', function() {
    playPauseBtn.textContent = '⏸️';
});

video.addEventListener('pause', function() {
    playPauseBtn.textContent = '▶️';
});
</script>
