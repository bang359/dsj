<!DOCTYPE html>
<html lang="zh-CN">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>快播直播</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.1/dist/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flv.js@1.6.2/dist/flv.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dplayer@1.27.1/dist/DPlayer.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/dplayer@1.27.1/dist/DPlayer.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#000}
.main{display:flex;height:100vh}

.player-box{flex:1;background:#000;position:relative}
#dplayer{width:100%;height:100%}

/* 彻底屏蔽播放暂停图标 */
.dplayer-play-icon,
.dplayer-pause-icon,
.dplayer-mask,
.dplayer-icons,
.dplayer-controls{
  display:none!important;
  opacity:0!important;
  visibility:hidden!important;
}

/* 保留视频正常显示 */
.dplayer-video{
  display:block!important;
  opacity:1!important;
  visibility:visible!important;
}

/* 换台加载效果：小型、居中、不刺眼（仿影视APP） */
.loading-spinner{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:38px;height:38px;
  border:2px solid rgba(255,255,255,0.15);
  border-top:2px solid #fff;
  border-radius:50%;
  animation:spin 0.6s linear infinite;
  z-index:9;
  display:none;
}
@keyframes spin{
  0%{transform:translate(-50%,-50%) rotate(0)}
  100%{transform:translate(-50%,-50%) rotate(360deg)}
}

.channel-box{width:270px;background:#1a1a1a;border-left:1px solid #333}
.top-bar{height:34px;background:#262626;display:flex;align-items:center;gap:12px;padding:0 12px;font-size:12px;color:#fff}
.donate a{color:#ff6c00;text-decoration:none;font-weight:bold}

.channel-list{height:calc(100vh - 34px);overflow-y:auto;padding:6px}
.channel{padding:10px 12px;margin:3px 0;background:#222;border-radius:3px;cursor:pointer;color:#ccc}
.channel.active{background:#ff6c00;color:#fff}
.genre{padding:8px;background:#111;color:#999;font-size:12px}

@media(max-width:768px){
  .main{flex-direction:column;player-box{height:44vh};channel-box{height:56vh;width:100%}}
}
</style>

<div class="main">
  <div class="player-box">
    <div id="dplayer"></div>
    <div class="loading-spinner" id="loader"></div>
  </div>
  <div class="channel-box">
    <div class="top-bar">
      <div>快播直播</div>
      <div class="donate"><a href="https://gh-proxy.org/https://raw.githubusercontent.com/bang359/dsj/main/wx.png" target="_blank">打赏支持</a></div>
    </div>
    <div class="channel-list" id="list"></div>
  </div>
</div>

<script>
const dp = new DPlayer({
  container: document.getElementById('dplayer'),
  autoplay: true,
  volume: 0.5,
  video: { url: '' },
  notice: false,
  mask: false,
  logo: false
});

const loader = document.getElementById('loader');
const list = document.getElementById('list');

// 仿APP：换台显示极简加载、流畅无闪烁
function play(url) {
  try {
    // 显示加载
    loader.style.display = 'block';
    dp.pause();

    let type = 'normal';
    if (url.includes('.m3u8')) type = 'hls';
    if (url.includes('.flv')) type = 'flv';

    if (!/Mobile|Android|iPhone/.test(navigator.userAgent) && location.protocol === 'https:') {
      url = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url);
    }

    dp.switchVideo({ url, type });
    dp.play();

    // 视频出画面后隐藏加载
    dp.video.oncanplay = () => {
      setTimeout(()=> loader.style.display = 'none', 200);
    };

    // 加载超时隐藏
    setTimeout(()=> loader.style.display = 'none', 3000);
  } catch (e) { loader.style.display = 'none' }
}

// 加载频道
fetch("https://raw.githubusercontent.com/bang359/dsj/main/iphone.txt")
.then(r=>r.text())
.then(txt=>{
  txt.split('\n').forEach(line=>{
    if(!line.trim()) return;
    if(line.includes(',#genre#')){
      const div = document.createElement('div');
      div.className='genre';
      div.textContent = line.split(',')[0];
      list.appendChild(div);
      return;
    }
    const arr = line.split(',');
    if(arr.length>=2 && arr[1].startsWith('http')){
      const item = document.createElement('div');
      item.className='channel';
      item.textContent=arr[0];
      item.onclick=()=>{
        play(arr[1]);
        document.querySelectorAll('.channel').forEach(i=>i.classList.remove('active'));
        item.classList.add('active');
      };
      list.appendChild(item);
    }
  });

  setTimeout(()=>{
    const first = document.querySelector('.channel');
    if(first) first.click();
  },300);
});
</script>
</html>
