<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的电视直播</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #000;
            color: #fff;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .header {
            background: #111;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }
        .header h1 {
            font-size: 18px;
        }
        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .sidebar {
            width: 180px;
            background: #1a1a1a;
            overflow-y: auto;
            padding: 10px;
        }
        .sidebar h3 {
            font-size: 14px;
            margin-bottom: 10px;
            color: #aaa;
        }
        .channel-list {
            list-style: none;
        }
        .channel-list li {
            padding: 8px 10px;
            margin-bottom: 4px;
            background: #222;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        .channel-list li:hover,
        .channel-list li.active {
            background: #007aff;
        }
        .player-container {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }
        .loading {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 18px;
            color: #fff;
        }
        @media (max-width: 768px) {
            .sidebar {
                width: 120px;
            }
            .channel-list li {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📺 电视直播</h1>
        <span id="currentChannel">未选择频道</span>
    </div>
    <div class="container">
        <div class="sidebar">
            <h3>频道列表</h3>
            <ul class="channel-list" id="channelList">
                <li>加载中...</li>
            </ul>
        </div>
        <div class="player-container">
            <video id="player" controls playsinline></video>
            <div class="loading" id="loading">加载中...</div>
        </div>
    </div>

    <script>
        const TXT_URL = "https://raw.githubusercontent.com/bang359/dsj/main/dsj.txt";
        const player = document.getElementById('player');
        const channelListEl = document.getElementById('channelList');
        const currentChannelEl = document.getElementById('currentChannel');
        const loadingEl = document.getElementById('loading');

        // 解析txt直播源
        async function loadChannels() {
            try {
                const response = await fetch(TXT_URL);
                const text = await response.text();
                const lines = text.split('\n').filter(line => line.trim() !== '');
                const channels = [];

                lines.forEach(line => {
                    const parts = line.split(',');
                    if (parts.length >= 2) {
                        const name = parts[0].trim();
                        const url = parts[1].trim();
                        if (url.startsWith('http')) {
                            channels.push({ name, url });
                        }
                    }
                });

                renderChannels(channels);
            } catch (err) {
                channelListEl.innerHTML = `<li>加载失败: ${err.message}</li>`;
            }
        }

        // 渲染频道列表
        function renderChannels(channels) {
            channelListEl.innerHTML = '';
            channels.forEach((ch, index) => {
                const li = document.createElement('li');
                li.textContent = ch.name;
                li.dataset.url = ch.url;
                li.addEventListener('click', () => playChannel(ch, li));
                channelListEl.appendChild(li);

                // 默认播放第一个频道
                if (index === 0) {
                    playChannel(ch, li);
                }
            });
        }

        // 播放选中频道
        function playChannel(channel, liEl) {
            // 更新选中状态
            document.querySelectorAll('.channel-list li').forEach(li => li.classList.remove('active'));
            liEl.classList.add('active');
            currentChannelEl.textContent = channel.name;

            // 显示加载
            loadingEl.style.display = 'block';
            player.src = '';

            // 加载视频
            player.src = channel.url;
            player.play().catch(err => {
                console.error('播放失败:', err);
                alert('该频道无法播放，请尝试其他频道');
            });

            player.oncanplay = () => {
                loadingEl.style.display = 'none';
            };
        }

        // 初始化
        loadChannels();
    </script>
</body>
</html>
