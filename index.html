<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>高清电视直播</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
html,body{height:100%;overflow:hidden;background:#000;color:#fff}
.main{display:flex;height:100%}

.sidebar{width:160px;background:#111;padding:10px;overflow-y:auto;border-right:1px solid #222}
.sidebar h3{font-size:14px;color:#aaa;margin-bottom:10px}
.channel{padding:9px 10px;margin:4px 0;background:#222;border-radius:6px;font-size:14px;cursor:pointer}
.channel.active{background:#007BFF;color:#fff}

.player-box{flex:1;display:flex;align-items:center;justify-content:center;position:relative}
video{width:100%;height:100%;object-fit:contain;background:#000}
.loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:16px}

@media(max-width:768px){
  .sidebar{width:120px}
  .channel{font-size:12px;padding:8px}
}
</style>
</head>

<body>
<div class="main">
  <div class="sidebar">
    <h3>频道列表</h3>
    <div id="list">加载中...</div>
  </div>
  <div class="player-box">
    <video id="player" playsinline controls></video>
    <div class="loading" id="tip">加载直播源中...</div>
  </div>
</div>

<script>
const sourceUrl = "https://gh-proxy.org/https://github.com/bang359/dsj/blob/main/iphone.txt";
const player = document.getElementById("player");
const list = document.getElementById("list");
const tip = document.getElementById("tip");

let channels = [];

async function loadList() {
  try {
    let res = await fetch(sourceUrl);
    let text = await res.text();
    let lines = text.split("\n").filter(i => i.trim());
    channels = [];

    lines.forEach(line => {
      let [name, url] = line.split(",");
      if (name && url && (url.startsWith("http://") || url.startsWith("https://"))) {
        channels.push({ name: name.trim(), url: url.trim() });
      }
    });

    renderList();
  } catch (e) {
    list.innerHTML = "<div style='color:red'>加载失败</div>";
  }
}

function renderList() {
  list.innerHTML = "";
  channels.forEach((ch, i) => {
    let div = document.createElement("div");
    div.className = "channel";
    div.textContent = ch.name;
    div.onclick = () => play(i);
    list.appendChild(div);
  });
}

function play(index) {
  document.querySelectorAll(".channel").forEach((d, i) => {
    d.classList.toggle("active", i === index);
  });
  tip.style.display = "block";
  
  // ✅ 核心：默认打开音量（1.0 最大音量）
  player.src = channels[index].url;
  player.volume = 1.0;
  player.muted = false;
}

player.oncanplay = () => {
  tip.style.display = "none";
};

loadList();
</script>
</body>
</html>
