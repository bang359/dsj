<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电视家重生版 - 全能解码</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/dplayer/dist/DPlayer.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:12px}
.container{max-width:900px;margin:0 auto}
h1{text-align:center;color:#4fc3f7;margin:20px 0}
#dplayer{margin-bottom:20px;border-radius:12px;overflow:hidden}
.channel-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.channel-btn{background:#222;color:#fff;border:0;padding:16px;border-radius:8px;font-size:16px;cursor:pointer}
.channel-btn.active{background:#007aff}
</style>
</head>
<body>
<div class="container">
<h1>📺 电视家重生版</h1>
<div id="dplayer"></div>
<div class="channel-grid" id="channelList"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/hls.js/dist/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flv.js/dist/flv.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dplayer/dist/DPlayer.min.js"></script>
<script>
const TXT_URL = "https://gh-proxy.org/https://github.com/bang359/dsj/raw/main/iphone.txt";
const channelList = document.getElementById("channelList");
let dp = null;

// 初始化万能播放器
function initPlayer(url){
    if(dp) dp.destroy();
    dp = new DPlayer({
        container: document.getElementById("dplayer"),
        autoplay: true,
        video: { url: url }
    });
}

// 加载频道
(async ()=>{
    const text = await fetch(TXT_URL).then(r=>r.text());
    text.trim().split("\n").forEach(line=>{
        if(!line) return;
        const [name,url] = line.split(",").map(i=>i.trim());
        if(!name||!url) return;
        const btn = document.createElement("button");
        btn.className = "channel-btn";
        btn.innerText = name;
        btn.onclick = ()=>{
            document.querySelectorAll(".channel-btn").forEach(b=>b.classList.remove("active"));
            btn.classList.add("active");
            initPlayer(url);
        };
        channelList.appendChild(btn);
    });
})();
</script>
</body>
</html>
