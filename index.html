            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            outline: none;

            border-radius: 50%;
            background: #00d4ff;

            height: 20px;

            border-top-color: #00d4ff;

            top: 20px;
            right: 20px;

            background: rgba(0, 0, 0, 0.9);

            display: none;
            z-index: 1000;
            max-width: 400px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.4);
        }
        
        .notification.show {
            display: block;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {

                opacity: 1;
            }

                {

                    name: "Al Jazeera", 
                    category: "国际", 
                    logoColor: "#4CAF50",
                    source: "https://aljazeera.v.net/aljazeera_2/index.m3u8",
                    epg: [
                        { time: "19:00-20:00", title: "News Hour", desc: "整点新闻" },
                        { time: "20:00-21:00", title: "Inside Story", desc: "深度报道" }

        // 合并所有频道
        const allChannels = [
            ...liveStreams.cctv,
            ...liveStreams.local,
            ...liveStreams.specialty,
            ...liveStreams.international
        ];

        // 当前状态
        let currentChannel = null;
        let isPlaying = false;
        let isMuted = false;
        let videoPlayer = null;
        
        // 初始化页面
        document.addEventListener('DOMContentLoaded', function() {
            // 获取视频播放器元素
            videoPlayer = document.getElementById('videoPlayer');
            
            // 更新时间显示
            updateTime();
            setInterval(updateTime, 1000);
            
            // 生成频道列表
            generateChannelList();
            
            // 设置事件监听器
            setupEventListeners();
            
            // 默认选择第一个频道
            if (allChannels.length > 0) {
                selectChannel(allChannels[0].id);
            }
            
            // 更新统计信息
            updateStats();
            
            // 模拟加载完成
            setTimeout(() => {
                showNotification(`已加载 ${allChannels.length} 个直播频道`, 'success');
            }, 1000);
        });
        
        // 更新时间显示
        function updateTime() {
            const now = new Date();
            const dateStr = now.toLocaleDateString('zh-CN', { 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric',
                weekday: 'long'
            });
            const timeStr = now.toLocaleTimeString('zh-CN', { hour12: false });
            
            document.getElementById('timeDisplay').textContent = `${dateStr} ${timeStr}`;
        }
        
        // 生成频道列表
        function generateChannelList() {
            const channelList = document.getElementById('channelList');
            channelList.innerHTML = '';
            
            allChannels.forEach(channel => {
                const channelItem = document.createElement('li');
                channelItem.className = 'channel-item';
                channelItem.dataset.id = channel.id;
                channelItem.dataset.category = channel.category;
                
                // 生成台标文字
                const logoText = channel.name.substring(0, 2);
                
                // 随机在线状态
                const isOnline = Math.random() > 0.1; // 90%在线率
                
                channelItem.innerHTML = `
                    <div class="channel-logo" style="background: linear-gradient(135deg, ${channel.logoColor}, ${adjustColor(channel.logoColor, 20)})">
                        ${logoText}
                    </div>
                    <div class="channel-info">
                        <div class="channel-name">${channel.name}</div>
                        <div class="channel-meta">
                            <span>${channel.category}</span>
                            <div class="channel-status">
                                <div class="status-dot ${isOnline ? '' : 'offline'}"></div>
                                <span>${isOnline ? '在线' : '离线'}</span>
                            </div>
                        </div>
                    </div>
                `;
                
                channelItem.addEventListener('click', () => selectChannel(channel.id));
                channelList.appendChild(channelItem);
            });
            
            // 更新频道计数
            document.getElementById('channelCount').textContent = `共加载 ${allChannels.length} 个频道`;
            document.getElementById('totalChannels').textContent = allChannels.length;
        }
        
        // 颜色调整函数
        function adjustColor(color, amount) {
            return color;
        }
        
        // 选择频道
        function selectChannel(channelId) {
            // 移除之前选择的频道
            document.querySelectorAll('.channel-item').forEach(item => {
                item.classList.remove('active');
            });
            
            // 高亮当前选择的频道
            const selectedItem = document.querySelector(`.channel-item[data-id="${channelId}"]`);
            if (selectedItem) {
                selectedItem.classList.add('active');
                selectedItem.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            
            // 更新当前频道信息
            currentChannel = allChannels.find(ch => ch.id === channelId);
            
            if (!currentChannel) return;
            
            // 更新播放器显示
            document.getElementById('currentChannelName').textContent = currentChannel.name;
            document.getElementById('placeholderChannelName').textContent = currentChannel.name;
            document.getElementById('currentProgramTitle').textContent = currentChannel.epg[0]?.title || "直播节目";
            
            // 更新占位符信息
            document.getElementById('placeholderMessage').innerHTML = `
                准备播放 ${currentChannel.name}<br>
                <span style="font-size: 1rem; margin-top: 10px; display: block; color: #00d4ff;">
                    <i class="fas fa-play-circle"></i> 源: ${currentChannel.source.substring(0, 50)}...<br>
                    <span style="color: #666;">点击播放按钮开始观看</span>
                </span>
            `;
            
            // 更新节目指南显示
            generateEPG();
            
            // 更新播放器状态
            document.getElementById('playerStatus').textContent = "就绪";
            
            // 模拟更新在线观看人数
            updateOnlineViewers();
            
            // 如果之前正在播放，停止播放
            if (isPlaying) {
                stopPlayback();
            }
        }
        
        // 播放频道
        function playChannel() {
            if (!currentChannel) {
                showNotification('请先选择一个频道', 'error');
                return;
            }
            
            const videoPlayer = document.getElementById('videoPlayer');
            const videoPlaceholder = document.getElementById('videoPlaceholder');
            
            // 显示加载状态
            document.getElementById('placeholderMessage').innerHTML = `
                <div style="display: flex; align-items: center; gap: 10px;">
                    <div class="loading"></div>
                    <span>正在连接直播流...</span>
                </div>
            `;
            
            // 模拟连接过程
            setTimeout(() => {
                // 显示视频播放器，隐藏占位符
                videoPlayer.style.display = 'block';
                videoPlaceholder.style.display = 'none';
                
                // 在实际应用中，这里应该设置视频源
                // videoPlayer.src = currentChannel.source;
                
                document.getElementById('playerStatus').textContent = "播放中";
                document.getElementById('playBtn').innerHTML = '<i class="fas fa-pause"></i>';
                isPlaying = true;
                
                // 显示播放信息
                setTimeout(() => {
                    showNotification(`正在播放: ${currentChannel.name}`, 'success');
                    
                    // 模拟显示播放控制界面
                    document.getElementById('placeholderMessage').innerHTML = `
                        <i class="fas fa-satellite-dish tv-icon"></i>
                        <div class="placeholder-channel">${currentChannel.name}</div>
                        <div class="placeholder-message">
                            正在播放直播流<br>
                            <span style="font-size: 1rem; margin-top: 10px; display: block; color: #00d4ff;">
                                <i class="fas fa-info-circle"></i> 直播源: ${currentChannel.source.substring(0, 30)}...
                            </span>
                        </div>
                    `;
                }, 500);
            }, 1500);
        }
        
        // 停止播放
        function stopPlayback() {
            const videoPlayer = document.getElementById('videoPlayer');
            const videoPlaceholder = document.getElementById('videoPlaceholder');
            
            videoPlayer.style.display = 'none';
            videoPlaceholder.style.display = 'flex';
            document.getElementById('playerStatus').textContent = "已停止";
            document.getElementById('playBtn').innerHTML = '<i class="fas fa-play"></i>';
            isPlaying = false;
        }
        
        // 生成电子节目指南
        function generateEPG() {
            const epgContent = document.getElementById('epgContent');
            
            if (!currentChannel) {
                epgContent.innerHTML = '<div style="text-align: center; padding: 40px; color: #aaa;">请选择一个频道查看节目预告</div>';
                return;
            }
            
            let programsHTML = '';
            currentChannel.epg.forEach((program, index) => {
                const isCurrent = index === 0;
                programsHTML += `
                    <div class="epg-item ${isCurrent ? 'current' : ''}">
                        <div class="epg-time">${program.time}</div>
                        <div class="epg-title">${program.title}</div>
                        <div class="epg-desc">${program.desc}</div>
                    </div>
                `;
            });
            
            epgContent.innerHTML = `
                <div style="margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid rgba(255, 255, 255, 0.1);">
                    <h3 style="color: #00d4ff; font-size: 1.3rem;">${currentChannel.name} 节目表</h3>
                </div>
                ${programsHTML}
            `;
        }
        
        // 设置事件监听器
        function setupEventListeners() {
            // 播放按钮
            document.getElementById('playBtn').addEventListener('click', function() {
                if (!isPlaying) {
                    playChannel();
                } else {
                    // 暂停播放
                    document.getElementById('playerStatus').textContent = "已暂停";
                    this.innerHTML = '<i class="fas fa-play"></i>';
                    isPlaying = false;
                }
            });
            
            // 暂停按钮
            document.getElementById('pauseBtn').addEventListener('click', function() {
                document.getElementById('playerStatus').textContent = "已暂停";
                document.getElementById('playBtn').innerHTML = '<i class="fas fa-play"></i>';
                isPlaying = false;
            });
            
            // 停止按钮
            document.getElementById('stopBtn').addEventListener('click', function() {
                stopPlayback();
                showNotification('播放已停止', 'info');
            });
            
            // 静音按钮
            document.getElementById('muteBtn').addEventListener('click', function() {
                isMuted = !isMuted;
                const icon = this.querySelector('i');
                const volumeIcon = document.getElementById('volumeIcon');
                
                if (isMuted) {
                    icon.className = 'fas fa-volume-mute';
                    volumeIcon.className = 'fas fa-volume-mute';
                    document.getElementById('volumeSlider').value = 0;
                } else {
                    icon.className = 'fas fa-volume-up';
                    volumeIcon.className = 'fas fa-volume-up';
                    document.getElementById('volumeSlider').value = 80;
                }
            });
            
            // 全屏按钮
            document.getElementById('fullscreenBtn').addEventListener('click', function() {
                const playerPanel = document.querySelector('.player-panel');
                if (playerPanel.requestFullscreen) {
                    playerPanel.requestFullscreen();
                } else if (playerPanel.webkitRequestFullscreen) {
                    playerPanel.webkitRequestFullscreen();
                } else if (playerPanel.msRequestFullscreen) {
                    playerPanel.msRequestFullscreen();
                }
            });
            
            // 音量控制
            document.getElementById('volumeSlider').addEventListener('input', function() {
                const volume = this.value;
                const volumeIcon = document.getElementById('volumeIcon');
                const muteBtnIcon = document.getElementById('muteBtn').querySelector('i');
                
                if (volume == 0) {
                    volumeIcon.className = 'fas fa-volume-mute';
                    muteBtnIcon.className = 'fas fa-volume-mute';
                    isMuted = true;
                } else {
                    volumeIcon.className = 'fas fa-volume-up';
                    muteBtnIcon.className = 'fas fa-volume-up';
                    isMuted = false;
                }
            });
            
            // 频道过滤
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    
                    const filter = this.dataset.filter;
                    filterChannels(filter);
                });
            });
        }
        
        // 频道过滤
        function filterChannels(filter) {
            const channelItems = document.querySelectorAll('.channel-item');
            
            channelItems.forEach(item => {
                if (filter === 'all' || item.dataset.category === filter) {
                    item.style.display = 'flex';
                } else {
                    item.style.display = 'none';
                }
            });
        }
        
        // 更新在线观看人数
        function updateOnlineViewers() {
            if (!currentChannel) return;
            
            // 模拟在线人数（基于频道ID生成伪随机数）
            const baseViewers = 500 + (currentChannel.id * 123) % 2000;
            const randomViewers = baseViewers + Math.floor(Math.random() * 500);
            
            document.getElementById('onlineViewers').textContent = randomViewers.toLocaleString();
        }
        
        // 更新统计信息
        function updateStats() {
            // 模拟频道状态
            const onlineChannels = allChannels.length - Math.floor(Math.random() * 3);
            document.getElementById('totalChannels').textContent = allChannels.length;
        }
        
        // 显示通知
        function showNotification(message, type = 'info') {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = 'notification ' + type;
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }
    </script>
