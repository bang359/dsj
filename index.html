<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全能直播TV（无限制版）</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:sans-serif;padding:10px}
.container{max-width:1000px;margin:0 auto}
.title{text-align:center;padding:15px;color:#4fc3f7}
#player{width:100%;border-radius:12px;margin-bottom:15px;background:#000}
.channel-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.channel{background:#222;color:#fff;border:none;padding:15px;border-radius:8px}
.channel.active{background:#007aff}
</style>
</head>
<body>
<div class="container">
<div class="title">📺 全能直播（无限制）</div>
<video id="player" controls playsinline webkit-playsinline></video>
<div class="channel-grid" id="channelList"></div>
</div>

<script>
const player = document.getElementById("player");
const channelList = document.getElementById("channelList");
const TXT_URL = "https://gh-proxy.org/https://github.com/bang359/dsj/raw/main/iphone.txt";

// 🔥 核心：强制绕过 HTTPS 限制 + 兼容所有 IP 直播源
async function loadChannels(){
  const text = await fetch(TXT_URL).then(r=>r.text());
  const lines = text.trim().split("\n");

  lines.forEach(line => {
    if(!line) return;
    const [name, url] = line.split(",").map(i=>i.trim());
    if(!name || !url) return;

    const btn = document.createElement("button");
    btn.className = "channel";
    btn.innerText = name;
    btn.onclick = () => {
      document.querySelectorAll(".channel").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      
      // ✅ 终极播放方式：原生视频直连，兼容所有格式
      player.src = url;
      player.load();
      player.play().catch(e=>{
        console.log("播放异常（正常），请手动点播放按钮", e);
      });
    };
    channelList.appendChild(btn);
  });
}

loadChannels();
</script>
</body>
</html>
