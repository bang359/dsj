<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>万能格式直播播放器</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/dplayer/dist/DPlayer.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial;
        }
        body {
            background: #0b0b0b;
            color: #fff;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        /* 左侧频道列表 占 1/5 */
        #channelList {
            width: 20%;
            background: #141414;
            border-right: 1px solid #333;
            padding: 10px;
            overflow-y: auto;
        }
        .channel {
            padding: 12px 16px;
            background: #1f1f1f;
            margin: 8px 0;
            border-radius: 8px;
            cursor: pointer;
        }
        .channel:hover {
            background: #007bff;
        }
        /* 右侧播放器 占 4/5 */
        #dplayer {
            width: 80%;
            height: 100vh;
        }
        /* 滚动条美化 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 3px;
        }
    </style>
</head>
<body>

<!-- 左侧频道列表 -->
<div id="channelList"></div>

<!-- 右侧播放界面 -->
<div id="dplayer"></div>

<script src="https://cdn.jsdelivr.net/npm/hls.js/dist/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flv.js/dist/flv.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dplayer/dist/DPlayer.min.js"></script>

<script>
let dp;

// 初始化播放器
function initPlayer(url) {
    if (dp) dp.destroy();
    dp = new DPlayer({
        container: document.getElementById('dplayer'),
        autoplay: false,
        theme: '#007bff',
        video: { url: url }
    });
}

// 切换频道
function play(url) {
    initPlayer(url);
}

// 加载你的直播源（完全不修改，原样使用）
const sourceURL = "https://gh-proxy.org/https://github.com/bang359/dsj/blob/main/iphone.txt";
fetch(sourceURL)
   .then(res => res.text())
   .then(text => {
       const list = document.getElementById("channelList");
       const lines = text.split("\n").map(i=>i.trim()).filter(Boolean);
       let firstURL = "";
       
       lines.forEach(line => {
           if(line.includes(",")){
               const [name, url] = line.split(",", 2);
               if(name && url && url.startsWith("http")){
                   if(!firstURL) firstURL = url;
                   const div = document.createElement("div");
                   div.className = "channel";
                   div.innerText = name;
                   div.onclick = () => play(url);
                   list.appendChild(div);
               }
           }
       });

       // 默认播放第一个频道
       if(firstURL) initPlayer(firstURL);
   })
   .catch(err => console.log("加载失败", err));
</script>

</body>
</html>
