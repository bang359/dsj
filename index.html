<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网络电视直播</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/dplayer/dist/DPlayer.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", Arial, sans-serif;
        }
        body {
            background: #0b0b0b;
            color: #fff;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        /* ———— 左侧频道列表 宽度22% 更舒服 ———— */
        #channelList {
            width: 22%;
            background: #121212;
            border-right: 1px solid #2a2a2a;
            padding: 12px;
            overflow-y: auto;
        }
        /* 频道标题 */
        .channel-title {
            padding: 14px 12px;
            font-size: 16px;
            font-weight: bold;
            color: #ddd;
            text-align: center;
            margin-bottom: 8px;
        }
        /* 频道按钮 美化 */
        .channel {
            padding: 14px 16px;
            background: #1e1e1e;
            margin-bottom: 8px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 15px;
            border: 1px solid transparent;
        }
        /* hover 效果 */
        .channel:hover {
            background: #0066cc;
            transform: translateX(4px);
        }
        /* 选中高亮 */
        .channel.active {
            background: #0056b3;
            border-color: #0088ff;
            font-weight: bold;
        }
        /* 右侧播放器 宽度78% */
        #dplayer {
            width: 78%;
            height: 100vh;
        }
        /* 滚动条美化 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-track {
            background: #111;
        }
    </style>
</head>
<body>

<!-- 左侧频道列表 -->
<div id="channelList">
    <div class="channel-title">📺 频道列表</div>
</div>

<!-- 右侧播放界面 -->
<div id="dplayer"></div>

<script src="https://cdn.jsdelivr.net/npm/hls.js/dist/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flv.js/dist/flv.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dplayer/dist/DPlayer.min.js"></script>

<script>
let dp;
let currentActive = null;

// 初始化播放器
function initPlayer(url) {
    if (dp) dp.destroy();
    dp = new DPlayer({
        container: document.getElementById('dplayer'),
        autoplay: false,
        theme: '#007bff',
        video: { url: url }
    });
}

// 切换频道 + 高亮选中
function play(url, div) {
    initPlayer(url);
    
    // 取消之前高亮
    if(currentActive) currentActive.classList.remove("active");
    // 高亮当前
    div.classList.add("active");
    currentActive = div;
}

// 加载直播源
const sourceURL = "https://gh-proxy.org/https://github.com/bang359/dsj/blob/main/iphone.txt";
fetch(sourceURL)
   .then(res => res.text())
   .then(text => {
       const list = document.getElementById("channelList");
       const lines = text.split("\n").map(i=>i.trim()).filter(Boolean);
       let firstURL = "";
       let firstDiv = null;
       
       lines.forEach(line => {
           if(line.includes(",")){
               const [name, url] = line.split(",", 2);
               if(name && url && url.startsWith("http")){
                   if(!firstURL) {
                       firstURL = url;
                   }
                   const div = document.createElement("div");
                   div.className = "channel";
                   div.innerText = name;
                   div.onclick = () => play(url, div);
                   
                   if(!firstDiv) firstDiv = div;
                   list.appendChild(div);
               }
           }
       });

       // 默认播放第一个
       if(firstURL && firstDiv) {
           play(firstURL, firstDiv);
       }
   })
   .catch(err => console.log("加载失败", err));
</script>

</body>
</html>
