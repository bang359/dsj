<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="网络电视">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>网络电视</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
html,body{height:100%;background:#000;color:#fff;overflow:hidden}
.container{display:flex;flex-direction:column;height:100vh}
.video-area{width:100%;height:40vh;background:#000;position:relative}
video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
.loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#007aff;font-size:18px}
.channel-area{flex:1;background:#121212;padding:12px;overflow-y:auto}
.channel-title{font-size:17px;margin:12px 0 8px;color:#007aff}
.channel-item{display:block;width:100%;padding:16px;background:#1e1e1e;border:none;border-radius:12px;color:#fff;margin-bottom:8px;font-size:16px;text-align:left;cursor:pointer}
.channel-item.active{background:#007aff}
.channel-item:active{background:#0066cc}
</style>
</head>
<body>

<div class="container">
    <div class="video-area">
        <video id="video" playsinline webkit-playsinline></video>
        <div class="loading" id="loading">加载中...</div>
    </div>
    <div class="channel-area" id="channelList"></div>
</div>

<script>
const video = document.getElementById('video');
const loading = document.getElementById('loading');
const channelList = document.getElementById('channelList');
let hls = null;

// 加载你 GitHub 上的直播源
const sourceURL = "https://gh-proxy.org/https://github.com/bang359/dsj/raw/main/iphone.txt";

// 显示/隐藏加载
function showLoading(){ loading.style.display = 'block'; }
function hideLoading(){ loading.style.display = 'none'; }

// 自动播放视频
function playVideo(url){
    showLoading();
    if(hls) hls.destroy();
    
    if(Hls.isSupported() && url.includes('.m3u8')){
        hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
            video.play().then(hideLoading).catch(hideLoading);
        });
        hls.on(Hls.Events.ERROR, hideLoading);
    }else{
        video.src = url;
        video.play().then(hideLoading).catch(hideLoading);
    }

    // 高亮频道
    document.querySelectorAll('.channel-item').forEach(i => i.classList.remove('active'));
    event.target.classList.add('active');
}

// 加载频道列表
fetch(sourceURL)
.then(res => res.text())
.then(text => {
    let firstUrl = '';
    text.split('\n').forEach(line => {
        if(line.includes(',')){
            const [name, url] = line.split(',', 2);
            if(name && url && url.startsWith('http')){
                const btn = document.createElement('button');
                btn.className = 'channel-item';
                btn.innerText = name;
                btn.onclick = () => playVideo(url);
                channelList.appendChild(btn);
                
                if(!firstUrl){
                    firstUrl = url;
                    btn.classList.add('active');
                }
            }
        }
    });
    if(firstUrl) playVideo(firstUrl);
})
.catch(() => {
    channelList.innerHTML = '<div class="channel-item">加载失败，请刷新</div>';
    hideLoading();
});
</script>
</body>
</html>
