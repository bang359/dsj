
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>快播直播</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.1/dist/hls.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;color:#ccc;font-family:system-ui,sans-serif}
.main{display:flex;flex-direction:column;height:100vh}

/* 顶部状态栏 */
.top-bar{height:32px;background:#262626;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:12px;color:#fff}
.online{color:#00ffcc}

/* 播放区域（快播大黑框） */
.player-wrap{flex:none;width:100%;aspect-ratio:16/9;background:#000;position:relative}
video{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain;background:#000}

/* 频道列表区域 */
.channel-box{flex:1;background:#1a1a1a;overflow:hidden;display:flex;flex-direction:column}
.channel-list{flex:1;overflow-y:auto;padding:6px}
.channel-item{padding:10px 12px;margin:3px 0;background:#222;border-radius:3px;font-size:14px;cursor:pointer}
.channel-item:hover{background:#333}
.channel-item.active{background:#ff6c00;color:#fff}

/* 分类标题 */
.genre{padding:8px;font-size:12px;color:#999;background:#111}

/* 手机自适应 */
@media (min-width:768px){
  .main{flex-direction:row}
  .player-wrap{width:70%;height:100vh;aspect-ratio:auto}
  .channel-box{width:30%;height:100vh}
}

/* 滚动条 */
.channel-list::-webkit-scrollbar{width:5px}
.channel-list::-webkit-scrollbar-thumb{background:#444;border-radius:4px}
</style>
</head>

<body>
<div class="main">
  <div class="player-wrap">
    <video id="video" playsinline webkit-playsinline muted></video>
  </div>
  <div class="channel-box">
    <div class="top-bar">
      <div>快播直播</div>
      <div class="online" id="online">在线人数：加载中...</div>
    </div>
    <div class="channel-list" id="channelList"></div>
  </div>
</div>

<script>
const video = document.getElementById('video');
const channelList = document.getElementById('channelList');
const online = document.getElementById('online');

let channels = [];
let current = 0;
let hls = null;

// 直播源 —— 完全不修改
const sourceUrl = "http://iptv.4666888.xyz/FYTV.txt";

// 模拟在线人数
function randOnline(){
  return Math.floor(200 + Math.random()*600);
}
online.textContent = `在线人数：${randOnline()} 人`;
setInterval(()=>{
  online.textContent = `在线人数：${randOnline()} 人`;
}, 10000);

// 销毁播放器
function destroy(){
  try{if(hls)hls.destroy()}catch(e){}
  video.pause(); video.src = '';
}

// 播放
function play(url){
  destroy();
  video.muted = false;
  if(url.includes('.m3u8') && Hls.isSupported()){
    hls = new Hls({maxBufferLength:3});
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, ()=>{
      video.play().catch(()=>{});
    });
  }else{
    video.src = url;
    video.play().catch(()=>{});
  }
}

// 加载频道（原样解析，不筛选、不删减）
async function loadChannels(){
  try{
    const res = await fetch(sourceUrl, {cache:'no-store'});
    const text = await res.text();
    channelList.innerHTML = '';
    channels = [];
    const lines = text.split(/\n/);
    lines.forEach(line=>{
      line = line.trim();
      if(!line) return;
      // 分类
      if(line.includes(',#genre#')){
        const name = line.split(',')[0];
        const div = document.createElement('div');
        div.className = 'genre';
        div.textContent = name;
        channelList.appendChild(div);
        return;
      }
      // 频道
      const arr = line.split(',');
      if(arr.length>=2 && arr[1].startsWith('http')){
        const item = document.createElement('div');
        item.className = 'channel-item';
        item.textContent = arr[0];
        item.onclick = ()=>{
          play(arr[1]);
          current = channels.length;
          document.querySelectorAll('.channel-item').forEach((i,j)=>{
            i.classList.toggle('active', j===current);
          });
        };
        channelList.appendChild(item);
        channels.push(arr[1]);
      }
    });
    // 自动播放第一个
    if(channels.length) play(channels[0]);
  }catch(e){
    console.error(e);
  }
}

// 苹果自动播放兼容
video.muted = true;
setTimeout(()=>{video.muted=false}, 1500);

loadChannels();
</script>
</body>
</html>
