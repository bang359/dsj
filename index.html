<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>📺 电视家 - 全平台通用版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
            padding: 10px;
        }

        .box {
            max-width: 1000px;
            margin: 0 auto;
        }

        .title {
            text-align: center;
            color: #4ecdc4;
            padding: 12px 0;
            font-size: 22px;
        }

        /* 播放器区域 */
        .video-area {
            width: 100%;
            background: #111;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 16px;
        }

        #player {
            width: 100%;
            display: block;
        }

        /* 频道列表 */
        .channel-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .channel {
            background: #222;
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 15px;
            text-align: center;
            cursor: pointer;
        }

        .channel.active {
            background: #007aff;
        }

        .tip {
            text-align: center;
            color: #ff6b6b;
            padding: 10px;
            display: none;
        }
    </style>
</head>

<body>
    <div class="box">
        <div class="title">📺 电视家 - 全平台通用</div>
        <div class="video-area">
            <video id="player" controls playsinline webkit-playsinline></video>
        </div>
        <div id="tip" class="tip">播放失败，请切换其他频道</div>
        <div class="channel-list" id="channels"></div>
    </div>

    <script>
        const video = document.getElementById('player');
        const channels = document.getElementById('channels');
        const tip = document.getElementById('tip');
        const sourceUrl = "https://gh-proxy.org/https://github.com/bang359/dsj/raw/main/iphone.txt";

        // 加载直播源
        (async function loadList() {
            try {
                let res = await fetch(sourceUrl);
                let text = await res.text();
                let lines = text.trim().split('\n');

                lines.forEach(line => {
                    if (!line) return;
                    let [name, url] = line.split(',').map(i => i.trim());
                    if (!name || !url) return;

                    let btn = document.createElement('button');
                    btn.className = 'channel';
                    btn.innerText = name;
                    btn.onclick = () => play(url, btn);
                    channels.appendChild(btn);
                });
            } catch (e) {
                tip.innerText = "加载频道失败";
                tip.style.display = "block";
            }
        })();

        // 万能播放（支持所有源 + 苹果/电脑全兼容）
        function play(url, btn) {
            document.querySelectorAll('.channel').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            tip.style.display = 'none';

            // 核心：苹果/电脑通用播放方式
            video.src = url;
            video.load();

            // 用户点击后播放（解决苹果限制）
            video.play().catch(() => {
                tip.style.display = 'block';
            });
        }
    </script>
</body>
</html>
