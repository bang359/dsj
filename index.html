<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="电视直播">
<title>电视直播</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif;
  background: linear-gradient(180deg, #000000 0%, #0a0a0a 100%);
  color: #fff;
  min-height: 100vh;
  padding: 0;
  overflow-x: hidden;
}

/* 顶部状态栏适配 */
.status-bar {
  height: env(safe-area-inset-top, 20px);
  background: #000;
}

.container {
  padding: 0 12px;
  padding-bottom: calc(20px + env(safe-area-inset-bottom));
}

/* 顶部信息栏（时间+天气+标题） */
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 0;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  margin-bottom: 16px;
}

.time {
  font-size: 16px;
  font-weight: 500;
  color: #e0e0e0;
}

.weather {
  font-size: 14px;
  color: #aaa;
  display: flex;
  align-items: center;
  gap: 4px;
}

.title {
  font-size: 18px;
  font-weight: 600;
  background: linear-gradient(90deg, #00d9ff, #007bff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

/* 播放器区域 */
.player-wrapper {
  border-radius: 16px;
  overflow: hidden;
  background: #000;
  box-shadow: 0 8px 32px rgba(0,0,0,0.6);
  margin-bottom: 20px;
  position: relative;
}

video {
  width: 100%;
  display: block;
  background: #000;
}

/* 加载动画 */
.loading {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.7);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 12px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}

.loading.show {
  opacity: 1;
  pointer-events: auto;
}

.spinner {
  width: 36px;
  height: 36px;
  border: 3px solid rgba(255,255,255,0.2);
  border-top-color: #00d9ff;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.loading-text {
  font-size: 14px;
  color: #aaa;
}

/* 频道列表 */
.channels-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  max-height: calc(100vh - 360px);
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

.channel-btn {
  padding: 14px 8px;
  background: linear-gradient(145deg, #1a1a1a, #121212);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px;
  color: #e0e0e0;
  font-size: 13px;
  font-weight: 500;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s ease;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.channel-btn:hover {
  transform: scale(0.98);
  background: linear-gradient(145deg, #222222, #181818);
}

.channel-btn.active {
  background: linear-gradient(145deg, #007bff, #0056b3);
  border-color: #007bff;
  color: #fff;
  box-shadow: 0 4px 16px rgba(0,123,255,0.3);
}

/* 滚动条美化 */
::-webkit-scrollbar {
  width: 2px;
}

::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.2);
  border-radius: 1px;
}
</style>
</head>

<body>
<div class="status-bar"></div>
<div class="container">
  <!-- 顶部信息栏：时间+标题+天气 -->
  <div class="top-bar">
    <div class="time" id="time"></div>
    <div class="title">📺 电视直播</div>
    <div class="weather" id="weather">加载中...</div>
  </div>

  <div class="player-wrapper">
    <video id="tv" playsinline webkit-playsinline x-webkit-airplay="allow" controls></video>
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <div class="loading-text">正在加载频道...</div>
    </div>
  </div>

  <div class="channels-grid" id="channels"></div>
</div>

<script>
const tv = document.getElementById('tv');
const channelsEl = document.getElementById('channels');
const loading = document.getElementById('loading');
const timeEl = document.getElementById('time');
const weatherEl = document.getElementById('weather');
let activeBtn = null;
let hasUserInteracted = false;

// 你的直播源地址
const sourceUrl = "https://gh-proxy.org/https://github.com/bang359/dsj/raw/main/iphone.txt";

// ======================
// 实时时间显示
// ======================
function updateTime() {
  const now = new Date();
  const hours = String(now.getHours()).padStart(2, '0');
  const minutes = String(now.getMinutes()).padStart(2, '0');
  const seconds = String(now.getSeconds()).padStart(2, '0');
  const weekDays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  const weekDay = weekDays[now.getDay()];
  
  timeEl.textContent = `${hours}:${minutes}:${seconds} ${weekDay}`;
}

// 初始化时间并每秒更新
updateTime();
setInterval(updateTime, 1000);

// ======================
// 自动定位天气显示
// ======================
function getWeather() {
  // 使用免费公开天气API，自动获取当前城市天气
  fetch('https://api.oioweb.cn/api/weather/GetWeather')
    .then(res => res.json())
    .then(data => {
      if (data.code === 200) {
        const city = data.result.city;
        const temp = data.result.temp;
        const weather = data.result.weather;
        weatherEl.textContent = `${city} ${temp}° ${weather}`;
      } else {
        weatherEl.textContent = '天气获取失败';
      }
    })
    .catch(() => {
      weatherEl.textContent = '天气获取失败';
    });
}

// 页面加载时获取天气，每30分钟更新一次
getWeather();
setInterval(getWeather, 1800000);

// ======================
// 直播播放功能
// ======================
// 加载并解析频道
fetch(sourceUrl)
  .then(res => res.text())
  .then(text => {
    const lines = text.split('\n').map(line => line.trim()).filter(line => line);
    const channels = [];

    lines.forEach(line => {
      if (line.includes(',')) {
        const [name, url] = line.split(',', 2);
        if (url && (url.includes('.m3u8') || url.includes('.ts') || url.includes('.mp4'))) {
          channels.push({ name, url });
        }
      }
    });

    // 渲染频道
    channels.forEach((channel, index) => {
      const btn = document.createElement('button');
      btn.className = 'channel-btn';
      btn.textContent = channel.name;
      btn.onclick = () => playChannel(channel.url, btn);
      channelsEl.appendChild(btn);

      // 默认播放第一个频道
      if (index === 0) {
        setTimeout(() => btn.click(), 500);
      }
    });
  })
  .catch(err => {
    alert('加载频道失败，请刷新页面重试');
    console.error(err);
  });

// 播放频道
function playChannel(url, btn) {
  // 标记用户已交互，自动打开音量
  hasUserInteracted = true;

  // 切换按钮状态
  if (activeBtn) activeBtn.classList.remove('active');
  activeBtn = btn;
  btn.classList.add('active');

  // 显示加载动画
  loading.classList.add('show');

  // 播放
  tv.src = url;
  tv.load();

  tv.play()
    .then(() => {
      // 用户交互后自动打开音量
      if (hasUserInteracted) {
        tv.muted = false;
        tv.volume = 1.0;
      }
      loading.classList.remove('show');
    })
    .catch(err => {
      loading.classList.remove('show');
      console.log('播放中...');
    });
}

// 苹果自动播放兼容：先静音播放，用户交互后自动开音量
tv.muted = true;
tv.autoplay = true;

// 任何用户交互都打开音量
document.addEventListener('click', () => {
  if (hasUserInteracted && tv.muted) {
    tv.muted = false;
    tv.volume = 1.0;
  }
}, { once: true });
</script>
</body>
</html>
