.tab-btn.active{background:#00aaff;color:#fff}
.tab-btn:hover{background:#333}
.tab-btn.active:hover{background:#0099dd}
.channels-container{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.channel-item{padding:14px 10px;background:#1a1a1a;border:1px solid #333;border-radius:8px;text-align:center;cursor:pointer;transition:all .3s;font-size:14px;color:#eee}
.channel-item:hover{background:#2a2a2a;border-color:#00aaff;transform:translateY(-2px)}
.channel-item.active{background:#00aaff;color:#fff;border-color:#00aaff}
@media (max-width:768px){
.logo{font-size:24px}
.channels-container{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}

const player = document.getElementById('tvPlayer');
const noSourceTip = document.getElementById('noSourceTip');
const categoryTabs = document.getElementById('categoryTabs');
const channelsContainer = document.getElementById('channelsContainer');

let currentCategory = "央视频道";
let currentChannelIndex = 0;

function initCategories(){
    categoryTabs.innerHTML = '';
    Object.keys(channelData).forEach(cat=>{
        const btn = document.createElement('button');
        btn.className = `tab-btn ${cat===currentCategory?'active':''}`;
        btn.textContent = cat;
        btn.onclick = ()=>{
            currentCategory = cat;
            initCategories();
            renderChannels();
        };
        categoryTabs.appendChild(btn);
    });
}

function renderChannels(){
    channelsContainer.innerHTML = '';
    const channels = channelData[currentCategory]||[];
    channels.forEach((ch,i)=>{
        const item = document.createElement('div');
        item.className = `channel-item ${i===currentChannelIndex?'active':''}`;
        item.textContent = ch.name;
        item.onclick = ()=>playChannel(ch.url,i);
        channelsContainer.appendChild(item);
    });
}

function playChannel(url,idx){
    currentChannelIndex = idx;
    noSourceTip.style.display = 'none';
    player.src = url;
    player.load();
    player.play().catch(e=>alert('播放失败，换个频道试试'));
    renderChannels();
}

window.onload = ()=>{
    initCategories();
    renderChannels();
    if(channelData[currentCategory]?.length) playChannel(channelData[currentCategory][0].url,0);
};
