<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>网络电视直播</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/dplayer/dist/DPlayer.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background: #0b0b0b;
            color: #fff;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        /* 左侧频道列表 */
        #channelList {
            width: 28%;
            background: #121212;
            border-right: 1px solid #2a2a2a;
            padding: 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .channel-title {
            padding: 14px 0;
            font-size: 16px;
            font-weight: bold;
            color: #ddd;
            text-align: center;
        }
        .channel {
            padding: 16px 12px;
            background: #1e1e1e;
            border-radius: 12px;
            cursor: pointer;
            font-size: 15px;
            text-align: center;
            transition: 0.2s;
            user-select: none;
        }
        .channel:active {
            background: #0077ff;
            transform: scale(0.96);
        }
        .channel.active {
            background: #0056b3;
            font-weight: bold;
            border: 1px solid #0099ff;
        }
        /* 右侧播放 */
        #dplayer {
            width: 72%;
            height: 100vh;
        }
        /* 滚动条 */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-thumb {
            background: #666;
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <div id="channelList">
        <div class="channel-title">📺 频道</div>
    </div>
    <div id="dplayer"></div>

<script src="https://cdn.jsdelivr.net/npm/hls.js/dist/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flv.js/dist/flv.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dplayer/dist/DPlayer.min.js"></script>

<script>
let dp;
let currentActive = null;

// 初始化播放器 + 自动播放
function initPlayer(url) {
    if (dp) dp.destroy();
    dp = new DPlayer({
        container: document.getElementById('dplayer'),
        autoplay: true,      // ✅ 自动播放
        theme: '#007bff',
        video: { url: url }
    });
}

// 切换频道 + 高亮 + 自动播放
function play(url, el) {
    initPlayer(url);
    if (currentActive) currentActive.classList.remove("active");
    el.classList.add("active");
    currentActive = el;
}

// 加载直播源
const sourceURL = "https://gh-proxy.org/https://github.com/bang359/dsj/raw/main/iphone.txt";
fetch(sourceURL)
   .then(res => res.text())
   .then(text => {
       const list = document.getElementById("channelList");
       const lines = text.split("\n").map(i=>i.trim()).filter(Boolean);
       let firstURL = null;
       let firstDiv = null;

       lines.forEach(line => {
           if(line.includes(",")){
               const [name, url] = line.split(",", 2);
               if(name && url && url.startsWith("http")){
                   const div = document.createElement("div");
                   div.className = "channel";
                   div.innerText = name;
                   div.onclick = () => play(url, div);
                   list.appendChild(div);
                   if(!firstURL) { firstURL = url; firstDiv = div; }
               }
           }
       });

       if(firstURL) play(firstURL, firstDiv);
   })
   .catch(err => {
       console.error("加载失败", err);
       alert("直播源加载失败，请刷新重试");
   });
</script>
</body>
</html>
