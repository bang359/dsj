<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>苹果电视直播</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
body{background:#000;color:#fff;padding:10px;padding-bottom:env(safe-area-inset-bottom)}
.video-box{width:100%;background:#000;border-radius:12px;overflow:hidden;margin-bottom:12px}
video{width:100%;display:block;background:#000}
.channel-list{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-height:450px;overflow-y:auto}
.channel{padding:10px;background:#1c1c1e;color:#fff;border:none;border-radius:8px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.channel.active{background:#007aff}
</style>
</head>
<body>

<div class="video-box">
  <video id="tv" playsinline controls webkit-playsinline x-webkit-airplay="allow"></video>
</div>
<div class="channel-list" id="list"></div>

<script>
const tv = document.getElementById('tv');
const list = document.getElementById('list');
let activeBtn = null;

// 你的原始直播源（不筛选、不修改）
const sourceUrl = "https://gh-proxy.org/https://github.com/bang359/dsj/raw/main/iphone.txt";

fetch(sourceUrl)
  .then(r=>r.text())
  .then(t=>{
    const lines = t.split('\n').map(i=>i.trim()).filter(i=>i);
    const channels = [];
    lines.forEach(line=>{
      if(line.includes(',')){
        const [name,url] = line.split(',',2);
        if(url && (url.includes('.m3u8')||url.includes('.ts'))){
          channels.push({name,url});
        }
      }
    });

    channels.forEach((item,i)=>{
      const btn = document.createElement('button');
      btn.className = 'channel';
      btn.textContent = item.name;
      btn.onclick = ()=>{
        if(activeBtn)activeBtn.classList.remove('active');
        activeBtn=btn;btn.classList.add('active');
        tv.src=item.url;tv.load();
        setTimeout(()=>tv.play().catch(()=>{}),100);
      };
      list.appendChild(btn);
      if(i===0)btn.click();
    });
  })
  .catch(e=>{
    alert('加载失败，请检查网络');
  });
</script>
</body>
</html>
